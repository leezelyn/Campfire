// 每帧校验视口：窗口隐藏时浏览器报告 0 尺寸且恢复可见不一定触发 resize 事件
let viewW = -1, viewH = -1;
function fitViewport() {
  const w = innerWidth, h = innerHeight;
  if (w === viewW && h === viewH) return;
  if (w < 2 || h < 2) return;
  viewW = w; viewH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  updateScales();
}
fitViewport();

/* ============================================================
   声音 —— 全部程序化合成，符合物理规律：
   · PositionalAudio + distanceModel 'inverse'：振幅 ∝ 1/r（声强 ∝ 1/r²）
   · HRTF 双耳定位：转动镜头时左右声像随之变化
   · 空气对高频的吸收：距离越远，低通截止频率越低（声音越闷）
   · 音源 = 棕噪声轰鸣 + 带通嘶声 + 泊松过程随机触发的噼啪爆裂
   ============================================================ */
const listener = new THREE.AudioListener();
camera.add(listener);

const fireSound = new THREE.PositionalAudio(listener);
fireSound.position.copy(FIRE_POS);
fireGroup.add(fireSound);

let audio = null;   // 启动后保存所有需要逐帧更新的音频节点

function makeNoiseBuffer(ctx, seconds, brown) {
  const n = Math.floor(seconds * ctx.sampleRate);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    else d[i] = w;
  }
  return buf;
}

// 短促的爆裂声样本：白噪声 × 锐利指数衰减包络
function makeCrackleBuffer(ctx) {
  const dur = 0.025 + Math.random() * 0.05;
  const n = Math.floor(dur * ctx.sampleRate);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  const k = 6 + Math.random() * 10;
  for (let i = 0; i < n; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-k * i / n * 4);
  }
  return buf;
}

function startAudio() {
  const ctx = listener.context;
  ctx.resume();
  listener.setMasterVolume(P.masterVol);

  // —— 定位声源参数（物理衰减模型）——
  fireSound.setRefDistance(2);          // 2 m 处为参考响度
  fireSound.setRolloffFactor(P.rolloff);
  fireSound.setDistanceModel('inverse');
  fireSound.panner.panningModel = 'HRTF';

  // 火焰总线 → 空气吸收低通 → 3D 定位面板
  const fireMix = ctx.createGain();
  fireMix.gain.value = 1.0;
  const airFilter = ctx.createBiquadFilter();
  airFilter.type = 'lowpass';
  airFilter.frequency.value = 12000;
  fireMix.connect(airFilter);
  fireSound.setNodeSource(airFilter);

  // 1) 低频轰鸣：棕噪声 + 低通
  const roarSrc = ctx.createBufferSource();
  roarSrc.buffer = makeNoiseBuffer(ctx, 8, true);
  roarSrc.loop = true;
  const roarLP = ctx.createBiquadFilter();
  roarLP.type = 'lowpass'; roarLP.frequency.value = 380; roarLP.Q.value = 0.5;
  const roarGain = ctx.createGain();
  roarGain.gain.value = 0.5;
  roarSrc.connect(roarLP).connect(roarGain).connect(fireMix);
  roarSrc.start();

  // 2) 嘶嘶声：白噪声 + 带通，缓慢起伏
  const hissSrc = ctx.createBufferSource();
  hissSrc.buffer = makeNoiseBuffer(ctx, 6, false);
  hissSrc.loop = true;
  const hissBP = ctx.createBiquadFilter();
  hissBP.type = 'bandpass'; hissBP.frequency.value = 2600; hissBP.Q.value = 0.8;
  const hissGain = ctx.createGain();
  hissGain.gain.value = 0.05;
  hissSrc.connect(hissBP).connect(hissGain).connect(fireMix);
  hissSrc.start();
  const hissLFO = ctx.createOscillator();
  hissLFO.frequency.value = 0.23;
  const hissLFOGain = ctx.createGain();
  hissLFOGain.gain.value = 0.022;
  hissLFO.connect(hissLFOGain).connect(hissGain.gain);
  hissLFO.start();

  // 3) 噼啪爆裂：泊松过程调度，随机音高/响度/频段
  const crackleVariants = Array.from({ length: 6 }, () => makeCrackleBuffer(ctx));
  let nextCrackle = ctx.currentTime + 0.1;
  function scheduleCrackles() {
    const horizon = ctx.currentTime + 0.3;
    // 刚加柴后的 2.5s 内爆裂声高发（拨动火堆会引发密集噼啪）
    const rate = P.crackleRate * (ctx.currentTime < crackleBoostUntil ? 3 : 1);
    if (rate < 0.1) { nextCrackle = horizon; return; }   // 滑到 0 时静音且不积压
    while (nextCrackle < horizon) {
      const src = ctx.createBufferSource();
      src.buffer = crackleVariants[(Math.random() * crackleVariants.length) | 0];
      src.playbackRate.value = 0.6 + Math.random() * 1.6;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 900 + Math.random() * 4200;
      bp.Q.value = 0.9;
      const g = ctx.createGain();
      // 5% 概率出现响亮的爆裂声（真实篝火偶发的大噼啪）
      g.gain.value = Math.random() < 0.05 ? 0.7 + Math.random() * 0.5 : 0.06 + Math.random() * 0.3;
      src.connect(bp).connect(g).connect(fireMix);
      src.start(nextCrackle);
      src.stop(nextCrackle + 0.25);
      // 指数分布的间隔 → 泊松过程，平均 rate 次/秒
      nextCrackle += 0.02 + -Math.log(1 - Math.random()) / rate;
    }
  }
  const crackleTimer = setInterval(scheduleCrackles, 120);

  // 4) 环境风声（非定位，包围听者）：棕噪声 + 漂移的低通
  const windAudio = new THREE.Audio(listener);
  const windSrc = ctx.createBufferSource();
  windSrc.buffer = makeNoiseBuffer(ctx, 10, true);
  windSrc.loop = true;
  const windLP = ctx.createBiquadFilter();
  windLP.type = 'lowpass'; windLP.frequency.value = 240; windLP.Q.value = 0.6;
  const windGain = ctx.createGain();
  windGain.gain.value = 0.045;
  windSrc.connect(windLP).connect(windGain);
  windAudio.setNodeSource(windGain);
  windSrc.start();
  const windLFO = ctx.createOscillator();
  windLFO.frequency.value = 0.06;
  const windLFOGain = ctx.createGain();
  windLFOGain.gain.value = 0.025;
  windLFO.connect(windLFOGain).connect(windGain.gain);
  windLFO.start();

  // 5) 加柴音效：低频闷响 + 湿柴受热的嘶声短暂增强
  const thudBuf = ctx.createBuffer(1, Math.floor(0.2 * ctx.sampleRate), ctx.sampleRate);
  {
    const d = thudBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      const wn = Math.random() * 2 - 1;
      last = (last + 0.04 * wn) / 1.04;
      d[i] = last * 6 * Math.exp(-i / d.length * 7);
    }
  }
  const playThud = () => {
    const src = ctx.createBufferSource();
    src.buffer = thudBuf;
    src.playbackRate.value = 0.85 + Math.random() * 0.3;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = ctx.createGain();
    g.gain.value = 1.4;
    src.connect(lp).connect(g).connect(fireMix);
    src.start();
    const now = ctx.currentTime;
    hissGain.gain.setTargetAtTime(0.16, now, 0.25);
    hissGain.gain.setTargetAtTime(0.05, now + 1.2, 0.8);
  };

  // 6) 劈柴音效：高频脆裂（噪声高速播放 + 带通）+ 低频砍击
  const playChop = () => {
    const crack = ctx.createBufferSource();
    crack.buffer = thudBuf;
    crack.playbackRate.value = 3.2 + Math.random() * 0.8;   // 0.2s 噪声 → ~60ms 脆响
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 700; bp.Q.value = 0.8;
    const g1 = ctx.createGain();
    g1.gain.value = 1.1;
    crack.connect(bp).connect(g1).connect(fireMix);
    crack.start();
    const thunk = ctx.createBufferSource();
    thunk.buffer = thudBuf;
    thunk.playbackRate.value = 1.5 + Math.random() * 0.3;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    const g2 = ctx.createGain();
    g2.gain.value = 1.2;
    thunk.connect(lp).connect(g2).connect(fireMix);
    thunk.start();
  };

  // 6.5) 海浪（海边场景）：定位声源在岸线附近——常鸣低涌 + 周期性破浪包络
  //      森林场景下 waveMix 静音；切换场景时由 applyScene 渐变
  const waveSound = new THREE.PositionalAudio(listener);
  waveSound.position.set(SEA_DIR.x * 9.5, 0, SEA_DIR.z * 9.5);
  waveSound.setRefDistance(5);
  waveSound.setDistanceModel('inverse');
  waveSound.setRolloffFactor(0.8);      // 岸线横向绵延，衰减比点源缓
  waveSound.panner.panningModel = 'HRTF';
  scene.add(waveSound);
  const waveMix = ctx.createGain();
  waveMix.gain.value = sceneMode === 'beach' ? 1 : 0;
  waveSound.setNodeSource(waveMix);
  // 常鸣海涌：棕噪声低鸣（远处浪群的背景声）
  const surfSrc = ctx.createBufferSource();
  surfSrc.buffer = makeNoiseBuffer(ctx, 9, true);
  surfSrc.loop = true;
  const surfLP = ctx.createBiquadFilter();
  surfLP.type = 'lowpass'; surfLP.frequency.value = 320; surfLP.Q.value = 0.5;
  const surfGain = ctx.createGain();
  surfGain.gain.value = 0.18;
  surfSrc.connect(surfLP).connect(surfGain).connect(waveMix);
  surfSrc.start();
  // 破浪：白噪声 + 低通扫频 + 涨-破-退包络，间隔随机
  const swellSrc = ctx.createBufferSource();
  swellSrc.buffer = makeNoiseBuffer(ctx, 7, false);
  swellSrc.loop = true;
  const swellLP = ctx.createBiquadFilter();
  swellLP.type = 'lowpass'; swellLP.frequency.value = 420; swellLP.Q.value = 0.6;
  const swellGain = ctx.createGain();
  swellGain.gain.value = 0.0001;
  swellSrc.connect(swellLP).connect(swellGain).connect(waveMix);
  swellSrc.start();
  let nextWave = ctx.currentTime + 1.5;
  const waveTimer = setInterval(() => {
    if (sceneMode !== 'beach') { nextWave = Math.max(nextWave, ctx.currentTime + 1.5); return; }
    if (nextWave > ctx.currentTime + 0.5) return;
    const t0 = Math.max(nextWave, ctx.currentTime + 0.05);
    const big = Math.random() < 0.25;                   // 偶发大浪
    const peak = (big ? 0.55 : 0.3) + Math.random() * 0.15;
    swellGain.gain.setValueAtTime(0.0001, t0);
    swellGain.gain.exponentialRampToValueAtTime(peak, t0 + 1.3 + Math.random() * 0.5);   // 浪头逼近
    swellGain.gain.exponentialRampToValueAtTime(0.06, t0 + 3.4);                          // 破碎后退浪冲刷
    swellGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.6);
    swellLP.frequency.setValueAtTime(420, t0);
    swellLP.frequency.exponentialRampToValueAtTime(big ? 2600 : 1700, t0 + 1.6);          // 破碎时白花花的高频
    swellLP.frequency.exponentialRampToValueAtTime(380, t0 + 4.5);
    nextWave = t0 + 4.8 + Math.random() * 3.5;
  }, 400);

  // 7) 远处动物：夜枭低鸣（双声 hoo-hoo）+ 偶发蟋蟀虫鸣——仅森林场景
  //    非定位、随机稀疏触发；经听者主增益 → 受总音量控制
  const critterBus = ctx.createGain();
  critterBus.gain.value = 0.5;
  critterBus.connect(listener.getInput());
  const playOwl = () => {
    const t0 = ctx.currentTime;
    for (let k = 0; k < 2; k++) {                       // 两声
      const base = 350 + Math.random() * 70;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(base * 1.18, t0 + k * 0.5);
      o.frequency.exponentialRampToValueAtTime(base, t0 + k * 0.5 + 0.18);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0 + k * 0.5);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + k * 0.5 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + k * 0.5 + 0.34);
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = base * 2;
      const g2 = ctx.createGain(); g2.gain.value = 0.05;
      o2.connect(g2).connect(g);
      o.connect(g).connect(critterBus);
      o.start(t0 + k * 0.5); o.stop(t0 + k * 0.5 + 0.4);
      o2.start(t0 + k * 0.5); o2.stop(t0 + k * 0.5 + 0.4);
    }
  };
  const playCricket = () => {
    const t0 = ctx.currentTime, n = 3 + (Math.random() * 4 | 0);
    for (let k = 0; k < n; k++) {                       // 一串短促颤鸣
      const ts = t0 + k * 0.13;
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.value = 4200 + Math.random() * 600;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, ts);
      g.gain.exponentialRampToValueAtTime(0.05, ts + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ts + 0.06);
      o.connect(g).connect(critterBus);
      o.start(ts); o.stop(ts + 0.08);
    }
  };
  const critterTimer = setInterval(() => {             // 每 8s 掷骰 → 平均十几秒一声
    if (sceneMode !== 'forest') return;                // 海边听不到林间夜枭与蟋蟀
    const r = Math.random();
    if (r < 0.4) playOwl();
    else if (r < 0.85) playCricket();
  }, 8000);

  audio = { ctx, roarGain, airFilter, crackleTimer, critterTimer, windGain, playThud, playChop, waveMix, waveTimer };
}

// 初始语言：按浏览器语言偏好自动选择（navigator.languages 从高到低逐项匹配）
// 顶部按钮可临时切换，但默认始终跟随浏览器设置，不做本地持久化
function detectLang() {
  const prefs = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for (const p of prefs) {
    const s = p.toLowerCase();
    if (s.startsWith('zh')) return 'zh';
    if (s.startsWith('ja')) return 'ja';
    if (s.startsWith('en')) return 'en';
  }
  return 'en';   // 不在支持列表内时回落英文
}
let lang = detectLang();
const CAMP_UI_FONT_BY_LANG = {
  zh: 'CampChinese',
  en: 'CampEnglish',
  ja: 'CampJapanese'
};
const CAMP_LETTER_FONT_BY_LANG = {
  zh: 'CampChinese',
  en: 'CampEnglish',
  ja: 'CampJapaneseLetter'
};
function loadCampFonts(l) {
  if (!document.fonts) return Promise.resolve();
  const families = new Set([CAMP_UI_FONT_BY_LANG[l], CAMP_LETTER_FONT_BY_LANG[l]]);
  return Promise.all([...families].map(family => document.fonts.load(`16px "${family}"`)));
}
// 注意：命名为 tr 而非 t，避免与主循环 step(dt, t) 的时间参数 t 冲突
function tr(key) { return I18N[lang][key] ?? I18N.zh[key] ?? key; }

// 绑定注册表：切换语言时统一重写 textContent / title
const boundTexts = [], boundTips = [];
function bindText(el, key) { boundTexts.push({ el, key }); el.textContent = tr(key); }
function bindTip(el, key)  { boundTips.push({ el, key });  el.title = tr(key); }
bindText(document.getElementById('ovTitle'), 'ovTitle');
bindText(document.getElementById('ovEnter'), 'ovEnter');
bindText(document.getElementById('ovHint'), 'ovHint');
bindText(document.getElementById('bdayUnlockHint'), 'unlockHint');
bindText(document.getElementById('bdayAccept'), 'acceptBlessing');
bindText(document.getElementById('bdayRepeat'), 'repeatBlessing');
bindText(document.getElementById('addLog'), 'addLog');
bindText(document.getElementById('panelTitle'), 'panelTitle');

const langBtns = [...document.querySelectorAll('#langSwitch button')];
function applyLang(l) {
  lang = l;
  document.documentElement.lang = { zh: 'zh-CN', en: 'en', ja: 'ja' }[l];
  document.title = tr('title');
  for (const b of boundTexts) b.el.textContent = tr(b.key);
  for (const b of boundTips) b.el.title = tr(b.key);
  for (const btn of langBtns) btn.classList.toggle('active', btn.dataset.lang === l);
  refreshActionButtons();
  hudTimer = 1;   // 让 HUD 在下一帧立即用新语言重绘
  loadCampFonts(l).then(() => {
    if (lang === l) buildBirthdayText();
  }).catch(() => {});
}
for (const btn of langBtns) btn.addEventListener('click', () => applyLang(btn.dataset.lang));

/* ============================================================
   场景切换（森林 / 海边）：环境组显隐 + 夜色微调 + 声景渐变
   ============================================================ */
const sceneBtns = [...document.querySelectorAll('#sceneSwitch button')];
function applyScene(mode, opts = {}) {
  sceneMode = mode;
  const beach = mode === 'beach';
  forestEnv.visible = !beach;
  beachEnv.visible = beach;
  // 天穹与雾同步换色（海边夜色偏蓝一分）；雾色始终 = 地平线色，远景无缝融入
  scene.background.setHex(SKY[mode].zenith);
  scene.fog.color.setHex(SKY[mode].horizon);
  skyDome.material.uniforms.uZenith.value.setHex(SKY[mode].zenith);
  skyDome.material.uniforms.uHorizon.value.setHex(SKY[mode].horizon);
  for (const b of sceneBtns) b.classList.toggle('active', b.dataset.scene === mode);
  if (audio) audio.waveMix.gain.setTargetAtTime(beach ? 1 : 0, audio.ctx.currentTime, 1.2);
  if (!opts.silent) showActivityMessage(beach ? 'sceneToBeach' : 'sceneToForest', 3.5);
}
for (const btn of sceneBtns) btn.addEventListener('click', () => {
  if (btn.dataset.scene !== sceneMode) applyScene(btn.dataset.scene);
});
bindText(sceneBtns[0], 'sceneForest');
bindText(sceneBtns[1], 'sceneBeach');

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
const hud = document.getElementById('hud');
let flick = 0.5;
let lightFlick = 0.5;
const lightBase = new THREE.Vector3().copy(FIRE_POS);   // 光源慢分量：低通跟随火焰质心
const lightJit  = new THREE.Vector3();                  // 光源快分量：OU 随机抖动 → 影子闪动
let windNow = 0.22;   // 瞬时风速（标量幅度，含阵风）
let windDir = 0.5;    // 风向（弧度，缓慢漂移）
let windVX = 0.19, windVZ = 0.10;   // 风矢量 = windNow×(cos,sin)，供火焰/火星/烟/雨共用
let rainNow = 0, cloudNow = 0.25;   // 平滑后的天气量（追随 P.rain / P.cloud）
let lastMoonPhase = -1;             // 月相变化时才重算太阳方向
let hudTimer = 0;
const _airGlow = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  step(Math.min(clock.getDelta(), 0.05), clock.elapsedTime);
}

function step(dt, t) {
  fitViewport();
  // 火光闪烁：随机游走 + 回归均值（驱动火焰/火星/声音的快速抖动）
  flick += (Math.random() - 0.5) * dt * 14;
  flick += (0.5 - flick) * dt * 5;
  flick = Math.max(0, Math.min(1, flick));
  // 燃料燃烧模型：新柴先闷烧（fuel 落后于 fuelTarget，期间大量冒烟），
  // 引燃后火势增强，随后以 ~50s 时间常数缓慢烧尽
  // 燃料燃烧模型：木柴随燃烧被消耗（火越旺烧得越快），不添柴则火势跌回余烬
  fuelTarget *= Math.exp(-dt / 38 * (0.7 + 0.5 * P.fireScale));
  if (fuelTarget < 0.005) fuelTarget = 0;
  fuel += (fuelTarget - fuel) * Math.min(1, dt * 0.5);
  fireHealth = fuel / (fuel + 0.8);                       // 0（余烬）→ ~1（旺火），饱和曲线
  fireDrive = P.fireScale * (0.26 + 1.05 * fireHealth);   // 无柴时降到余烬强度，需续柴维持
  // 柴堆炭化与坍塌：随燃尽程度（1-fireHealth）渐进，平滑跟随
  collapseAmt += ((1 - fireHealth) - collapseAmt) * Math.min(1, dt * 0.5);
  teepeeBarkMat.color.copy(BARK_FRESH).lerp(BARK_CHAR, collapseAmt);   // 树皮渐黑
  for (const L of teepeeLogs) {                           // 内端下沉、teepee 渐塌
    L.group.quaternion.copy(L.baseQuat).slerp(L.flatQuat, collapseAmt * 0.7);
    L.group.position.y = L.baseY - collapseAmt * 0.05;
  }
  updateAddedLogs(dt);

  // 火光亮度闪烁：响应越快，影子的明暗闪动越明显
  // （shadowFlick = 0 退回缓慢呼吸；= 1 时贴近 flick 的快速抖动）
  lightFlick += (flick - lightFlick) * Math.min(1, dt * (4 + 14 * P.shadowFlick));
  fireLight.intensity = 48 * (0.72 + 0.42 * lightFlick) * fireDrive;
  fireFill.intensity = fireLight.intensity * 0.28;   // 无影补光同步呼吸，影楔始终被填亮

  // 阵风：均值回归随机过程（OU），波动幅度与平均风速成正比。
  // 恒定风只让火焰静态倾斜；阵风才让火焰和影子持续摆动
  windNow += (P.wind - windNow) * 1.6 * dt + (Math.random() - 0.5) * P.wind * 3.5 * Math.sqrt(dt);
  windNow = Math.max(0, Math.min(windNow, P.wind * 2.5 + 0.02));

  // —— 天气系统 ——
  windDir += (Math.random() - 0.5) * dt * 0.4;                 // 风向缓慢漂移
  windVX = windNow * Math.cos(windDir);                        // 风矢量（火焰/火星/烟/雨共用）
  windVZ = windNow * Math.sin(windDir);
  rainNow += (P.rain - rainNow) * Math.min(1, dt * 0.6);       // 雨/云量平滑跟随滑块
  cloudNow += (P.cloud - cloudNow) * Math.min(1, dt * 0.5);
  fireLight.intensity *= (1 - 0.34 * rainNow);                 // 雨打火堆：火光减弱
  fireFill.intensity *= (1 - 0.34 * rainNow);
  scene.fog.density = P.fog + rainNow * 0.018 + cloudNow * 0.004;   // 雨/云加浓雾
  if (P.moonPhase !== lastMoonPhase) { setMoonPhase(P.moonPhase); lastMoonPhase = P.moonPhase; }
  for (const c of clouds) {                                    // 云层横向漂移 + 遮月加厚
    c.off += c.speed * (0.6 + windNow) * dt;
    if (c.off > 240) c.off -= 480;
    c.sprite.position.copy(c.base).addScaledVector(moonSide, c.off);
    c.sprite.material.opacity = Math.min(0.95, c.baseOp * (0.5 + 1.5 * cloudNow));
  }
  moonLight.intensity = P.moonInt * (1 - 0.7 * cloudNow);      // 云厚则月光与月面压暗
  // 天光随月光强度联动（满月夜更亮），云层遮挡时减弱；月亮方位的天空辉光同步。
  // 饱和曲线：默认 0.12 → 1.05，滑块拉满 0.6 → 1.57（线性时高达 3.45，浅色沙滩过曝发白）
  const mk = 6 * P.moonInt;
  hemiLight.intensity = (0.45 + 1.43 * mk / (1 + mk)) * (1 - 0.35 * cloudNow);
  skyDome.material.uniforms.uGlowK.value = (1 - 0.6 * cloudNow) * Math.min(1.5, P.moonInt / 0.12);
  if (moonMat) {                                               // 与天穹着色器同一公式取月亮方向天空色
    const su = skyDome.material.uniforms;
    moonMat.uniforms.uAir.value.copy(su.uHorizon.value)
      .lerp(su.uZenith.value, Math.pow(Math.max(moonDir.y, 0), 0.42))
      .add(_airGlow.copy(su.uGlow.value).multiplyScalar(0.85 * su.uGlowK.value));
  }
  if (moonMat)  moonMat.uniforms.uDim.value = 1 - 0.7 * cloudNow;
  if (moonHalo) moonHalo.material.opacity = 1 - 0.6 * cloudNow;
  // 提灯：稳定暖光中带极轻摇曳
  const lanternFlick = 0.9 + 0.07 * Math.sin(t * 6.3) + 0.03 * Math.sin(t * 23.1);
  campLight.intensity = campTidied ? 0 : LANTERN_INT * lanternFlick;
  if (lanternGlowMat) lanternGlowMat.emissiveIntensity = 2.4 * lanternFlick;
  charMat.emissiveIntensity = (0.35 + 1.35 * fireHealth) * (0.8 + 0.55 * flick);   // 炭随火势冷却变暗
  emberGlow.material.opacity = (0.3 + 0.55 * fireHealth) * (0.6 + 0.5 * flick);
  for (const e of emberBed) {
    e.mat.emissiveIntensity = e.base * (0.55 + 0.45 * flick + 0.3 * Math.sin(t * e.speed + e.phase));
  }

  updateFlames(dt, t, flick);
  updateSparks(dt, t, flick);
  updateSmoke(dt, t);
  updateRain(dt);
  updateFireflies(dt, t);
  updateMoths(dt, t);
  updateTreeSway(dt, t);
  updateLake(t);
  updateOcean(t);
  updateCampActivities(dt, t);
  updateBirthday(dt, t);

  // 影子运动 = 慢分量 + 快分量
  // 慢分量：光源低通跟随火焰质心，影子随风整体偏摆（限幅防止极端偏移）
  const kL = Math.min(1, dt * 4);
  lightBase.x += (THREE.MathUtils.clamp(flameCentroid.x, -0.5, 0.5) - lightBase.x) * kL;
  lightBase.y += (THREE.MathUtils.clamp(flameCentroid.y, 0.35, 1.0) - lightBase.y) * kL;
  lightBase.z += (THREE.MathUtils.clamp(flameCentroid.z, -0.5, 0.5) - lightBase.z) * kL;
  // 快分量：OU 随机抖动模拟火舌窜动，石头的影子随之闪动跳跃。
  // 竖直抖动改变影子长度、最显眼，幅度给得更大；火越旺（flick 高）闪动越强
  const sq = Math.sqrt(dt);
  lightJit.x += -lightJit.x * 9 * dt + (Math.random() - 0.5) * 0.7 * sq;
  lightJit.y += -lightJit.y * 9 * dt + (Math.random() - 0.5) * 1.0 * sq;
  lightJit.z += -lightJit.z * 9 * dt + (Math.random() - 0.5) * 0.7 * sq;
  lightJit.clampScalar(-0.13, 0.13);
  const jAmp = P.shadowFlick * (0.5 + 0.5 * flick);
  fireLight.position.set(
    lightBase.x + lightJit.x * jAmp,
    Math.max(0.36, lightBase.y + lightJit.y * jAmp),   // 光源不低于石顶，防影子甩到无穷远
    lightBase.z + lightJit.z * jAmp
  );
  fireFill.position.copy(fireLight.position);

  if (audio) {
    // 火势与音量联动
    audio.roarGain.gain.value = 0.42 * (0.75 + 0.5 * flick) * (0.45 + 0.55 * fireDrive);
    // 阵风掠过时风声随之增强；细雨叠加水汽嘶声
    audio.windGain.gain.value = Math.min(0.2, 0.025 + 0.055 * windNow + 0.09 * rainNow);
    // 空气吸收：高频随距离指数衰减
    const d = camera.position.distanceTo(FIRE_POS);
    const cutoff = 400 + 11600 * Math.exp(-d * P.airAbsorb / 30);
    audio.airFilter.frequency.setTargetAtTime(cutoff, audio.ctx.currentTime, 0.1);
  }

  hudTimer += dt;
  if (hudTimer > 0.25) {
    hudTimer = 0;
    const d = camera.position.distanceTo(FIRE_POS);
    const fuelStr = fuelTarget > 0.05
      ? tr('hudFuel')(fuelTarget.toFixed(1), (fireDrive / Math.max(0.01, P.fireScale)).toFixed(2)) : '';
    const lowStr = fireHealth < 0.32 ? '\n' + tr('lowFire') : '';
    hud.textContent = tr('hud')(d.toFixed(1), windNow.toFixed(2), P.wind.toFixed(2), fuelStr) + lowStr;
  }

  starMat.uniforms.uTime.value = t;   // 星光闪烁

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   🎂 生日彩蛋：输入口令 0622 触发生日主题
   流星雨 · 提灯/棉花糖换色 · 萤火虫拼字 · 祝福卡 · 生日歌
   —— 个性化内容在 BIRTHDAY 配置里编辑（占位可改）——
   ============================================================ */
const BIRTHDAY = {
  code:  '0622',                 // 生日月日口令，格式 MMDD
  name:  'NAME',                 // 萤火虫拼出的名字（用页面右下角「🎂」编辑，无需改代码）
  greet: 'Happy Birthday',       // 萤火虫拼出的祝福语
  theme: 'rainbow',              // 主题：'rainbow' 彩虹流光 / 也可填十六进制如 0xff5fa2
  card: [

try { Object.assign(BIRTHDAY, JSON.parse(localStorage.getItem('campfireBday') || '{}')); } catch {}
function normalizeBirthdayCode(value) {
  const code = String(value || '').replace(/\D/g, '').slice(0, 4);
  if (!/^\d{4}$/.test(code)) return null;
  const month = Number(code.slice(0, 2)), day = Number(code.slice(2, 4));
  const maxDay = new Date(2000, month, 0).getDate();
  return month >= 1 && month <= 12 && day >= 1 && day <= maxDay ? code : null;
}
BIRTHDAY.code = normalizeBirthdayCode(BIRTHDAY.code) || '0622';

let birthday = false, bdayTextReveal = 0, bdayRainbow = false, bdayTextActive = false;
let birthdaySettingsUnlocked = false;
const _bdayColor = new THREE.Color(0xffffff), _bdayTmp = new THREE.Color();
function applyBdayTheme() {
  bdayRainbow = (String(BIRTHDAY.theme) === 'rainbow');
  _bdayColor.set(bdayRainbow ? 0xffffff : (Number(BIRTHDAY.theme) || 0xff5fa2));
}

// —— 流星雨：天区高处随机划下的发光线段（头亮尾暗）——
const meteors = [];
for (let i = 0; i < 7; i++) {
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  mg.setAttribute('color', new THREE.BufferAttribute(new Float32Array(6), 3));
  const line = new THREE.Line(mg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  line.frustumCulled = false; line.visible = false;
  scene.add(line);
  meteors.push({ line, g: mg, head: new THREE.Vector3(), dir: new THREE.Vector3(), speed: 0, tail: 26, life: 0, maxLife: 1, active: false });
}
let meteorTimer = 0.5;
function spawnMeteor() {
  const m = meteors.find(x => !x.active); if (!m) return;
  const az = Math.random() * 6.2832, r = 220 + Math.random() * 130;
  m.head.set(Math.cos(az) * r, 150 + Math.random() * 130, Math.sin(az) * r);
  m.dir.set((Math.random() - 0.5) * 0.9, -0.7 - Math.random() * 0.5, (Math.random() - 0.5) * 0.9).normalize();
  m.speed = 240 + Math.random() * 170; m.tail = 22 + Math.random() * 24;
  m.life = 0; m.maxLife = 0.8 + Math.random() * 0.8; m.active = true; m.line.visible = true;
}
function updateMeteors(dt, t) {
  meteorTimer -= dt;
  if (meteorTimer <= 0) { spawnMeteor(); meteorTimer = 0.3 + Math.random() * 0.8; }
  for (const m of meteors) {
    if (!m.active) continue;
    m.life += dt; const f = m.life / m.maxLife;
    if (f >= 1) { m.active = false; m.line.visible = false; continue; }
    m.head.addScaledVector(m.dir, m.speed * dt);
    const pos = m.g.attributes.position.array, col = m.g.attributes.color.array;
    pos[0] = m.head.x; pos[1] = m.head.y; pos[2] = m.head.z;
    pos[3] = m.head.x - m.dir.x * m.tail; pos[4] = m.head.y - m.dir.y * m.tail; pos[5] = m.head.z - m.dir.z * m.tail;
    const b = Math.sin(Math.PI * f) * 1.1;
    col[0] = b; col[1] = b; col[2] = b * 0.95; col[3] = 0; col[4] = 0; col[5] = 0;
    m.g.attributes.position.needsUpdate = true; m.g.attributes.color.needsUpdate = true;
  }
}

// —— 萤火虫拼字："Happy Birthday" + 名字，浮在夜空（位置放低，不必仰头）——
let bdayTextSys = null; let bdayTextPts = [];
function buildBirthdayText() {
  if (bdayTextSys) { scene.remove(bdayTextSys.points); bdayTextSys.g.dispose(); bdayTextSys.mat.dispose(); }
  bdayTextPts = [];
  const cv = document.createElement('canvas'); cv.width = 768; cv.height = 320;
  const cg = cv.getContext('2d');
  cg.fillStyle = '#000'; cg.fillRect(0, 0, cv.width, cv.height);
  cg.fillStyle = '#fff'; cg.textBaseline = 'middle';

  const drawTrackedLine = (text, y, maxWidth, maxSize, minSize, weight) => {
    const chars = [...String(text || '')];
    const isLatin = chars.every(ch => ch.charCodeAt(0) < 256);
    const fontFamily = CAMP_UI_FONT_BY_LANG[lang] || CAMP_UI_FONT_BY_LANG.zh;
    let size = maxSize;
    let tracking = isLatin ? Math.max(1.5, size * 0.035) : Math.max(3, size * 0.07);
    const setFont = () => {
      cg.font = `${weight} ${size}px "${fontFamily}"`;
      tracking = isLatin ? Math.max(1.5, size * 0.035) : Math.max(3, size * 0.07);
    };
    setFont();
    const measure = () => chars.reduce((sum, ch) => sum + cg.measureText(ch).width, 0)
      + Math.max(0, chars.length - 1) * tracking;
    while (size > minSize && measure() > maxWidth) { size -= 2; setFont(); }
    let x = (cv.width - measure()) * 0.5;
    for (const ch of chars) {
      cg.fillText(ch, x, y);
      x += cg.measureText(ch).width + tracking;
    }
  };

  drawTrackedLine(BIRTHDAY.greet, 92, 680, 68, 42, 650);
  drawTrackedLine(BIRTHDAY.name, 224, 620, 108, 60, 750);

  const img = cg.getImageData(0, 0, cv.width, cv.height).data;
  const pts = [];
  const SAMPLE_STEP = 5;
  for (let y = 0; y < cv.height; y += SAMPLE_STEP) {
    for (let x = 0; x < cv.width; x += SAMPLE_STEP) {
      if (img[(y * cv.width + x) * 4] > 150) pts.push([x, y]);
    }
  }

  bdayTextSys = makeParticleSystem(Math.max(1, pts.length), '0.16', THREE.AdditiveBlending);
  bdayTextSys.points.visible = false; bdayTextSys.points.frustumCulled = false;   // 等"接受信件"后由 startBirthdayText 显示
  const center = new THREE.Vector3(-3, 4.0, -6);            // 降低高度，落在视线前方而非头顶
  const toCam = camera.position.clone().sub(center).normalize();
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), toCam).normalize();
  const up = new THREE.Vector3().crossVectors(toCam, right).normalize();
  const S = 0.0145;
  for (let i = 0; i < pts.length; i++) {
    const [px, py] = pts[i];
    const target = center.clone()
      .addScaledVector(right, (px - cv.width * 0.5) * S)
      .addScaledVector(up, -(py - cv.height * 0.5) * S);
    const ha = Math.random() * Math.PI * 2, hr = 16 + Math.random() * 18;          // 起点散布四方，随后飞入聚字
    const home = new THREE.Vector3(center.x + Math.cos(ha) * hr, Math.max(0.4, center.y + (Math.random() - 0.35) * 18), center.z + Math.sin(ha) * hr);
    bdayTextPts.push({
      home, target,
      ph: Math.random() * Math.PI * 2,
      blinkSpeed: 1.15 + Math.random() * 2.1,
      breatheSpeed: 0.35 + Math.random() * 0.55,
      delay: Math.random() * 0.35,
      hueOff: px / cv.width
    });
  }
  bdayTextReveal = 0; bdayTextActive = false;
}
buildBirthdayText();

// 从静态 bday.json 载入服务器端共享的祝福（无需后端；本地 localStorage 仍可覆盖以即时预览）
(async () => {
  try {
    const r = await fetch('bday.json', { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    if (!data || typeof data !== 'object') return;
    let local = {};
    try { local = JSON.parse(localStorage.getItem('campfireBday') || '{}'); } catch {}
    Object.assign(BIRTHDAY, data, local);                 // 默认 < 服务器文件 < 本机编辑
    BIRTHDAY.code = normalizeBirthdayCode(BIRTHDAY.code) || '0622';
    if (typeof BIRTHDAY.card === 'string') BIRTHDAY.card = BIRTHDAY.card.split('\n');

function updateBirthdayText(dt, t) {
  if (!bdayTextSys || !bdayTextActive) return;
  bdayTextSys.mat.uniforms.uScale.value = fireflySys.mat.uniforms.uScale.value;
  bdayTextReveal = Math.min(1, bdayTextReveal + dt * 0.12);   // 放慢飞入，缓缓聚拢（约 8 秒）
  for (let i = 0; i < bdayTextPts.length; i++) {
    const p = bdayTextPts[i];
    const ke = THREE.MathUtils.clamp((bdayTextReveal - p.delay) / (1 - p.delay + 1e-3), 0, 1);
    const k = ke * ke * (3 - 2 * ke);                          // smoothstep（缓入缓出）
    // 萤火虫式蜿蜒漂移：飞行途中幅度大、落位后只剩微微悬停颤动
    const wob = (1 - k) * 1.5 + 0.05;
    bdayTextSys.pos[i * 3]     = p.home.x + (p.target.x - p.home.x) * k + Math.sin(t * p.breatheSpeed * 1.3 + p.ph) * wob;
    bdayTextSys.pos[i * 3 + 1] = p.home.y + (p.target.y - p.home.y) * k + Math.sin(t * p.breatheSpeed * 0.9 + p.ph * 2.1) * wob * 0.75;
    bdayTextSys.pos[i * 3 + 2] = p.home.z + (p.target.z - p.home.z) * k + Math.cos(t * p.breatheSpeed * 1.1 + p.ph * 1.5) * wob;
    const pulse = 0.5 + 0.5 * Math.sin(t * p.blinkSpeed + p.ph);
    const flash = Math.pow(pulse, 5);                         // 短促亮起，模拟萤火虫发光脉冲
    const breathe = 0.5 + 0.5 * Math.sin(t * p.breatheSpeed + p.ph * 1.7);
    const glow = 0.18 + 0.22 * breathe + 0.78 * flash;       // 保留微光，避免字形完全消失
    if (bdayRainbow) _bdayTmp.setHSL((t * 0.045 + p.hueOff * 0.72) % 1, 0.68, 0.68);   // 柔和彩虹横向流动
    else _bdayTmp.setRGB(_bdayColor.r * 0.6 + 0.4, _bdayColor.g * 0.6 + 0.32, _bdayColor.b * 0.6 + 0.2);
    bdayTextSys.col[i * 3] = _bdayTmp.r;
    bdayTextSys.col[i * 3 + 1] = _bdayTmp.g;
    bdayTextSys.col[i * 3 + 2] = _bdayTmp.b;
    bdayTextSys.sz[i] = (0.035 + 0.022 * glow) * (0.78 + 0.22 * k);
    bdayTextSys.al[i] = (0.35 + 0.65 * k) * Math.min(1, 0.12 + 0.92 * glow);   // 飞行途中也可见，落位后更亮
  }
  bdayTextSys.g.attributes.position.needsUpdate = true;
  bdayTextSys.g.attributes.aColor.needsUpdate = true;
  bdayTextSys.g.attributes.aSize.needsUpdate = true;
  bdayTextSys.g.attributes.aAlpha.needsUpdate = true;
}
// 萤火虫从四方飞入、聚成文字（"接受信件"后触发）
function startBirthdayText() {
  if (!bdayTextSys) return;
  bdayTextActive = true; bdayTextReveal = 0;
  bdayTextSys.points.visible = true;

// —— 🎵 生日歌（程序合成《Happy Birthday》旋律，经主增益）——
function playBirthdaySong() {
  const ctx = listener.context; if (!ctx) return;
  ctx.resume();
  const bus = ctx.createGain(); bus.gain.value = 0.5; bus.connect(listener.getInput());
  const F = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const mel = [
    ['G4', .5], ['G4', .5], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .5], ['G4', .5], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .5], ['G4', .5], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 1],
    ['F5', .5], ['F5', .5], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2],
  ];
  const beat = 0.44; let t0 = ctx.currentTime + 0.25;
  for (const [n, b] of mel) {
    const dur = b * beat;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = F[n];
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = F[n] * 2;
    const g = ctx.createGain(), g2 = ctx.createGain(); g2.gain.value = 0.22;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.96);
    o.connect(g).connect(bus); o2.connect(g2).connect(g);
    o.start(t0); o.stop(t0 + dur); o2.start(t0); o2.stop(t0 + dur);
    t0 += dur;
  }
}

// —— 触发 + 每帧更新 ——
function activateBirthday() {
  if (birthday) return;
  if (!campTidied) tidyCampItems();
  birthday = true;
  campLight.intensity = Math.max(campLight.intensity, 5);
  if (!bdayRainbow) {                                      // 固定色一次设好；彩虹色由每帧更新
    campLight.color.copy(_bdayColor);
    if (lanternGlowMat) {
      lanternGlowMat.emissive.copy(_bdayColor);
      lanternGlowMat.color.copy(_bdayColor).lerp(new THREE.Color(0xffffff), 0.55);
    }
  }
  bdayTextActive = false;
  if (bdayTextSys) bdayTextSys.points.visible = false;   // 萤火虫文字等"接受信件"后再从四方飞来
  showBirthdayCard();
  playBirthdaySong();
}
function updateBirthday(dt, t) {
  if (!birthday) return;
  updateMeteors(dt, t);
  updateBirthdayText(dt, t);
  if (bdayRainbow) {                                       // 提灯：彩虹流光
    const lh = (t * 0.08) % 1;
    campLight.color.setHSL(lh, 0.82, 0.6);
    if (lanternGlowMat) { lanternGlowMat.emissive.setHSL(lh, 0.82, 0.55); lanternGlowMat.color.setHSL(lh, 0.5, 0.82); }
  }
  const hue = (t * 0.18) % 1;                              // 棉花糖：生日限定彩虹款（覆盖烘烤上色）
  marshmallowMat.color.setHSL(hue, 0.6, 0.62);
  marshmallowMat.emissive.setHSL(hue, 0.55, 0.5);
  marshmallowMat.emissiveIntensity = Math.max(marshmallowMat.emissiveIntensity, 0.14);
}

      $('beCode').reportValidity();
      return;
    }
    $('beCode').setCustomValidity('');
    BIRTHDAY.name  = $('beName').value.trim() || 'NAME';
    BIRTHDAY.greet = $('beGreet').value.trim() || 'Happy Birthday';
    BIRTHDAY.card  = $('beCard').value.split('\n');
    BIRTHDAY.theme = $('beTheme').value;
    BIRTHDAY.code  = nextCode;
    try { localStorage.setItem('campfireBday', JSON.stringify(BIRTHDAY)); } catch {}
    applyBdayTheme(); buildBirthdayText(); close();
    const ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('hidden')) ov.click();        // 进入并预览
    if (!birthday) activateBirthday();
    else {
      showBirthdayCard();
      if (!bdayRainbow) {
        campLight.color.copy(_bdayColor);
        if (lanternGlowMat) { lanternGlowMat.emissive.copy(_bdayColor); lanternGlowMat.color.copy(_bdayColor).lerp(new THREE.Color(0xffffff), 0.55); }
      }
    }
  });
  const gear = $('bdayGear'); if (gear) gear.addEventListener('click', open);
}

/* ============================================================
   🧊 Blender 互通：glTF 2.0（.glb）导出 + 覆盖加载
   ------------------------------------------------------------
   · 导出：参数面板底部「Blender 模型」选择整个场景或单个模型 → 下载 <名称>.glb，
     Blender 中 File ▸ Import ▸ glTF 2.0 直接打开（米制；Y-up 自动转 Z-up；材质为 Principled BSDF）。
     导出前先做一次"Blender 友好化"转换（不改动运行中的场景）：
       - 粒子 / 精灵 / 线段 / 着色器材质 / 叠加发光片（火焰、星空、月亮、碎光等运行时特效）不导出
       - InstancedMesh 展开为共享同一网格的多个对象（Blender 中为关联复制，改一个全部同步）
       - 凹凸贴图（glTF 核心规范无 bump）换算为法线贴图
       - flipY 纹理的法线贴图翻转绿通道（导出器会上下翻转图像，否则 Blender 中凹凸方向反了）
       - 未使用顶点色的几何去掉 COLOR_0（Blender 会把顶点色乘进底色导致发黑）
       - flatShading 材质的几何拆成硬边（glTF 没有"平直着色"开关）
       - 平行光按实际照射方向写入节点朝向（KHR_lights_punctual）；半球光 glTF 无对应，跳过
       - 未命名对象自动补名，大纲视图可读
   · 覆盖加载：assets/models/procedural/models.json 中把某个模型设为 true，页面启动时用
     assets/models/procedural/<名称>.glb 替换程序化模型（摆放位置 / 缩放 / 动画挂点保持不变）。
     在 Blender 中微调后按同名导出 .glb 覆盖该文件，刷新页面即可看到效果
   ============================================================ */
// v1「程序模型覆盖」：程序化模型导出后在 Blender 中微调，再放回页面替换。
// 与正式资产（assets/models/*.glb，由 AssetManager + ModelRegistry 加载）分开存放
const MODEL_DIR = 'assets/models/procedural/';
const TEMPLATE_SEED = 11;                 // 树木模板（导出单棵树）使用的固定随机种子
// 可导出的目标（顺序即下拉菜单顺序）
const EXPORT_TARGETS = [
  'scene', 'terrain', 'mountains', 'coast', 'spruce', 'pine', 'palm',
  'tent', 'chair', 'backpack', 'lantern', 'woodpile', 'stump', 'mug', 'firepit'
];
// 可被 Blender 模型覆盖的目标（其余只导出：地形被树木/散布物的落地计算依赖，火堆柴有坍塌动画）
// 营地道具已全部升级为正式 GLB 资产（ModelRegistry），不再走覆盖流程；只剩远山 / 海岸 / 三种树
const OVERRIDABLE = new Set(['mountains', 'coast', 'spruce', 'pine', 'palm']);

// 导出源：mode = 'scene' 整个场景 / 'world' 保留世界坐标 / 'local' 以自身原点导出（去掉摆放位移与朝向，保留缩放）
function exportSource(key) {
  switch (key) {
    case 'scene': return { root: scene, mode: 'scene' };
    case 'terrain': return { root: scene.getObjectByName(sceneMode === 'beach' ? 'BeachTerrain' : 'Terrain'), mode: 'world' };
    case 'mountains': return { root: mountains, mode: 'world' };
    case 'coast': return { root: coastHills, mode: 'world' };
    case 'spruce': case 'pine': return { root: makeConiferGroup(key, TEMPLATE_SEED), mode: 'local', temp: true };
    case 'palm': return { root: buildPalm(TEMPLATE_SEED), mode: 'local', temp: true };
    case 'firepit': return { root: fireGroup, mode: 'local' };
    default: return PROP_GROUPS[key] ? { root: PROP_GROUPS[key], mode: 'local' } : null;
  }
}

function isExportableMaterial(m) {
  if (!m || m.isShaderMaterial || m.isRawShaderMaterial || m.isPointsMaterial || m.isSpriteMaterial || m.isLineBasicMaterial) return false;
  if (m.blending === THREE.AdditiveBlending) return false;   // 叠加发光特效（湖面/海面碎光、炭床余光等）
  if (m.transparent && m.opacity < 0.01) return false;       // 当前完全透明的动态特效（蒸汽等）
  return !!(m.isMeshStandardMaterial || m.isMeshBasicMaterial || m.isMeshLambertMaterial || m.isMeshPhongMaterial);
}

// 以画布逐像素处理纹理图像（凹凸→法线、法线翻绿通道共用）
function textureToCanvas(tex, maxSize = 1024) {
  const img = tex.image;
  if (!img || !img.width) return null;
  const w = Math.min(img.width, maxSize), h = Math.min(img.height, maxSize);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  return { cv, g, w, h, data: g.getImageData(0, 0, w, h) };
}
function canvasTextureLike(src, cv, suffix) {
  const t = new THREE.CanvasTexture(cv);
  t.name = (src.name || 'texture') + suffix;
  t.wrapS = src.wrapS; t.wrapT = src.wrapT;
  t.repeat.copy(src.repeat); t.offset.copy(src.offset); t.rotation = src.rotation;
  t.flipY = src.flipY; t.channel = src.channel;
  return t;
}
// 凹凸（高度）贴图 → 切线空间法线贴图（中心差分）。直接生成 glTF 约定（OpenGL，绿=图像上方），
// 并预先抵消导出器对 flipY 纹理的上下翻转
function bumpToNormal(tex, bumpScale, ctx) {
  const key = `${tex.uuid}:${bumpScale}`;
  if (ctx.tex.has(key)) return ctx.tex.get(key);
  const c = textureToCanvas(tex);
  if (!c) return null;
  const { w, h, data: { data: d } } = c;
  const L = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) L[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 765;
  const k = 3 * THREE.MathUtils.clamp(bumpScale / 0.03, 0.4, 2);
  const gy = tex.flipY ? -1 : 1;
  const out = c.g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const yu = ((y - 1 + h) % h) * w, yd = ((y + 1) % h) * w;
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      let nx = -(L[y * w + xr] - L[y * w + xl]) * k;
      let ny = gy * (L[yu + x] - L[yd + x]) * k;
      const inv = 1 / Math.hypot(nx, ny, 1);
      const o = (y * w + x) * 4;
      out.data[o] = (nx * inv * 0.5 + 0.5) * 255;
      out.data[o + 1] = (ny * inv * 0.5 + 0.5) * 255;
      out.data[o + 2] = (inv * 0.5 + 0.5) * 255;
      out.data[o + 3] = 255;
    }
  }
  c.g.putImageData(out, 0, 0);
  const t = canvasTextureLike(tex, c.cv, '_normal');
  ctx.tex.set(key, t);
  return t;
}
function glTFNormalMap(tex, ctx) {
  if (!tex.flipY) return tex;                   // 未翻转的纹理与 glTF 约定一致，原样导出
  const key = `${tex.uuid}:flipG`;
  if (ctx.tex.has(key)) return ctx.tex.get(key);
  const c = textureToCanvas(tex);
  if (!c) return tex;
  const d = c.data.data;
  for (let i = 1; i < d.length; i += 4) d[i] = 255 - d[i];
  c.g.putImageData(c.data, 0, 0);
  const t = canvasTextureLike(tex, c.cv, '_gl');
  ctx.tex.set(key, t);
  return t;
}

function exportMaterial(mat, ctx) {
  if (ctx.mat.has(mat.uuid)) return ctx.mat.get(mat.uuid);
  const m = mat.clone();
  m.name = mat.name || `${mat.type.replace('Material', '')}_${mat.color ? mat.color.getHexString() : 'x'}`;
  if (m.normalMap) m.normalMap = glTFNormalMap(m.normalMap, ctx);
  else if (m.bumpMap) {
    const n = bumpToNormal(m.bumpMap, m.bumpScale, ctx);
    if (n) { m.normalMap = n; m.normalScale = new THREE.Vector2(1, 1); }
  }
  m.bumpMap = null;
  m.bumpScale = 1;                              // ≠1 时导出器会写 EXT_materials_bump（Blender 不识别）
  // 只有粗糙度贴图的非金属材质：粗糙度贴图兼作金属度贴图（metallicFactor=0 使其 B 通道不起作用），
  // 否则导出器会为每个材质各合成一张 metallicRoughness 图（石圈 14 块石头 = 14 张重复大图）
  if (m.roughnessMap && !m.metalnessMap && m.metalness === 0) m.metalnessMap = m.roughnessMap;
  ctx.mat.set(mat.uuid, m);
  return m;
}

function exportGeometry(geo, mat, ctx) {
  const key = `${geo.uuid}:${mat.vertexColors ? 'c' : ''}:${mat.flatShading ? 'f' : ''}`;
  if (ctx.geo.has(key)) return ctx.geo.get(key);
  let g = new THREE.BufferGeometry();
  for (const a of ['position', 'normal', 'uv', 'uv1']) if (geo.attributes[a]) g.setAttribute(a, geo.attributes[a]);
  if (mat.vertexColors && geo.attributes.color) g.setAttribute('color', geo.attributes.color);
  if (geo.index) g.setIndex(geo.index);
  if (mat.flatShading) {                        // 拆成独立三角形并重算面法线 = 硬边
    g = g.index ? g.toNonIndexed() : g.clone();
    g.deleteAttribute('normal');
  }
  if (!g.attributes.normal) g.computeVertexNormals();
  ctx.geo.set(key, g);
  return g;
}

function exportLight(src) {
  if (!(src.intensity > 0)) return null;
  let l;
  if (src.isPointLight) l = new THREE.PointLight(src.color, src.intensity, src.distance, 2);
  else if (src.isSpotLight) l = new THREE.SpotLight(src.color, src.intensity, src.distance, src.angle, src.penumbra, 2);
  else if (src.isDirectionalLight) l = new THREE.DirectionalLight(src.color, src.intensity);
  else return null;                             // Hemisphere / Ambient：glTF 没有对应光源类型
  l.name = src.name || 'Light';
  l.position.copy(src.position);
  if (l.target) {
    // glTF 平行光/聚光沿节点 -Z 照射：把实际照射方向（光源 → 目标，换算到父节点坐标系）写进节点朝向
    const dir = src.target.getWorldPosition(new THREE.Vector3()).sub(src.getWorldPosition(new THREE.Vector3())).normalize();
    if (src.parent) dir.applyQuaternion(src.parent.getWorldQuaternion(new THREE.Quaternion()).invert());
    l.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir);
    l.add(l.target);
    l.target.position.set(0, 0, -1);
  }
  return l;
}

// 场景对象 → 导出用的新对象树（共享几何数据，不修改原场景）
function toExportNode(src, ctx, force = false) {
  if (!src) return null;
  if (!force && (!src.visible || src.userData.noExport)) return null;
  if (src.isPoints || src.isLine || src.isSprite || src.isCamera) return null;
  if (src.isLight) return exportLight(src);
  let node;
  if (src.isMesh) {
    const mat = src.material;
    if (Array.isArray(mat) || !isExportableMaterial(mat)) return null;
    const geo = exportGeometry(src.geometry, mat, ctx), m = exportMaterial(mat, ctx);
    if (src.isInstancedMesh) {
      node = new THREE.Group();
      const mtx = new THREE.Matrix4();
      for (let i = 0; i < src.count; i++) {
        src.getMatrixAt(i, mtx);
        const inst = new THREE.Mesh(geo, m);
        mtx.decompose(inst.position, inst.quaternion, inst.scale);
        inst.name = `${src.name || 'Instance'}_${String(i).padStart(3, '0')}`;
        node.add(inst);
      }
    } else {
      node = new THREE.Mesh(geo, m);
    }
  } else {
    node = new THREE.Group();
  }
  node.name = src.name;
  node.position.copy(src.position);
  node.quaternion.copy(src.quaternion);
  node.scale.copy(src.scale);
  // 阴影开关标记随 glTF extras 带进 Blender（自定义属性），覆盖加载时读回
  for (const k of ['noCastShadow', 'noCastShadowTree']) if (src.userData[k]) node.userData[k] = true;
  for (const c of src.children) {
    const n = toExportNode(c, ctx);
    if (n) node.add(n);
  }
  if (!src.isMesh && !node.children.length && !src.name) return null;   // 空的辅助节点（音源等）
  return node;
}

function buildExportTree(key) {
  const src = exportSource(key);
  if (!src || !src.root) return null;
  const ctx = { geo: new Map(), mat: new Map(), tex: new Map() };
  let root;
  if (src.mode === 'scene') {
    root = new THREE.Group();
    root.name = 'CampfireScene';
    for (const c of scene.children) {
      const n = toExportNode(c, ctx);
      if (n) root.add(n);
    }
    const cam = new THREE.PerspectiveCamera(camera.fov, camera.aspect, camera.near, camera.far);
    cam.name = 'Camera';
    cam.position.copy(camera.position);
    cam.quaternion.copy(camera.quaternion);
    root.add(cam);
  } else {
    root = toExportNode(src.root, ctx, true);
    if (src.mode === 'local') {
      root.position.set(0, 0, 0);
      root.quaternion.identity();
    } else {
      src.root.updateWorldMatrix(true, false);
      src.root.matrixWorld.decompose(root.position, root.quaternion, root.scale);
    }
  }
  if (!root.name) root.name = key;
  // 自动补名：父名_序号，Blender 大纲视图不再是一串 "Mesh.001"
  root.traverse(o => {
    o.children.forEach((c, i) => {
      if (!c.name) c.name = `${o.name}_${c.isMesh ? 'Mesh' : 'Node'}${String(i).padStart(2, '0')}`;
    });
  });
  return { root, ctx, temp: src.temp ? src.root : null };
}

// 修改 .glb 的 JSON 块并重新打包（GLB = 12 字节头 + JSON 块 + BIN 块，块长 4 字节对齐）
function patchGLBJson(glb, fn) {
  const dv = new DataView(glb);
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(new Uint8Array(glb, 20, jsonLen)));
  fn(json);
  const text = new TextEncoder().encode(JSON.stringify(json));
  const pad = (4 - text.length % 4) % 4;
  const jsonBytes = new Uint8Array(text.length + pad).fill(0x20);
  jsonBytes.set(text);
  const rest = new Uint8Array(glb, 20 + jsonLen);            // BIN 块（含块头）原样保留
  const out = new Uint8Array(12 + 8 + jsonBytes.length + rest.length);
  const ov = new DataView(out.buffer);
  ov.setUint32(0, 0x46546C67, true);                          // 'glTF'
  ov.setUint32(4, 2, true);
  ov.setUint32(8, out.length, true);
  ov.setUint32(12, jsonBytes.length, true);
  ov.setUint32(16, 0x4E4F534A, true);                         // 'JSON'
  out.set(jsonBytes, 20);
  out.set(rest, 20 + jsonBytes.length);
  return out.buffer;
}

// 导出为 .glb（ArrayBuffer）；download=true 时触发浏览器下载 <key>.glb
async function exportGLB(key = 'scene', { download = true } = {}) {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const built = buildExportTree(key);
  if (!built) throw new Error(`unknown export target: ${key}`);
  let glb;
  try {
    glb = await new GLTFExporter().parseAsync(built.root, { binary: true, onlyVisible: true, maxTextureSize: 2048 });
    glb = patchGLBJson(glb, json => {
      json.asset.generator = 'Campfire (three.js GLTFExporter r165) — Blender-ready export';
      if (json.scenes?.[0]) json.scenes[0].name = `Campfire_${key}`;   // 替换导出器默认的 "AuxScene"
      // r165 导出器把 metallicRoughnessTexture 的 UV 通道写成了非法的 "channel" 字段（应为 texCoord）
      for (const m of json.materials || []) {
        const t = m.pbrMetallicRoughness?.metallicRoughnessTexture;
        if (t && 'channel' in t) { t.texCoord = t.channel; delete t.channel; }
      }
    });
  } finally {
    if (built.temp) built.temp.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
    for (const t of built.ctx.tex.values()) t.dispose();
  }
  if (download) {
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a');
    a.href = url; a.download = `${key}.glb`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  return glb;
}

/* —— 覆盖加载：Blender 编辑后的 .glb 替换程序化模型 —— */
function disposeReplaced(o) {
  // 只释放几何（材质/贴图可能与其它对象共享，交给 GC）
  o.traverse(c => { if (c.isMesh) c.geometry.dispose(); });
}
function overrideTree(species, tpl) {
  tpl.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = !/foliage|frond/i.test(o.name); } });
  for (const t of trees) {
    if (t.species !== species) continue;
    const old = t.g.children.find(c => c.userData.treeTemplate === species);
    if (old) { t.g.remove(old); disposeReplaced(old); }
    const inst = tpl.clone();
    inst.userData.treeTemplate = species;
    t.g.add(inst);
  }
  if (species === 'palm') return;
  // 背景林：按模板的每个网格重建 InstancedMesh，沿用原有实例矩阵
  const olds = forestBackdrop.children.filter(c => c.userData.treeTemplate === species);
  tpl.updateMatrixWorld(true);
  const parts = [];
  tpl.traverse(o => { if (o.isMesh) parts.push(o); });
  for (const src of olds.filter(c => c.name.endsWith('_Trunk'))) {
    const m = new THREE.Matrix4();
    const mats = [];
    for (let i = 0; i < src.count; i++) { src.getMatrixAt(i, m); mats.push(m.clone()); }
    for (const part of parts) {
      const im = new THREE.InstancedMesh(part.geometry.clone().applyMatrix4(part.matrixWorld), part.material, mats.length);
      mats.forEach((mm, i) => im.setMatrixAt(i, mm));
      im.name = `Backdrop_${species}_${part.name}`;
      im.userData.treeTemplate = species;
      im.computeBoundingSphere();
      forestBackdrop.add(im);
    }
  }
  for (const o of olds) { forestBackdrop.remove(o); o.geometry.dispose(); o.dispose(); }
}
// 远景（山体/海岸）：整组替换；与程序化版本一致，不投影不受影（远在火光阴影范围外）
function overrideDistant(group, loaded) {
  for (const c of [...group.children]) { group.remove(c); disposeReplaced(c); }
  loaded.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = false; applyDistantFog(o.material); } });
  group.add(loaded);
}
function applyModelOverride(key, loaded) {
  if (key === 'spruce' || key === 'pine' || key === 'palm') overrideTree(key, loaded);
  else if (key === 'mountains' || key === 'coast') overrideDistant(key === 'mountains' ? mountains : coastHills, loaded);
}
async function loadModelOverrides() {
  let cfg;
  try {
    const r = await fetch(MODEL_DIR + 'models.json', { cache: 'no-cache' });
    if (!r.ok) return;
    cfg = await r.json();
  } catch { return; }                           // 无配置文件 / file:// 打开：保持程序化模型
  const use = cfg.use || {};
  const keys = Object.keys(use).filter(k => use[k] && OVERRIDABLE.has(k));
  if (!keys.length) return;
  for (const key of keys) {
    const file = typeof use[key] === 'string' ? use[key] : `${key}.glb`;
    try {
      const gltf = await assets.loadGLTF(MODEL_DIR + file);   // 与正式资产共用同一个 GLTFLoader
      applyModelOverride(key, gltf.scene);
      console.info(`[models] ${key} ← ${MODEL_DIR}${file}`);
    } catch (e) {
      console.warn(`[models] ${key}: 加载 ${MODEL_DIR}${file} 失败，保留程序化模型`, e);
    }
  }
}

// 启动前预编译全部材质（含当前隐藏的水壶/支架/蒸汽等）：
// 首次点燃火把、煮水等交互不再因着色器即时编译而掉帧
renderer.compile(scene, camera);
animate();

/* ============================================================
   参数滑块面板
   ============================================================ */
{
  // [文案键（同 P 中的键，标签随语言切换）, min, max, step, 自定义应用函数?, 是否有悬停提示（键 + 'Tip'）]
  const groups = [
    ['gFlame', [
      ['fireScale', 0.2, 2, 0.01],
      ['buoyancy', 0.5, 6, 0.1],
      ['sparkRate', 0, 60, 1],
      ['smokeRate', 0, 20, 0.5],
      ['wind', 0, 1.5, 0.01, null, true],
      ['shadowFlick', 0, 1, 0.01, null, true]
    ]],
    ['gSound', [
      ['masterVol', 0, 1, 0.01,
        v => { P.masterVol = v; listener.setMasterVolume(v); }],
      ['crackleRate', 0, 15, 0.5],
      ['rolloff', 0, 4, 0.05,
        v => { P.rolloff = v; fireSound.setRolloffFactor(v); }, true],
      ['airAbsorb', 0, 3, 0.05, null, true]
    ]],
    ['gWeather', [
      ['rain', 0, 1, 0.01, null, true],
      ['cloud', 0, 1, 0.01, null, true],
      ['moonPhase', 0, 180, 1, null, true]
    ]],
    ['gEnv', [
      ['moonInt', 0, 0.6, 0.01,
        v => { P.moonInt = v; moonLight.intensity = v; }],
      ['fog', 0, 0.04, 0.001,
        v => { P.fog = v; scene.fog.density = v; }],
      ['exposure', 0.4, 2, 0.01,
        v => { P.exposure = v; renderer.toneMappingExposure = v; }]
    ]]
  ];

  const body = document.getElementById('panelBody');
  for (const [gkey, items] of groups) {
    const h = document.createElement('div');
    h.className = 'pgroup';
    bindText(h, gkey);
    body.appendChild(h);
    for (const [key, min, max, stp, apply, hasTip] of items) {
      const row = document.createElement('label');
      row.className = 'prow';
      if (hasTip) bindTip(row, key + 'Tip');
      const name = document.createElement('span');
      name.className = 'pname';
      bindText(name, key);
      const val = document.createElement('span');
      val.className = 'pval';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = stp; input.value = P[key];
      const dec = stp >= 1 ? 0 : stp >= 0.1 ? 1 : stp >= 0.01 ? 2 : 3;
      const show = v => { val.textContent = Number(v).toFixed(dec); };
      show(P[key]);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        (apply || (x => { P[key] = x; }))(v);
        show(v);
      });
      row.append(name, val, input);
      body.appendChild(row);
    }
  }

  // 🧊 Blender 模型导出：选择目标 → 下载 <名称>.glb
  {
    const h = document.createElement('div');
    h.className = 'pgroup';
    bindText(h, 'gBlender');
    const row = document.createElement('div');
    row.className = 'bl-row';
    const sel = document.createElement('select');
    sel.id = 'exportTarget';
    for (const k of EXPORT_TARGETS) {
      const o = document.createElement('option');
      o.value = k;
      bindText(o, 'm_' + k);
      sel.appendChild(o);
    }
    const btn = document.createElement('button');
    btn.id = 'exportBtn';
    bindText(btn, 'exportGlb');
    bindTip(btn, 'exportTip');
    const note = document.createElement('div');
    note.className = 'bl-note';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      note.textContent = tr('exporting');
      try {
        await exportGLB(sel.value);
        note.textContent = tr('exportDone')(sel.value);
      } catch (e) {
        console.error(e);
        note.textContent = tr('exportFail');
      }
      btn.disabled = false;
    });
    row.append(sel, btn);
    body.append(h, row, note);
  }

  const panel = document.getElementById('panel');
  const arrow = document.getElementById('panelArrow');
  document.getElementById('panelHead').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    arrow.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
  });
}

// 加柴按钮（短冷却防止连点刷屏）
{
  const btn = document.getElementById('addLog');
  btn.addEventListener('click', () => {
    tossLog();
    btn.disabled = true;
    setTimeout(() => { btn.disabled = false; }, 700);
  });
}

// 应用初始语言（标题、html lang、高亮对应按钮；面板标签已在构建时按当前语言写入）
applyLang(lang);

// 调试钩子：在 rAF 被节流的环境（如隐藏窗口）中手动驱动帧
window.__campfire = {
  renderer, scene, camera, step, P, applyLang, applyScene, tossLog, activateBirthday,
  startRoasting, startKettle, toggleTorch, throwPinecone, startChopping, tidyCampItems, placeCampItems,
  exportGLB, loadModelOverrides, EXPORT_TARGETS,
  isCampTidied: () => campTidied,
  getFuel: () => ({ fuel, fuelTarget, fireHealth, fireDrive, collapseAmt }) };

addEventListener('resize', fitViewport);

// Blender 编辑过的模型（assets/models/models.json 中启用的）在场景就绪后替换程序化模型
loadModelOverrides();
</script>
</body>
</html>

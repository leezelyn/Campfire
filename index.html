// PBR 贴图组（移植自 KettleCampfireSculptor：1024px albedo/roughness/normal/AO，
// 参考图提取的实拍级石材与铸铁材质）；同名组只加载一次
const PBR_TEXTURE_CACHE = {};
function loadPbrTextures(name, repeat) {
  if (PBR_TEXTURE_CACHE[name]) return PBR_TEXTURE_CACHE[name];
  const loader = new THREE.TextureLoader();
  const mk = (file, srgb) => {
    const t = loader.load(`assets/textures/${name}/${file}.png`);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat, repeat);
    t.channel = 0;                        // aoMap 也走基础 UV
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  return (PBR_TEXTURE_CACHE[name] = {
    map: mk('albedo', true),
    roughnessMap: mk('roughness'),
    normalMap: mk('normal'),
    aoMap: mk('ao')
  });
}

// 石圈：更大更圆、紧密围合（参考图）——石块造型与 PBR 石材移植自 KettleCampfireSculptor：
// 变形二十面体（宏观正弦起伏 + 中观颗粒）+ 实拍级贴图；面向火心一侧仍叠烟熏渐变
// 色调保持偏深：近火石块被强光直射，反照率偏浅在 ACES 映射下会过曝成白
{
  const rng = mulberry32(21);    // 布局随机流
  const crng = mulberry32(55);   // 颜色随机流（独立流，保证布局不变）
  const stoneTex = loadPbrTextures('stone', 1.1);
  const n = 14;
  const v = new THREE.Vector3(), nrm = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.18;
    const radius = (0.19 + rng() * 0.1) * 0.9;   // 位移平均外扩,基准略缩,总体量与旧版持平
    // 变形二十面体石块（KettleCampfireSculptor 的造型函数，缩放到营地尺度）；
    // 焊接顶点 → 平滑法线（Icosahedron 原生非索引，直接重算法线会退化成棱面着色）
    const geo = mergeVertices(new THREE.IcosahedronGeometry(radius, 2));
    {
      const pos = geo.attributes.position;
      const seed = i + 1;
      for (let j = 0; j < pos.count; j++) {
        v.fromBufferAttribute(pos, j);
        nrm.copy(v).normalize();
        const macro = Math.sin(nrm.x * 4.1 + seed * 1.7)
                    * Math.cos(nrm.y * 3.3 - seed * 0.9)
                    * Math.sin(nrm.z * 3.7 + seed * 0.61);
        const meso = Math.sin((nrm.x + nrm.z) * 10.5 + seed * 2.31);
        v.multiplyScalar(1 + macro * 0.12 + meso * 0.028);
        pos.setXYZ(j, v.x, v.y, v.z);
      }
    }
    // 随机翻滚烘进几何（而非 mesh.rotation），这样烟熏渐变能按最终朝向计算
    geo.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(
      new THREE.Euler(rng() * 3, rng() * 3, rng() * 3)));
    geo.computeVertexNormals();
    // 烟熏渐变：面向火心（略偏上）的一侧被熏黑，叠噪声避免均匀渐变的塑料感
    const toFire = new THREE.Vector3(-Math.cos(a), 0.55, -Math.sin(a)).normalize();
    const pos = geo.attributes.position;
    const col = new Float32Array(pos.count * 3);
    for (let j = 0; j < pos.count; j++) {
      v.fromBufferAttribute(pos, j);
      nrm.copy(v).normalize();
      const facing = THREE.MathUtils.smoothstep(nrm.dot(toFire), -0.1, 0.85);
      const soot = facing * (0.75 + 0.25 * triNoise(v.x * 9, v.y * 9, v.z * 9, i));
      const shade = 1 - 0.62 * Math.max(0, soot);
      col[j * 3] = shade; col[j * 3 + 1] = shade; col[j * 3 + 2] = shade;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const rockMat = new THREE.MeshStandardMaterial({
      map: stoneTex.map,
      roughnessMap: stoneTex.roughnessMap,
      normalMap: stoneTex.normalMap,
      aoMap: stoneTex.aoMap,
      normalScale: new THREE.Vector2(0.55, 0.55),
      aoMapIntensity: 0.78,
      color: new THREE.Color().setHSL(0.075 + crng() * 0.03, 0.10 + crng() * 0.08, 0.26 + crng() * 0.08),
      roughness: 0.92,
      vertexColors: true
    });
    rockMat.name = `FireStone_${i}`;
    const rock = new THREE.Mesh(geo, rockMat);
    rock.name = `FireStone_${i}`;
    rock.position.set(Math.cos(a) * 0.98, 0.085, Math.sin(a) * 0.98);   // 略下沉，底部融进土里
    rock.scale.set(1 + rng() * 0.3, 0.72, 1);
    rock.castShadow = true;
    rock.receiveShadow = true;
    fireGroup.add(rock);
  }
}

// 木柴：放射状围成圆锥（俯视呈辐条状、正视呈帐篷状），内端炭化发光
// 随燃烧推进：树皮渐黑（BARK_FRESH→BARK_CHAR）、teepee 内端下沉坍塌
let charMat, barkMat;
let teepeeBarkMat;   // 火堆木柴的树皮材质（随燃尽变黑）：程序化 barkMat 或 GLB 的 Bark
const BARK_FRESH = new THREE.Color(0x33200f), BARK_CHAR = new THREE.Color(0x0c0805);
const teepeeLogs = [];
let tossLogKit = null;   // 「加柴」用的 GLB 木柴模板（无炭段、不随火堆炭化的新鲜树皮）
let logEndMat;   // 年轮端面材质（新加的柴也用）
{
  barkMat = new THREE.MeshStandardMaterial({ name: 'FirewoodBark', color: BARK_FRESH.clone(), roughness: 0.95 });
  // 树皮凹凸贴图：纵向皮条 + 横向细裂（凹凸随 barkMat 颜色炭化依然有效）
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const g = cv.getContext('2d');
    const brng = mulberry32(17);
    g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 260; i++) {
      const l = (70 + brng() * 130) | 0;
      g.fillStyle = `rgba(${l},${l},${l},${0.3 + brng() * 0.4})`;
      g.fillRect(brng() * 256, brng() * 256, 1.5 + brng() * 3, 14 + brng() * 60);
    }
    for (let i = 0; i < 40; i++) {
      g.fillStyle = `rgba(30,30,30,${0.25 + brng() * 0.3})`;
      g.fillRect(brng() * 256, brng() * 256, 5 + brng() * 22, 1 + brng() * 2);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    barkMat.bumpMap = t;
    barkMat.bumpScale = 0.012;
  }
  // 年轮端面：同心环 + 径向细裂纹
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    const ernG = mulberry32(29);
    g.fillStyle = '#8a6b48'; g.fillRect(0, 0, 128, 128);
    for (let r = 58; r > 3; r -= 3 + ernG() * 5) {
      g.strokeStyle = `rgba(60,38,20,${0.35 + ernG() * 0.35})`;
      g.lineWidth = 1 + ernG() * 1.6;
      g.beginPath();
      g.arc(64 + (ernG() - 0.5) * 4, 64 + (ernG() - 0.5) * 4, r, 0, 7);
      g.stroke();
    }
    for (let i = 0; i < 7; i++) {
      const a = ernG() * 6.28;
      g.strokeStyle = 'rgba(35,22,12,0.55)';
      g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(64, 64);
      g.lineTo(64 + Math.cos(a) * (30 + ernG() * 30), 64 + Math.sin(a) * (30 + ernG() * 30));
      g.stroke();
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    logEndMat = new THREE.MeshStandardMaterial({ name: 'LogEndGrain', map: t, roughness: 0.9 });
  }
  charMat = new THREE.MeshStandardMaterial({
    name: 'Charcoal', color: 0x140a05, emissive: 0xff4a10, emissiveIntensity: 1.4, roughness: 1
  });
  // 炭段发光改为龟裂亮纹（暗底 + 白裂缝的 emissiveMap），
  // 比整段均匀发光更像烧透的木炭；亮度仍由 step() 里的 emissiveIntensity 驱动
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    const crng2 = mulberry32(37);
    g.fillStyle = '#242424'; g.fillRect(0, 0, 128, 128);   // 暗底保留少量整体余光
    g.strokeStyle = '#ffffff';
    for (let i = 0; i < 26; i++) {
      g.lineWidth = 1 + crng2() * 2.4;
      g.globalAlpha = 0.5 + crng2() * 0.5;
      g.beginPath();
      let x = crng2() * 128, y = crng2() * 128;
      g.moveTo(x, y);
      for (let k = 0; k < 3; k++) {
        x += (crng2() - 0.5) * 34; y += (crng2() - 0.3) * 30;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    charMat.emissiveMap = t;
  }
  const rng = mulberry32(8);
  const n = 8;
  const up = new THREE.Vector3(0, 1, 0);
  teepeeBarkMat = barkMat;
  // Stage 5：木柴改用 Blender 资产（firewood.glb，三段长短粗细不同；原点 = 外端截面中心、轴向 +Y）。
  // GLB 树皮自带颜色贴图，炭化改为对白色的乘色（与程序化 BARK_FRESH→BARK_CHAR 的亮度比一致）
  let glbLogs = null;
  try {
    const kits = await Promise.all([0.66, 0.70, 0.74].map(len => createLogInstance(assets, len)));
    glbLogs = kits;
    teepeeBarkMat = kits[0].materials.bark;
    charMat = kits[0].materials.char;
    BARK_FRESH.setRGB(1, 1, 1);
    BARK_CHAR.setRGB(0.11, 0.17, 0.3);
    // 加柴模板：隐去炭段，树皮换成独立的新鲜材质（不参与火堆炭化）
    const freshBark = teepeeBarkMat.clone();
    freshBark.name = 'BarkFresh';
    for (const k of kits) {
      k.parts.charEnd.visible = false;
      k.parts.bark.traverse(o => { if (o.isMesh) o.material = freshBark; });
    }
    tossLogKit = kits.map(k => ({ root: k.root, length: k.def.length }));
    // 模板已被加柴占用：火堆的 8 根另行实例化
  } catch (e) {
    console.warn('[assets] firewood.glb unavailable, falling back to procedural logs:', e.message || e);
  }
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.25;
    const rOut = 0.62 + rng() * 0.06;
    const outer = new THREE.Vector3(Math.cos(a) * rOut, 0.11, Math.sin(a) * rOut);
    const inner = new THREE.Vector3(Math.cos(a) * 0.05, 0.40 + rng() * 0.10, Math.sin(a) * 0.05);
    const dir = inner.clone().sub(outer);
    const len = dir.length();
    const radius = 0.062 + rng() * 0.022;
    const log = new THREE.Group();
    log.name = `TeepeeLog_${i}`;
    log.position.copy(outer);
    const ndir = dir.clone().normalize();
    log.quaternion.setFromUnitVectors(up, ndir);
    if (glbLogs) {
      // 按所需长度挑最接近的一段，并绕自身轴随机转一下，避免 8 根看起来一模一样
      const m = await createLogInstance(assets, len);
      m.root.rotation.y = rng() * Math.PI * 2;
      log.add(m.root);
    } else {
      const bark = new THREE.Mesh(makeLogGeometry(radius * 0.8, radius, len, i * 4.1 + 1), barkMat);
      bark.position.y = len / 2;
      bark.castShadow = true;
      log.add(bark);
      // 外端年轮面（朝外微露，正对镜头一侧看得到）
      const cap = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.92, 12), logEndMat);
      cap.rotation.x = Math.PI / 2;
      cap.position.y = -0.004;
      log.add(cap);
      // 靠近火心的一段烧成炭并发光
      const char = new THREE.Mesh(makeLogGeometry(radius * 0.84, radius * 1.02, len * 0.38, i * 4.1 + 2), charMat);
      char.position.y = len * 0.78;
      log.add(char);
    }
    fireGroup.add(log);
    // 坍塌目标姿态：内端下沉、整体趋于平铺
    const flatDir = new THREE.Vector3(ndir.x, ndir.y * 0.18, ndir.z).normalize();
    const flatQuat = new THREE.Quaternion().setFromUnitVectors(up, flatDir);
    teepeeLogs.push({ group: log, baseQuat: log.quaternion.clone(), flatQuat, baseY: outer.y });
  }
}

// 红炭床：铺满石圈内部的炽热煤块，各自独立脉动（参考图俯视效果）
const emberBed = [];
{
  const rng = mulberry32(5);
  for (let i = 0; i < 46; i++) {
    const rr = 0.66 * Math.sqrt(rng());
    const a = rng() * Math.PI * 2;
    const mat = new THREE.MeshStandardMaterial({
      color: 0x140803, roughness: 1,
      emissive: new THREE.Color().setHSL(0.03 + rng() * 0.05, 1.0, 0.42 + rng() * 0.14),
      emissiveIntensity: 0.9 + rng() * 1.6
    });
    mat.name = 'Ember';
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(0.034 + rng() * 0.05, 0), mat);
    c.name = `Ember_${i}`;
    c.position.set(Math.cos(a) * rr, 0.025 + rng() * 0.045, Math.sin(a) * rr);
    c.rotation.set(rng() * 3, rng() * 3, rng() * 3);
    c.scale.y = 0.55;
    fireGroup.add(c);
    emberBed.push({ mat, base: mat.emissiveIntensity, phase: rng() * 6.28, speed: 1.5 + rng() * 3 });
  }
}

// 炭床的整体余光（叠加混合的径向光斑）
const emberGlow = new THREE.Mesh(
  new THREE.CircleGeometry(0.95, 40),
  new THREE.MeshBasicMaterial({
    map: radialTexture(128, [
      [0, 'rgba(255,120,30,0.65)'], [0.45, 'rgba(255,70,12,0.28)'], [1, 'rgba(255,40,0,0)']
    ]),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  })
);
emberGlow.rotation.x = -Math.PI / 2;
emberGlow.position.y = 0.02;
fireGroup.add(emberGlow);

// 火光：decay = 2 → 光照强度服从平方反比定律（物理正确）
// 投影光源 = 慢分量 + 快分量：慢分量跟随火焰发光质心（风吹火斜，
// 影子整体偏摆）；快分量是模拟火舌窜动的随机抖动加快速亮度闪烁，
// 让石头、木柴的影子在地面上闪动跳跃
const fireLight = new THREE.PointLight(0xff7a28, 48, 0, 2);
fireLight.position.copy(FIRE_POS);
fireLight.castShadow = true;
fireLight.shadow.mapSize.set(1024, 1024);   // 较低分辨率让 PCF 影缘更宽更柔
fireLight.shadow.camera.near = 0.2;
fireLight.shadow.camera.far = 35;
fireLight.shadow.bias = -0.003;
// normalBias 0.04 过大：石块/木柴贴地处影子被整体推离物体（peter-panning），
// 物体像悬浮在地面上；0.02 仍足以压住曲面上的阴影条纹
fireLight.shadow.normalBias = 0.02;
// 火焰是有体积的光源，影子本应有较宽半影；点光阴影的 PCF 采样半径随 radius 放大，
// 石圈投在地上的放射状"花瓣"硬影因此变柔
fireLight.shadow.radius = 2.5;
fireLight.name = 'FireLight';
fireGroup.add(fireLight);

// 无影补光：与主光同位置、约 28% 强度、不投影。火焰是"体积光源"，
// 石块影子本应有宽半影并被环境反弹填充——补光把死黑的放射硬影
// 提亮成柔和半影，总照度与原先持平（48 × 1.28 ≈ 62）
const fireFill = new THREE.PointLight(0xff8a38, 13, 0, 2);
fireFill.name = 'FireFill';
fireFill.position.copy(FIRE_POS);
fireGroup.add(fireFill);

/* ============================================================
   营地点缀：柴垛、树桩+斧头、搪瓷杯——走 placeProp 体系，
   与其它道具一起投影/受火光/被「收拾物品」收纳
   （放在此处：依赖上面已初始化的 barkMat 树皮凹凸与 logEndMat 年轮）
   ============================================================ */
{
  const pileWood = new THREE.MeshStandardMaterial({
    name: 'StackedWood', color: 0x4a2f17, roughness: 0.95, bumpMap: barkMat.bumpMap, bumpScale: 0.012
  });
  // 柴垛：两层交错码放的短柴，两端年轮面朝外
  function makeWoodPile() {
    const g = new THREE.Group();
    g.name = 'WoodPile';
    const rng = mulberry32(71);
    let n = 0;
    for (let row = 0; row < 2; row++) {
      const count = 4 - row;
      for (let k = 0; k < count; k++) {
        const len = 0.56 + rng() * 0.12;
        const rad = 0.052 + rng() * 0.016;
        const one = new THREE.Group();
        one.name = `SplitLog_${n}`;
        one.position.set(
          (rng() - 0.5) * 0.05,
          rad + row * 0.095,
          (k - (count - 1) / 2) * 0.145 + (rng() - 0.5) * 0.02
        );
        one.rotation.y = (rng() - 0.5) * 0.12;
        const body = new THREE.Mesh(makeLogGeometry(rad * 0.92, rad, len, 40 + n * 3.7), pileWood);
        body.rotation.z = Math.PI / 2;
        one.add(body);
        for (const sx of [-1, 1]) {
          const cap = new THREE.Mesh(new THREE.CircleGeometry(rad * 0.88, 10), logEndMat);
          cap.rotation.y = sx * Math.PI / 2;
          cap.position.x = sx * (len / 2 + 0.002);
          one.add(cap);
        }
        g.add(one);
        n++;
      }
    }
    return g;
  }
  // 树桩：劈柴用的矮木桩，顶面年轮，斜劈进一把斧头
  function makeStump() {
    const g = new THREE.Group();
    g.name = 'ChopStump';
    const stump = new THREE.Mesh(makeLogGeometry(0.16, 0.185, 0.34, 77), pileWood);
    stump.name = 'Stump';
    stump.position.y = 0.17;
    g.add(stump);
    const top = new THREE.Mesh(new THREE.CircleGeometry(0.148, 14), logEndMat);
    top.rotation.x = -Math.PI / 2;
    top.position.y = 0.342;
    g.add(top);
    const axe = new THREE.Group();
    axe.name = 'Axe';                       // 覆盖加载时按此名找回斧头（劈柴动画要抡它）
    const handle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.013, 0.016, 0.44, 7),
      new THREE.MeshStandardMaterial({ name: 'AxeHandle', color: 0x6d4a26, roughness: 0.9 })
    );
    handle.position.y = 0.2;
    axe.add(handle);
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.042, 0.055, 0.12),
      new THREE.MeshStandardMaterial({ name: 'AxeHead', color: 0x33383e, metalness: 0.75, roughness: 0.35 })
    );
    head.position.set(0, 0, 0.025);
    axe.add(head);
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.011, 0.06, 0.05),

    blade.position.set(0, -0.014, 0.098);
    axe.add(blade);
    axe.position.set(0.045, 0.36, -0.03);   // 刃口没入桩顶
    axe.rotation.set(0.12, 0.4, -0.42);

    g.userData.axe = axe;                   // 劈柴互动要抡它
    return g;
  }
  // 搪瓷杯：珐琅白杯身 + 深色包边 + 环形把手
  function makeMug() {
    const g = new THREE.Group();
    g.name = 'Mug';
    const enamel = new THREE.MeshStandardMaterial({ name: 'Enamel', color: 0xdfe4e6, roughness: 0.35, metalness: 0.1 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.038, 0.085, 12), enamel);
    body.position.y = 0.0425;
    g.add(body);
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.041, 0.004, 6, 14),
      new THREE.MeshStandardMaterial({ color: 0x3a5a74, roughness: 0.4 })
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.085;
    g.add(rim);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.005, 6, 12, Math.PI), enamel);
    handle.position.set(0.046, 0.05, 0);
    handle.rotation.z = -Math.PI / 2;
    g.add(handle);
    return g;
  }
  // Stage 5b：劈柴桩 + 斧头（chopping.glb 两个根节点）、柴垛、搪瓷杯改用 Blender 资产，失败回退程序化模型。
  // 斧头原点 = 斧眼中心（柄 +Y、刃 +Z），与劈柴关键帧的枢轴约定一致；静置位姿取桩上的 AxeSocket
  async function makeChopRigAsset() {
    const [st, ax] = await Promise.all([createStumpInstance(assets), createAxeInstance(assets)]);
    const g = new THREE.Group();
    g.name = 'ChopStump';
    g.add(st.root, ax.root);
    const sock = st.anchors.axeSocket;
    const e = new THREE.Euler().setFromQuaternion(sock.quaternion, 'XYZ');
    g.userData.axeRest = { p: sock.position.toArray(), r: [e.x, e.y, e.z] };
    g.userData.top = st.anchors.top.position.y;
    ax.root.position.copy(sock.position);
    ax.root.rotation.copy(e);
    g.userData.axe = ax.root;                 // 劈柴互动要抡它
    return g;
  }
  placeProp(await assetOrFallback('woodpile', makeWoodPile), 2.95, 2.7, true, 'woodpile');   // 柴垛：帐篷旁的后侧
  try {
    chopRig = await makeChopRigAsset();
  } catch (e) {
    console.warn('[assets] chopping.glb unavailable, falling back to the procedural stump:', e.message || e);
    chopRig = makeStump();
  }
  placeProp(chopRig, -0.95, 2.45, true, 'stump');           // 劈柴桩：火把架外侧
  placeProp(await assetOrFallback('mug', makeMug), 0.34, 1.5, true, 'mug');   // 搪瓷杯：折叠椅脚边
}

/* ============================================================
   粒子着色器（火焰 / 火星 / 烟共用，程序化圆形光斑）
   ============================================================ */
function makeParticleMaterial(softness, blending) {
  return new THREE.ShaderMaterial({
    uniforms: { uScale: { value: 1 } },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute vec3  aColor;
      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uScale;
      void main() {
        vColor = aColor;
        vAlpha = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uScale / max(0.1, -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, ${softness}, d) * vAlpha;
        if (a < 0.003) discard;
        gl_FragColor = vec4(vColor, a);
      }`,
    transparent: true,
    depthWrite: false,
    blending
  });
}

function makeParticleSystem(count, softness, blending) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sz  = new Float32Array(count);
  const al  = new Float32Array(count);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(sz, 1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(al, 1));
  const mat = makeParticleMaterial(softness, blending);
  const points = new THREE.Points(g, mat);
  points.frustumCulled = false;
  scene.add(points);
  return { g, pos, col, sz, al, mat, points };
}

function updateScales() {
  // 把粒子的"世界尺寸"换算到屏幕像素：size * (h / 2tan(fov/2)) / z
  const s = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const ps of [flameSys, sparkSys, smokeSys, rainSys, fireflySys, torchFlameSys]) ps.mat.uniforms.uScale.value = s;
}

/* ============================================================
   火焰粒子 —— 三层焰体（焰底蓝光 / 内焰白黄核心 / 外焰橙红焰膜）
   热浮力上升 + 空气阻力 + 向轴心收束 + 湍流
   ============================================================ */
const FLAME_N = 340;
const flameSys = makeParticleSystem(FLAME_N, '0.04', THREE.AdditiveBlending);

// 三层焰体结构（参照真实火焰分层）：
// 0 内焰——贴近轴心的白黄明亮核心（炽热碳粒发光，亮度最高）
// 1 外焰——包络核心的橙红半透明焰膜（完全燃烧区，发光弱、升得高、受风大）
// 2 焰底——木柴间隙的幽蓝一次燃烧区（短寿命、贴地、微弱）
const FLAME_LAYERS = [
  { buoy: 0.95, converge: 3.6, windK: 1.0, turbK: 0.7, alphaK: 1.00, size: 0.30 },
  { buoy: 1.00, converge: 1.9, windK: 1.8, turbK: 1.3, alphaK: 0.26, size: 0.55 },
  { buoy: 0.45, converge: 2.6, windK: 0.6, turbK: 0.4, alphaK: 0.22, size: 0.30 }
];
// 外焰透明度刻意压低：叠加混合下不透明度过高会累积饱和成黄白，
// 把橙红色相全部冲掉，层次就消失了
const FLAME_RAMPS = [
  // 内焰：白热 → 明黄 → 橙
  [[0.00, 1.00, 1.00, 0.88], [0.40, 1.00, 0.86, 0.42], [0.75, 1.00, 0.60, 0.14], [1.00, 0.80, 0.30, 0.04]],
  // 外焰：橙 → 深红 → 暗熄（绿分量低，叠加后仍保持红橙色相）
  [[0.00, 1.00, 0.50, 0.10], [0.35, 0.95, 0.30, 0.04], [0.70, 0.65, 0.12, 0.015], [1.00, 0.18, 0.02, 0.00]],
  // 焰底：幽蓝
  [[0.00, 0.30, 0.50, 1.00], [0.55, 0.18, 0.32, 0.85], [1.00, 0.05, 0.10, 0.35]]
];

const flames = [];
for (let i = 0; i < FLAME_N; i++) flames.push(spawnFlame({}, Math.random()));
// 火焰的发光质心：投影光源跟随它，影子随风摆动
const flameCentroid = new THREE.Vector3().copy(FIRE_POS);

function spawnFlame(p, lifeFrac = 0) {
  const u = Math.random();
  p.layer = u < 0.42 ? 0 : (u < 0.93 ? 1 : 2);
  const a = Math.random() * Math.PI * 2;
  if (p.layer === 0) {                       // 内焰：窄核心柱（升不高，留出红色焰尖）
    const r = 0.10 * Math.sqrt(Math.random());
    p.x = Math.cos(a) * r; p.z = Math.sin(a) * r;
    p.y = 0.14 + Math.random() * 0.2;
    p.vy = 0.8 + Math.random() * 0.6;
    p.maxLife = 0.3 + Math.random() * 0.35;
  } else if (p.layer === 1) {                // 外焰：环形包络，升得更高
    const r = 0.15 + 0.20 * Math.sqrt(Math.random());
    p.x = Math.cos(a) * r; p.z = Math.sin(a) * r;
    p.y = 0.08 + Math.random() * 0.26;
    p.vy = 0.7 + Math.random() * 1.1;
    p.maxLife = 0.7 + Math.random() * 0.95;
  } else {                                   // 焰底：贴地蓝光环
    const r = 0.16 + 0.16 * Math.random();
    p.x = Math.cos(a) * r; p.z = Math.sin(a) * r;
    p.y = 0.05 + Math.random() * 0.08;
    p.vy = 0.25 + Math.random() * 0.35;
    p.maxLife = 0.3 + Math.random() * 0.3;
  }
  p.vx = (Math.random() - 0.5) * 0.25;
  p.vz = (Math.random() - 0.5) * 0.25;
  p.life = lifeFrac * p.maxLife;
  p.seed = Math.random() * 100;
  return p;
}

// 按层取色：f 为归一化生命（温度冷却进度）
function flameColor(f, ramp, out) {
  for (let i = 0; i < ramp.length - 1; i++) {
    if (f <= ramp[i + 1][0]) {
      const t = (f - ramp[i][0]) / (ramp[i + 1][0] - ramp[i][0]);
      out[0] = ramp[i][1] + (ramp[i + 1][1] - ramp[i][1]) * t;
      out[1] = ramp[i][2] + (ramp[i + 1][2] - ramp[i][2]) * t;
      out[2] = ramp[i][3] + (ramp[i + 1][3] - ramp[i][3]) * t;
      return;
    }
  }
}

const _c = [0, 0, 0];
function updateFlames(dt, t, flick) {
  const BUOY = P.buoyancy, DRAG = 1.3;
  let fcx = 0, fcy = 0, fcz = 0, fw = 0;
  for (let i = 0; i < FLAME_N; i++) {
    const p = flames[i];
    p.life += dt;
    if (p.life >= p.maxLife) spawnFlame(p);
    const f = p.life / p.maxLife;
    const L = FLAME_LAYERS[p.layer];

    p.vy += BUOY * L.buoy * (1.0 - 0.55 * f) * dt;             // 热气浮升力（随冷却减弱）
    const k = Math.max(0, 1 - DRAG * dt);                       // 空气阻力
    p.vx *= k; p.vy *= k; p.vz *= k;
    const turb = 1.5 * L.turbK;                                 // 外焰湍流强、内焰平稳
    p.vx += Math.sin(t * 3.1 + p.seed * 1.7 + p.y * 2.2) * turb * dt;
    p.vz += Math.cos(t * 2.6 + p.seed * 2.3 + p.y * 2.2) * turb * dt;
    p.vx += windVX * 1.4 * L.windK * dt;                        // 受风（矢量：含风向）
    p.vz += windVZ * 1.4 * L.windK * dt;
    p.vx += -p.x * L.converge * dt;                             // 内焰强收束成窄核心柱
    p.vz += -p.z * L.converge * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

    flameSys.pos[i*3] = p.x; flameSys.pos[i*3+1] = p.y; flameSys.pos[i*3+2] = p.z;
    flameColor(f, FLAME_RAMPS[p.layer], _c);
    flameSys.col[i*3] = _c[0]; flameSys.col[i*3+1] = _c[1]; flameSys.col[i*3+2] = _c[2];
    flameSys.sz[i] = (L.size * (1 - 0.72 * f) + 0.05) * (0.85 + 0.3 * flick) * (0.55 + 0.45 * fireDrive);
    flameSys.al[i] = Math.pow(Math.sin(Math.PI * Math.min(1, f * 1.15)), 0.7) * 0.85 * L.alphaK * (0.28 + 0.72 * fireHealth);   // 火势弱时焰体淡去，只剩余烬
    // 内焰最亮，对发光质心的贡献最大
    const wgt = flameSys.al[i] * (1.2 - f) * (p.layer === 0 ? 1.5 : p.layer === 1 ? 0.7 : 0.15);
    fcx += p.x * wgt; fcy += p.y * wgt; fcz += p.z * wgt; fw += wgt;
  }
  if (fw > 1e-3) flameCentroid.set(fcx / fw, fcy / fw, fcz / fw);
  flameSys.g.attributes.position.needsUpdate = true;
  flameSys.g.attributes.aColor.needsUpdate = true;
  flameSys.g.attributes.aSize.needsUpdate = true;
  flameSys.g.attributes.aAlpha.needsUpdate = true;
}

/* ============================================================
   火星 —— 重力 + 空气阻力 + 近火处的热上升气流（羽流）
   ============================================================ */
const SPARK_N = 130;
const sparkSys = makeParticleSystem(SPARK_N, '0.15', THREE.AdditiveBlending);
const sparks = [];
for (let i = 0; i < SPARK_N; i++) sparks.push({ alive: false, life: 0, maxLife: 1 });
let sparkAcc = 0;

function spawnSpark(p, o) {
  p.alive = true;
  if (o) {                                   // 指定起点（加柴落点的迸溅）
    p.x = o.x + (Math.random() - 0.5) * 0.22;
    p.y = o.y + Math.random() * 0.15;
    p.z = o.z + (Math.random() - 0.5) * 0.22;
  } else {
    p.x = (Math.random() - 0.5) * 0.3;
    p.y = 0.3 + Math.random() * 0.5;
    p.z = (Math.random() - 0.5) * 0.3;
  }
  const a = Math.random() * Math.PI * 2;
  const lat = (0.2 + Math.random() * 0.8) * (o ? 1.7 : 1);
  p.vx = Math.cos(a) * lat;
  p.vy = (1.5 + Math.random() * 2.8) * (o ? 1.25 : 1);
  p.vz = Math.sin(a) * lat;
  p.life = 0;
  p.maxLife = 0.8 + Math.random() * 1.6;
  p.seed = Math.random() * 100;
}

function updateSparks(dt, t, flick) {
  const G = -9.8, DRAG = 0.45;
  // 加柴落点的火星迸溅
  while (burstQueue.length) {
    const b = burstQueue.pop();
    for (let k = 0; k < b.n; k++) {
      const p = sparks.find(s => !s.alive);
      if (!p) break;
      spawnSpark(p, b);
    }
  }
  sparkAcc += dt * P.sparkRate * (0.6 + 0.8 * flick) * (1 + 0.5 * fuel); // 火越旺，迸出的火星越多
  while (sparkAcc >= 1) {
    sparkAcc -= 1;
    const p = sparks.find(s => !s.alive);
    if (p) spawnSpark(p);
  }
  for (let i = 0; i < SPARK_N; i++) {
    const p = sparks[i];
    if (!p.alive) { sparkSys.al[i] = 0; continue; }
    p.life += dt;
    const f = p.life / p.maxLife;
    if (f >= 1 || (p.y < 0.03 && p.vy < 0)) { p.alive = false; sparkSys.al[i] = 0; continue; }

    const plume = 11 * Math.exp(-p.y / 1.1);          // 热羽流升力随高度指数衰减
    p.vy += (G + plume) * dt;                          // 重力 + 上升气流
    const k = Math.max(0, 1 - DRAG * dt);              // 空气阻力
    p.vx *= k; p.vy *= k; p.vz *= k;
    p.vx += Math.sin(t * 5 + p.seed) * 0.6 * dt;       // 气流扰动
    p.vz += Math.cos(t * 4 + p.seed) * 0.6 * dt;
    p.vx += windVX * 0.9 * dt;                         // 阵风吹偏火星（矢量）
    p.vz += windVZ * 0.9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

    sparkSys.pos[i*3] = p.x; sparkSys.pos[i*3+1] = p.y; sparkSys.pos[i*3+2] = p.z;
    const cool = 1 - f;                                // 余烬冷却变暗变红
    sparkSys.col[i*3] = 1.0; sparkSys.col[i*3+1] = 0.35 + 0.45 * cool; sparkSys.col[i*3+2] = 0.05 + 0.18 * cool;
    sparkSys.sz[i] = 0.035 + 0.03 * cool;
    sparkSys.al[i] = cool * (0.55 + 0.45 * Math.sin(t * 35 + p.seed * 9));   // 闪烁
  }
  sparkSys.g.attributes.position.needsUpdate = true;
  sparkSys.g.attributes.aColor.needsUpdate = true;
  sparkSys.g.attributes.aSize.needsUpdate = true;
  sparkSys.g.attributes.aAlpha.needsUpdate = true;
}

/* ============================================================
   烟 —— 缓慢上升、受风漂移、膨胀消散
   ============================================================ */
const SMOKE_N = 55;
const smokeSys = makeParticleSystem(SMOKE_N, '0.42', THREE.NormalBlending);
const smokes = [];
for (let i = 0; i < SMOKE_N; i++) smokes.push({ alive: false });
let smokeAcc = 0;
const WIND = new THREE.Vector3(0.22, 0, 0.08);

function spawnSmoke(p) {
  p.alive = true;
  p.x = (Math.random() - 0.5) * 0.25;
  p.y = 0.9 + Math.random() * 0.3;
  p.z = (Math.random() - 0.5) * 0.25;
  p.vx = (Math.random() - 0.5) * 0.1;
  p.vy = 0.55 + Math.random() * 0.35;
  p.vz = (Math.random() - 0.5) * 0.1;
  p.life = 0;
  p.maxLife = 3.2 + Math.random() * 2.2;
  p.seed = Math.random() * 100;
}

function updateSmoke(dt, t) {
  WIND.set(windVX, 0, windVZ);                      // 烟随风向矢量漂移
  // 刚投入未引燃的湿柴大量冒烟 + 雨打火堆腾起的水汽（rainNow）
  smokeAcc += dt * P.smokeRate * (1 + 0.35 * fuel + 1.3 * Math.max(0, fuelTarget - fuel) + 2.0 * rainNow);
  while (smokeAcc >= 1) {
    smokeAcc -= 1;
    const p = smokes.find(s => !s.alive);
    if (p) spawnSmoke(p);
  }
  for (let i = 0; i < SMOKE_N; i++) {
    const p = smokes[i];
    if (!p.alive) { smokeSys.al[i] = 0; continue; }
    p.life += dt;
    const f = p.life / p.maxLife;
    if (f >= 1) { p.alive = false; smokeSys.al[i] = 0; continue; }

    p.vx += (WIND.x - p.vx) * 0.4 * dt;               // 风的拖拽使烟逐渐随风漂移
    p.vz += (WIND.z - p.vz) * 0.4 * dt;
    p.vx += Math.sin(t * 0.9 + p.seed) * 0.15 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

    smokeSys.pos[i*3] = p.x; smokeSys.pos[i*3+1] = p.y; smokeSys.pos[i*3+2] = p.z;
    const warm = Math.max(0, 1 - f * 3);              // 底部的烟被火从下方微微照亮
    smokeSys.col[i*3] = 0.30 + 0.25 * warm;
    smokeSys.col[i*3+1] = 0.29 + 0.12 * warm;
    smokeSys.col[i*3+2] = 0.32 + 0.03 * warm;
    smokeSys.sz[i] = 0.35 + f * 2.2;                  // 膨胀
    smokeSys.al[i] = Math.min(f * 5, 1) * (1 - f) * 0.16;
  }
  smokeSys.g.attributes.position.needsUpdate = true;
  smokeSys.g.attributes.aColor.needsUpdate = true;
  smokeSys.g.attributes.aSize.needsUpdate = true;
  smokeSys.g.attributes.aAlpha.needsUpdate = true;
}

/* ============================================================
   细雨 —— 受风斜落的雨丝，强度 P.rain；雨中火更弱、更多水汽、雾更浓
   ============================================================ */
const RAIN_N = 360;
const rainSys = makeParticleSystem(RAIN_N, '0.30', THREE.AdditiveBlending);
const rainP = [];
for (let i = 0; i < RAIN_N; i++) rainP.push({ x: 0, y: -1, z: 0, vy: 0, init: false });
function spawnRain(p) {
  p.x = (Math.random() * 2 - 1) * 16;      // 火堆周围 ±16m 的雨幕
  p.y = 6 + Math.random() * 8;
  p.z = (Math.random() * 2 - 1) * 16;
  p.vy = -(6.5 + Math.random() * 5);       // 下落速度
  p.init = true;
}
let rainHidden = false;
function updateRain(dt) {
  if (rainNow < 0.01) {                     // 无雨：清零一次后跳过，省开销
    if (!rainHidden) { for (let i = 0; i < RAIN_N; i++) rainSys.al[i] = 0; rainSys.g.attributes.aAlpha.needsUpdate = true; rainHidden = true; }
    return;
  }
  rainHidden = false;
  const active = Math.floor(RAIN_N * rainNow);
  for (let i = 0; i < RAIN_N; i++) {
    if (i >= active) { rainSys.al[i] = 0; continue; }
    const p = rainP[i];
    if (!p.init) spawnRain(p);
    p.y += p.vy * dt;
    p.x += windVX * 1.6 * dt;               // 雨被风吹斜
    p.z += windVZ * 1.6 * dt;
    if (p.y < 0.03) spawnRain(p);           // 落地回收
    rainSys.pos[i*3] = p.x; rainSys.pos[i*3+1] = p.y; rainSys.pos[i*3+2] = p.z;
    rainSys.col[i*3] = 0.52; rainSys.col[i*3+1] = 0.60; rainSys.col[i*3+2] = 0.78;
    rainSys.sz[i] = 0.07;
    rainSys.al[i] = 0.42 * rainNow;
  }
  rainSys.g.attributes.position.needsUpdate = true;
  rainSys.g.attributes.aColor.needsUpdate = true;
  rainSys.g.attributes.aSize.needsUpdate = true;
  rainSys.g.attributes.aAlpha.needsUpdate = true;
}

/* ============================================================
   环境生物：萤火虫、飞蛾、树影摇动（远处动物叫声在 startAudio 内）
   ============================================================ */
// 萤火虫：中景缓慢蜿蜒漂浮的黄绿冷光，各自独立明灭（远离火光处更显）
const FIREFLY_N = 42;
const fireflySys = makeParticleSystem(FIREFLY_N, '0.25', THREE.AdditiveBlending);
const fireflies = [];
{
  const rng = mulberry32(91);
  for (let i = 0; i < FIREFLY_N; i++) {
    const a = rng() * Math.PI * 2, r = 3.5 + rng() * 8;
    fireflies.push({
      x: Math.cos(a) * r, y: 0.3 + rng() * 1.6, z: Math.sin(a) * r,
      phase: rng() * 6.28, blink: 0.4 + rng() * 1.0, sp: 0.12 + rng() * 0.2,
      seed: rng() * 100, drift: rng() * 6.28
    });
    fireflySys.col[i*3] = 0.7; fireflySys.col[i*3+1] = 1.0; fireflySys.col[i*3+2] = 0.32;   // 黄绿（恒定）
  }
  fireflySys.g.attributes.aColor.needsUpdate = true;
}
function updateFireflies(dt, t) {
  for (let i = 0; i < FIREFLY_N; i++) {
    const p = fireflies[i];
    p.x += Math.sin(t * 0.4 + p.seed) * p.sp * dt + windVX * 0.12 * dt;       // 蜿蜒漂移 + 随风
    p.z += Math.cos(t * 0.33 + p.seed * 1.3) * p.sp * dt + windVZ * 0.12 * dt;
    p.y += Math.sin(t * 0.6 + p.drift) * 0.12 * dt;
    p.y = Math.max(0.25, Math.min(2.2, p.y));
    let glow = Math.max(0, Math.sin(t * p.blink + p.phase));                  // 明灭脉冲
    glow = glow * glow * glow;                                               // 亮起锐、熄灭缓
    const vis = Math.min(1, Math.max(0, (Math.hypot(p.x, p.z) - 1.6) / 3));  // 近火被压过
    fireflySys.pos[i*3] = p.x; fireflySys.pos[i*3+1] = p.y; fireflySys.pos[i*3+2] = p.z;
    fireflySys.sz[i] = 0.05 + 0.035 * glow;
    fireflySys.al[i] = glow * 0.9 * vis * (1 - 0.6 * rainNow);                // 雨天萤火稀疏
  }
  fireflySys.g.attributes.position.needsUpdate = true;
  fireflySys.g.attributes.aSize.needsUpdate = true;
  fireflySys.g.attributes.aAlpha.needsUpdate = true;
}

// 飞蛾：被提灯/火光吸引，不匀速盘旋扑飞的淡色身影
const moths = [];
const mothFireTarget = new THREE.Vector3(0, 1.0, 0);
{
  const mothTex = radialTexture(32, [

  ]);

    });

}
function updateMoths(dt, t) {
  for (const m of moths) {
    m.ang += (0.8 + 0.6 * Math.sin(t * 1.3 + m.seed)) * dt;                  // 不匀速盘旋
    const r = m.rad * (1 + 0.3 * Math.sin(t * 2.1 + m.ph));
    m.spr.position.set(
      m.target.x + Math.cos(m.ang) * r + Math.sin(t * 5 + m.seed) * 0.04,
      m.target.y + 0.12 * Math.sin(t * 3.3 + m.yph) + 0.05 * Math.sin(t * 7 + m.seed),
      m.target.z + Math.sin(m.ang) * r + Math.cos(t * 4.6 + m.seed) * 0.04
    );
    m.spr.material.opacity = 0.5 + 0.4 * Math.sin(t * 9 + m.seed);           // 翅扑明灭
  }
}

// 树影摇动：松树随瞬时风速轻摆，silhouette 与投影一起晃动
function updateTreeSway(dt, t) {
  for (const tr of trees) {
    const sway = tr.amp * (0.4 + 2.6 * windNow);
    tr.g.rotation.x = Math.sin(t * tr.sp + tr.ph) * sway;
    tr.g.rotation.z = Math.cos(t * tr.sp * 0.8 + tr.ph) * sway * 0.7;
  }
}

/* ============================================================
   火把火焰：小型粒子焰（替代扁平贴图，有体积、跳动、随火把移动和风摆）
   粒子在世界空间从火把头发射 → 浮升 + 向发射柱收束 + 湍流抖动 + 随风倾斜
   ============================================================ */
const TORCH_FLAME_N = 200;
const torchFlameSys = makeParticleSystem(TORCH_FLAME_N, '0.04', THREE.AdditiveBlending);
const torchParts = [];
for (let i = 0; i < TORCH_FLAME_N; i++) {
  // 双层焰体（同篝火的分层思路，缩到火把尺度）：
  // 前 62% 为内焰核心（白黄、小而亮、贴轴心），其余为外焰焰膜（橙红、大而淡、升得高）
  torchParts.push({
    layer: i < TORCH_FLAME_N * 0.62 ? 0 : 1,
    life: 1, maxLife: 1, x: 0, y: -10, z: 0, cx: 0, cz: 0, vx: 0, vy: 0, vz: 0,
    seed: Math.random() * 100
  });
  torchFlameSys.al[i] = 0;
}
torchFlameSys.g.attributes.aAlpha.needsUpdate = true;
// 内焰：白热核心 → 明黄 → 橙；外焰：橙 → 暗红焰尖
const TORCH_RAMP_CORE = [
  [0.00, 1.00, 0.98, 0.82], [0.30, 1.00, 0.86, 0.38], [0.70, 1.00, 0.55, 0.10], [1.00, 0.95, 0.28, 0.03]
];
const TORCH_RAMP_SHELL = [
  [0.00, 1.00, 0.62, 0.16], [0.45, 1.00, 0.36, 0.05], [1.00, 0.42, 0.05, 0.01]
];
const _tc = [0, 0, 0];
// ign=引燃进度(0→1)，(ex,ey,ez)=火把头世界坐标（每帧由 updateTorch 传入）
function updateTorchFlame(dt, t, ign, ex, ey, ez) {
  const spawnable = ign > 0.02;
  for (let i = 0; i < TORCH_FLAME_N; i++) {
    const p = torchParts[i];
    const shell = p.layer === 1;
    p.life += dt;
    if (p.life >= p.maxLife) {
      if (!spawnable) { torchFlameSys.al[i] = 0; continue; }
      const a = Math.random() * Math.PI * 2;
      p.cx = ex; p.cz = ez;                                          // 收束目标 = 火把轴心
      if (Math.random() < (shell ? 0.55 : 0.3)) {
        // 侧壁着火：火舌从缠布上半段的表面升起（整个上半头都在燃烧）
        const r = 0.112 + Math.random() * 0.02;
        p.x = ex + Math.cos(a) * r; p.y = ey - 0.19 + Math.random() * 0.17; p.z = ez + Math.sin(a) * r;
      } else {
        // 顶口火焰：焰根扎进缠布口内
        const r = (shell ? 0.085 : 0.06) * Math.sqrt(Math.random());
        p.x = ex + Math.cos(a) * r; p.y = ey - 0.05 + Math.random() * 0.06; p.z = ez + Math.sin(a) * r;
      }
      p.vx = (Math.random() - 0.5) * (shell ? 0.10 : 0.05);
      p.vy = 0.15 + Math.random() * (shell ? 0.35 : 0.25);
      p.vz = (Math.random() - 0.5) * (shell ? 0.10 : 0.05);
      p.maxLife = shell ? 0.55 + Math.random() * 0.40 : 0.32 + Math.random() * 0.26;
      p.life = 0;
      p.seed = Math.random() * 100;
    }
    const f = p.life / p.maxLife;
    // 热浮升：外焰升得更高；火光闪烁 flick 驱动整体高度不断呼吸
    p.vy += (shell ? 3.4 : 2.8) * (1 - 0.4 * f) * (0.8 + 0.45 * flick) * dt;
    const k = Math.max(0, 1 - 2.0 * dt);                           // 空气阻力
    p.vx *= k; p.vy *= k; p.vz *= k;
    const turb = shell ? 0.9 : 0.45;                               // 湍流：外焰扭摆出焰舌
    p.vx += Math.sin(t * 11 + p.seed * 1.7 + p.y * 14) * turb * dt;
    p.vz += Math.cos(t * 9.3 + p.seed * 2.3 + p.y * 14) * turb * dt;
    // 焰根宽 → 焰尖收束；低于缠布口时不向轴心收束（侧壁火舌贴着布面上舔，
    // 越过口沿后才向焰尖聚拢）
    const conv = (shell ? 2.2 : 4.5) * (0.5 + 1.6 * f)
               * THREE.MathUtils.smoothstep((p.y - ey + 0.04) / 0.1, 0, 1);
    p.vx += (p.cx - p.x) * conv * dt;
    p.vz += (p.cz - p.z) * conv * dt;
    p.vx += windVX * 1.6 * dt; p.vz += windVZ * 1.6 * dt;          // 随风倾斜
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    torchFlameSys.pos[i*3] = p.x; torchFlameSys.pos[i*3+1] = p.y; torchFlameSys.pos[i*3+2] = p.z;
    flameColor(f, shell ? TORCH_RAMP_SHELL : TORCH_RAMP_CORE, _tc);
    torchFlameSys.col[i*3] = _tc[0]; torchFlameSys.col[i*3+1] = _tc[1]; torchFlameSys.col[i*3+2] = _tc[2];
    torchFlameSys.sz[i] = (shell ? 0.135 * (1 - 0.3 * f) + 0.03
                                 : 0.088 * (1 - 0.5 * f) + 0.022) * (0.6 + 0.4 * ign);
    // 透明度压低防止叠加饱和成"实心色块"（卡通感的根源）；外焰远低于内焰。
    // 包络"出生即亮、缓慢燃尽"：焰根不再因渐入而半透明，火苗牢牢扎在缠布口上
    const env = Math.min(1, f * 4.5) * Math.pow(1 - f, 0.85);
    torchFlameSys.al[i] = env * (shell ? 0.16 : 0.5) * ign * (0.75 + 0.35 * flick);
  }
  torchFlameSys.g.attributes.position.needsUpdate = true;
  torchFlameSys.g.attributes.aColor.needsUpdate = true;
  torchFlameSys.g.attributes.aSize.needsUpdate = true;
  torchFlameSys.g.attributes.aAlpha.needsUpdate = true;
}

updateScales();

/* ============================================================
   加柴交互：木柴抛物线飞入（重力 + 翻滚）→ 落点迸火星、冒烟、
   闷响 → 燃料模型：先闷烧冒烟再引燃，~50s 烧尽
   ============================================================ */
const addedLogs = [];
const burstQueue = [];
let fuel = 3;            // 已引燃的燃料（驱动火势）——初始柴堆，会随燃烧消耗
let fuelTarget = 3;      // 现存木柴总量（含闷烧中的新柴）
let fireDrive = 1;       // P.fireScale × 燃料加成，每帧更新
let fireHealth = 1;      // 0（余烬）→ 1（旺火）：由现存燃料决定，需持续添柴维持
let collapseAmt = 0;     // 柴堆坍塌/炭化进度（平滑跟随燃尽程度，驱动树皮变黑与下沉）
let crackleBoostUntil = 0;

function tossLog() {
  // 柴堆上限：先移除最旧的一根已落定的柴
  if (addedLogs.length >= 5) {
    const idx = addedLogs.findIndex(o => o.state === 'rest');
    if (idx >= 0) {
      const old = addedLogs.splice(idx, 1)[0];
      scene.remove(old.mesh);
      if (old.mesh.isMesh) {                   // GLB 木柴共享模板几何与材质，不释放
        old.mesh.geometry.dispose();
        old.mesh.material.dispose();
      }
    }
  }
  // 从镜头一侧抛入，抛物线命中火心附近
  const dl = Math.hypot(camera.position.x, camera.position.z) || 1;
  const sx = (camera.position.x / dl) * 2.6 + (Math.random() - 0.5) * 0.8;
  const sz = (camera.position.z / dl) * 2.6 + (Math.random() - 0.5) * 0.8;
  const sy = 1.05;
  const tx = (Math.random() - 0.5) * 0.4, tz = (Math.random() - 0.5) * 0.4;
  const ty = 0.30 + Math.random() * 0.12;
  const T = 0.6 + Math.random() * 0.15;     // 飞行时间，反解初速度
  let mesh;
  if (tossLogKit) {
    // GLB 木柴：包一层组，使翻滚 / 落地姿态绕木柴中点（模型原点在一端）
    const kit = tossLogKit[(Math.random() * tossLogKit.length) | 0];
    mesh = new THREE.Group();
    const logModel = kit.root.clone(true);
    logModel.position.y = -kit.length / 2;
    logModel.rotation.y = Math.random() * Math.PI * 2;
    mesh.add(logModel);
  } else {
    mesh = new THREE.Mesh(
      makeLogGeometry(0.05, 0.062, 0.68 + Math.random() * 0.16, Math.random() * 100),
      // 新柴：独立新鲜木色，不随炭化变黑；共享树皮凹凸贴图（material.dispose 不会连带释放共享贴图）
      new THREE.MeshStandardMaterial({ color: 0x3a2512, roughness: 0.9, bumpMap: barkMat.bumpMap, bumpScale: 0.012 })
    );
    mesh.castShadow = true;
  }
  mesh.position.set(sx, sy, sz);
  scene.add(mesh);
  addedLogs.push({
    mesh, state: 'fly', restY: ty,
    vel: new THREE.Vector3((tx - sx) / T, (ty - sy) / T + 4.9 * T, (tz - sz) / T),
    spin: new THREE.Vector3((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 9)
  });
}

function updateAddedLogs(dt) {
  for (const l of addedLogs) {
    if (l.state !== 'fly') continue;
    l.vel.y -= 9.8 * dt;                     // 重力
    l.mesh.position.addScaledVector(l.vel, dt);
    l.mesh.rotation.x += l.spin.x * dt;      // 翻滚
    l.mesh.rotation.y += l.spin.y * dt;
    l.mesh.rotation.z += l.spin.z * dt;
    if (l.vel.y < 0 && l.mesh.position.y <= l.restY) landLog(l);
  }
}

function landLog(l) {
  l.state = 'rest';
  l.mesh.position.y = l.restY;
  // 随机一个近水平的安放姿态
  const yaw = Math.random() * Math.PI * 2;
  l.mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(Math.cos(yaw), (Math.random() - 0.5) * 0.5, Math.sin(yaw)).normalize()
  );
  fuelTarget = Math.min(6, fuelTarget + 1.4);          // 新柴补充燃料（上限提高）
  fuel = Math.min(fuelTarget, fuel + 0.6);             // 即时小幅引燃 → 添柴瞬间火势一窜
  // 落点特效：火星迸溅 + 烟尘
  burstQueue.push({ x: l.mesh.position.x, y: l.restY + 0.1, z: l.mesh.position.z, n: 24 });
  for (let k = 0; k < 6; k++) {
    const s = smokes.find(o => !o.alive);
    if (s) {
      spawnSmoke(s);
      s.x = l.mesh.position.x + (Math.random() - 0.5) * 0.2;
      s.z = l.mesh.position.z + (Math.random() - 0.5) * 0.2;
      s.y = l.restY + 0.15;
    }
  }
  if (audio) {
    audio.playThud();                                        // 闷响 + 湿柴嘶声
    crackleBoostUntil = audio.ctx.currentTime + 2.5;         // 爆裂声高发期
  }
}

/* ============================================================
   营火互动：烤棉花糖 / 煮水 / 点燃火把 / 投掷松果
   动作共享火势与天气状态，模型均使用简单几何体，避免额外资源请求
   ============================================================ */
const activityStatus = document.getElementById('activityStatus');
const actionButtons = {
  roast: document.getElementById('roastBtn'),
  kettle: document.getElementById('kettleBtn'),
  torch: document.getElementById('torchBtn'),
  pinecone: document.getElementById('pineconeBtn'),
  chop: document.getElementById('chopBtn'),
  tidy: document.getElementById('tidyBtn')
};
let campTidied = false;
let activityMessageKey = '';
let activityMessageUntil = 0;
let activityUiTimer = 0;

function showActivityMessage(key, seconds = 2.8) {
  activityMessageKey = key;
  activityMessageUntil = performance.now() + seconds * 1000;
}

function cameraSidePosition(radius, height) {
  const p = camera.position.clone().sub(FIRE_POS);
  p.y = 0;
  if (p.lengthSq() < 0.001) p.set(0, 0, 1);
  return p.normalize().multiplyScalar(radius).setY(height);
}

function aimRod(group, rod, tip, from, to) {
  const dir = to.clone().sub(from);
  const len = Math.max(0.001, dir.length());
  group.position.copy(from);
  group.quaternion.setFromUnitVectors(UP_AXIS, dir.multiplyScalar(1 / len));
  rod.position.y = len * 0.5;
  rod.scale.y = len;
  tip.position.y = len;
}

function makeBeamBetween(a, b, radius, material, segments = 8) {
  const dir = b.clone().sub(a);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, dir.length(), segments),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP_AXIS, dir.normalize());
  mesh.castShadow = true;
  return mesh;
}

function disposeObject3D(root) {
  root.traverse(o => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();   // 共享几何（如松果模板）不释放
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) if (!m.userData.shared) m.dispose();         // 共享材质（GLB 模板）不释放
    }
  });
  root.removeFromParent();
}

// 1) 棉花糖：竹签伸向火堆，颜色随受热逐渐焦黄
const skewer = new THREE.Group();
const skewerStick = new THREE.Mesh(
  new THREE.CylinderGeometry(0.014, 0.018, 1, 7),
  new THREE.MeshStandardMaterial({ color: 0x9b7042, roughness: 0.85 })
);
const marshmallowMat = new THREE.MeshStandardMaterial({
  color: 0xfff2d8, roughness: 0.88, emissive: 0x3a1203, emissiveIntensity: 0
});
const marshmallow = new THREE.Group();
// 矮胖桶形：平端 + 圆边 + 中段微鼓（车削轮廓）——真实棉花糖，而非药丸状
// 竹签沿 Y 穿过两端，绕 Y 自转即均匀翻烤
const mProfile = [
  [0.000, -0.105], [0.092, -0.105], [0.114, -0.088], [0.118, -0.058],
  [0.118, -0.030], [0.118,  0.030], [0.118,  0.058], [0.114,  0.088],
  [0.092,  0.105], [0.000,  0.105]
].map(p => new THREE.Vector2(p[0], p[1]));
const marshmallowBody = new THREE.Mesh(new THREE.LatheGeometry(mProfile, 24), marshmallowMat);
marshmallow.add(marshmallowBody);
marshmallow.traverse(o => { if (o.isMesh) o.castShadow = true; });
skewer.add(skewerStick, marshmallow);
skewer.visible = false;
scene.add(skewer);

const marshmallowAction = {
  state: 'idle', time: 0, progress: 0,
  startHand: new THREE.Vector3(), roastHand: new THREE.Vector3(),
  startTip: new THREE.Vector3(), roastTip: new THREE.Vector3()
};

function startRoasting() {
  if (campTidied) return;
  if (marshmallowAction.state !== 'idle') return;
  marshmallowAction.state = 'approach';
  marshmallowAction.time = 0;
  marshmallowAction.progress = 0;
  const view = camera.position.clone().sub(FIRE_POS).setY(0).normalize();
  const side = new THREE.Vector3(-view.z, 0, view.x);
  marshmallowAction.startHand.copy(view).multiplyScalar(2.65).addScaledVector(side, 1.0).setY(1.35);
  marshmallowAction.roastHand.copy(view).multiplyScalar(1.65).addScaledVector(side, 0.82).setY(1.0);
  marshmallowAction.startTip.copy(view).multiplyScalar(1.0).addScaledVector(side, 0.58).setY(0.96);
  marshmallowAction.roastTip.copy(side).multiplyScalar(0.28).addScaledVector(view, 0.08).setY(0.78);
  marshmallowMat.color.set(0xfff2d8);
  marshmallowMat.emissiveIntensity = 0;
  skewer.visible = true;
}

function updateMarshmallow(dt, t) {
  const a = marshmallowAction;
  if (a.state === 'idle') return;
  a.time += dt;
  const hand = new THREE.Vector3();
  const tip = new THREE.Vector3();
  if (a.state === 'approach') {
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.8), 0, 1);
    hand.lerpVectors(a.startHand, a.roastHand, k);
    tip.lerpVectors(a.startTip, a.roastTip, k);
    if (k >= 1) { a.state = 'roast'; a.time = 0; }
  } else if (a.state === 'roast') {
    hand.copy(a.roastHand);
    tip.copy(a.roastTip);
    tip.x += Math.sin(t * 1.8) * 0.08;
    tip.z += Math.cos(t * 1.4) * 0.06;
    // 火弱或下雨时需要更久；旺火下约 7 秒烤好
    const heat = (0.25 + 1.05 * fireHealth) * (1 - 0.35 * rainNow);
    a.progress = Math.min(1, a.progress + dt * heat / 7);
    marshmallowMat.color.copy(new THREE.Color(0xfff2d8)).lerp(new THREE.Color(0xa94d18), a.progress);
    marshmallowMat.emissiveIntensity = 0.16 * a.progress * fireHealth;
    if (a.progress >= 1) {
      a.state = 'return';
      a.time = 0;
      showActivityMessage('roastDone');
    }
  } else {
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.8), 0, 1);
    hand.lerpVectors(a.roastHand, a.startHand, k);
    tip.lerpVectors(a.roastTip, a.startTip, k);
    if (k >= 1) {
      a.state = 'idle';
      skewer.visible = false;
      return;
    }
  }
  aimRod(skewer, skewerStick, marshmallow, hand, tip);
  marshmallow.rotation.y = t * 1.65;
}

// 2) 水壶 + 支架。Stage 4 起为 Blender 资产（tools/blender/build_kettle.py → kettle.glb，两个根节点）：
//    kettle 组是动画目标（原点 = 壶底中心），GLB 模型与蒸汽粒子都挂在它下面；
//    蒸汽发射点取契约锚点 SteamAnchor，壶底落点取支架的 RestAnchor；GLB 不可用时回退下面的程序化模型
const kettle = new THREE.Group();
kettle.name = 'Kettle';
let kettleMat;                                          // 受热自发光材质（逐实例一份）
const steamOrigin = new THREE.Vector3(0.38, 0.31, 0);   // 蒸汽发射点（kettle 局部）
// 程序化回退：移植自 KettleCampfireSculptor 的旧铁壶——车削壶身/壶肩/圈足/领口/壶盖，
// 弧管壶嘴、提梁与炭黑握把、壶底烟熏带；铸铁 PBR 材质（albedo/roughness/normal/AO）
function makeProceduralKettle() {
  const ironTex = loadPbrTextures('iron', 1.35);
  const kettleMat = new THREE.MeshStandardMaterial({
    map: ironTex.map, roughnessMap: ironTex.roughnessMap,
    normalMap: ironTex.normalMap, aoMap: ironTex.aoMap,
    normalScale: new THREE.Vector2(0.2, 0.2), aoMapIntensity: 0.62,
    metalness: 0.72, roughness: 0.72,
    emissive: 0x4a1804, emissiveIntensity: 0
  });
  const S = 0.14;                                       // 原模型 → 营地尺度
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x141008, roughness: 0.95 });
  const sootMat = new THREE.MeshStandardMaterial({
    color: 0x090706, roughness: 0.98, transparent: true, opacity: 0.58, depthWrite: false

function startKettle() {
  if (campTidied) return;
  if (kettleAction.state !== 'idle') return;
  kettleAction.state = 'placing';
  kettleAction.time = 0;
  kettleAction.progress = 0;
  kettleAction.start.copy(cameraSidePosition(2.2, 0.55));
  kettle.position.copy(kettleAction.start);
  kettle.visible = true;
  kettleRig.visible = true;
}

function updateSteam(t, strength) {
  for (let i = 0; i < steamPuffs.length; i++) {
    const puff = steamPuffs[i];
    const phase = (t * (0.34 + i * 0.015) + i / steamPuffs.length) % 1;
    puff.position.set(
      steamOrigin.x + Math.sin(t * 1.5 + i * 2.1) * 0.06 * phase,   // 壶嘴口（SteamAnchor）
      steamOrigin.y + phase * 0.82,
      steamOrigin.z + Math.cos(t * 1.2 + i) * 0.05 * phase
    );
    puff.scale.setScalar(0.55 + phase * 1.8);
    puff.material.opacity = Math.sin(Math.PI * phase) * 0.24 * strength;
  }
}

function updateKettle(dt, t) {
  const a = kettleAction;
  if (a.state === 'idle') return;
  a.time += dt;
  if (a.state === 'placing') {
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.75), 0, 1);
    kettle.position.lerpVectors(a.start, a.rest, k);
    kettle.position.y += Math.sin(Math.PI * k) * 0.28;
    if (k >= 1) { a.state = 'heating'; a.time = 0; }
  } else if (a.state === 'heating') {
    const heat = (0.22 + 1.1 * fireHealth) * (1 - 0.45 * rainNow);
    a.progress = Math.min(1, a.progress + dt * heat / 9);
    kettleMat.emissiveIntensity = a.progress * 0.18 * fireHealth;
    updateSteam(t, THREE.MathUtils.smoothstep(a.progress, 0.42, 1));
    if (a.progress >= 1) {
      a.state = 'ready';
      a.time = 0;
      showActivityMessage('kettleDone', 4);
    }
  } else if (a.state === 'ready') {
    updateSteam(t, 1);
    if (a.time >= 4) { a.state = 'removing'; a.time = 0; }
  } else {
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.8), 0, 1);
    kettle.position.lerpVectors(a.rest, a.start, k);
    kettle.position.y += Math.sin(Math.PI * k) * 0.25;
    updateSteam(t, 1 - k);
    if (k >= 1) {
      a.state = 'idle';
      kettle.visible = false;
      kettleRig.visible = false;
      kettleMat.emissiveIntensity = 0;
    }
  }
}

// 3) 火把：伸入火焰引燃后回到石圈旁，可再次点击熄灭
function makeTorchWoodMaps() {
  const size = 64;
  const canvases = Array.from({ length: 4 }, () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    return canvas;
  });
  const [albedo, roughness, bump, ao] = canvases.map(canvas => canvas.getContext('2d'));
  albedo.fillStyle = '#68411f'; albedo.fillRect(0, 0, size, size);
  roughness.fillStyle = '#e7e7e7'; roughness.fillRect(0, 0, size, size);
  bump.fillStyle = '#808080'; bump.fillRect(0, 0, size, size);
  ao.fillStyle = '#f2f2f2'; ao.fillRect(0, 0, size, size);
  let seed = 73;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  for (let i = 0; i < 22; i++) {
    const x = random() * size;
    const sway = (random() - 0.5) * 7;
    const width = 0.35 + random() * 1.1;
    for (const [ctx, color, scale] of [
      [albedo, `rgba(32,17,7,${0.16 + random() * 0.18})`, 1],
      [roughness, 'rgba(180,180,180,0.34)', 0.9],
      [bump, i % 2 ? 'rgba(160,160,160,0.7)' : 'rgba(104,104,104,0.65)', 0.8],
      [ao, 'rgba(205,205,205,0.24)', 1.1]
    ]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width * scale;
      ctx.beginPath();
      ctx.moveTo(x, -4);
      ctx.bezierCurveTo(x + sway, size * 0.3, x - sway, size * 0.72, x + sway * 0.35, size + 4);
      ctx.stroke();
    }
  }
  for (let i = 0; i < 5; i++) {
    const x = random() * size;
    const y = random() * size;
    albedo.strokeStyle = 'rgba(35,18,8,0.32)';
    albedo.lineWidth = 1;
    albedo.beginPath();
    albedo.ellipse(x, y, 2.5 + random() * 2.5, 5 + random() * 4, 0, 0, Math.PI * 2);
    albedo.stroke();
  }
  const textures = canvases.map(canvas => {
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2, 5);
    texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return texture;
  });
  textures[0].colorSpace = THREE.SRGBColorSpace;
  return { albedo: textures[0], roughness: textures[1], bump: textures[2], ao: textures[3] };
}

function makeTorchRibbonGeometry({ radius, y0, y1, turns, phase, width, segments = 52, wobble = 0.0025 }) {
  const positions = [], normals = [], uvs = [], indices = [];
  const dTheta = turns * Math.PI * 2;
  const dY = y1 - y0;
  const tangentCirc = radius * dTheta;
  const invLength = 1 / Math.max(0.0001, Math.hypot(tangentCirc, dY));
  const thetaOffset = (-dY * invLength * width * 0.5) / radius;
  const yOffset = tangentCirc * invLength * width * 0.5;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const theta = phase + dTheta * t + Math.sin(t * Math.PI * 4 + phase) * 0.018;
    const localRadius = radius + Math.sin(t * Math.PI * 6 + phase) * wobble;
    const centerY = THREE.MathUtils.lerp(y0, y1, t);
    for (const side of [-1, 1]) {
      const edgeTheta = theta + thetaOffset * side;
      const x = Math.cos(edgeTheta) * localRadius;
      const z = Math.sin(edgeTheta) * localRadius;
      positions.push(x, centerY + yOffset * side, z);
      normals.push(Math.cos(edgeTheta), 0.08, Math.sin(edgeTheta));
      uvs.push(t, side < 0 ? 0 : 1);
    }
  }
  for (let i = 0; i < segments; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, c, b, b, c, d);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

// 火把头的辉光与点光（程序化与 GLB 火把共用）。

// 这里只保留柔和辉光与点光——此前的手绘火苗 Sprite 是卡通感的来源，已移除
function makeTorchFlameRig(head) {
  const torchFlame = new THREE.Group();
  torchFlame.name = 'torchFlameRig';
  torchFlame.position.copy(head);
  const torchGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTexture(64, [
      [0, 'rgba(255,220,120,0.45)'], [0.46, 'rgba(255,105,25,0.16)'], [1, 'rgba(255,60,0,0)']
    ]),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.58
  }));
  torchGlow.position.y = 0.23;
  torchGlow.scale.set(0.48, 0.64, 1);
  torchGlow.renderOrder = 4;
  torchGlow.material.opacity = 0;              // 未点燃时全透明（不再切换 visible）
  torchFlame.add(torchGlow);
  // 点光不挂在火把下：挂到场景根部常驻可见（强度 0 即无光）。
  // 光源显隐会改变灯数 → three.js 全场景着色器重编译，这正是"点燃时卡一下"的原因
  const torchLight = new THREE.PointLight(0xff7928, 0, 6, 2);
  return { torchFlame, torchGlow, torchLight };
}

// 火焰粒子与点光的发射点取契约锚点 FlameAnchor，缠布余烬材质 TorchEmber 由引燃进度驱动
async function makeTorchAsset() {
  const m = await createTorchInstance(assets);
  const torch = new THREE.Group();
  torch.name = 'torchRoot';
  torch.add(m.root);
  torch.updateMatrixWorld(true);
  const head = new THREE.Vector3().setFromMatrixPosition(m.anchors.flame.matrixWorld);
  const rig = makeTorchFlameRig(head);
  torch.add(rig.torchFlame);
  return { torch, ...rig, torchWrapMat: m.materials.ember, head };
}
let torchKit;
try {
  torchKit = await makeTorchAsset();
} catch (e) {
  console.warn('[assets] torch.glb unavailable, falling back to the procedural torch:', e.message || e);
  torchKit = makeTorchModel();
}
const { torch, torchFlame, torchGlow, torchLight, torchWrapMat } = torchKit;
const TORCH_HEAD = torchKit.head;          // 火把头（torch 局部）：火焰粒子发射点
scene.add(torch, torchLight);
const _torchHead = new THREE.Vector3();   // 火把头世界坐标（粒子发射点）
const torchAction = {
  state: 'unlit', time: 0, ign: 0,
  stand: new THREE.Vector3(1.58, 0.02, -0.82),
  // 引燃位：基座抬到火焰高度、靠火堆近侧边缘，配合倾角让燃烧端从近侧探入火焰核心
  ignite: new THREE.Vector3(0.96, 0.36, -0.22),
  tilt: 1.16
};
torch.position.copy(torchAction.stand);

function toggleTorch() {
  if (campTidied) return;
  const a = torchAction;
  if (a.state === 'lit') {
    a.state = 'unlit';
    a.ign = 0;                       // 粒子焰停止补充并燃尽；辉光/点光由 ign 门控自动熄灭
    torchLight.intensity = 0;
    showActivityMessage('torchOff');
    return;
  }
  if (a.state !== 'unlit') return;
  if (fireHealth < 0.12) {
    showActivityMessage('needFire');
    return;
  }
  a.state = 'lighting';
  a.time = 0;
}

function updateTorch(dt, t) {
  const a = torchAction;
  if (a.state === 'lighting') {
    a.time += dt;
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 1.1), 0, 1);
    torch.position.lerpVectors(a.stand, a.ignite, k);
    torch.rotation.z = a.tilt * k;
    a.ign = 0;
    // 燃烧端探入火焰后期开始引燃：火焰在火把仍探在火中时就微微燃起
    if (k >= 1) {
      a.state = 'returning';
      a.time = 0;
    }
  } else if (a.state === 'returning') {
    a.time += dt;
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.9), 0, 1);
    torch.position.lerpVectors(a.ignite, a.stand, k);
    torch.rotation.z = a.tilt * (1 - k);
    a.ign = k;                                  // 引燃进度：火焰随抽离火堆而逐渐燃旺
    if (k >= 1) {
      a.state = 'lit';
      a.ign = 1;
      showActivityMessage('torchLit');
    }
  }
  // Flame emission is rooted at the charred top rim of the wrapped head.
  torch.updateMatrixWorld(true);
  _torchHead.copy(TORCH_HEAD).applyMatrix4(torch.matrixWorld);
  updateTorchFlame(dt, t, a.ign, _torchHead.x, _torchHead.y, _torchHead.z);

  // 辉光与点光随引燃进度 ign 门控、随火光闪烁呼吸（火焰本体是粒子，见 updateTorchFlame）
  const ign = a.ign;
  torchGlow.position.y = 0.23;
  const gs = 0.44 * (0.48 + 0.52 * ign) * (0.9 + 0.2 * flick);
  torchGlow.scale.set(gs, gs * 1.38, 1);
  torchGlow.material.opacity = (0.34 + 0.09 * Math.sin(t * 12)) * ign;
  torchLight.position.set(_torchHead.x, _torchHead.y + 0.18, _torchHead.z);   // 跟随火把头
  torchLight.intensity = 5.5 * (0.72 + 0.2 * Math.sin(t * 14) + 0.3 * flick) * ign;
  torchWrapMat.emissiveIntensity = (0.55 + 0.5 * flick) * ign;   // 缠布上半段的余烬随火光明灭
}

// 4) 松果：从镜头侧抛入，落入火堆后短暂燃烧并补充少量燃料
// 几何模板：斐波那契螺旋鳞片（黄金角排列，一次构建全部松果共享；
// 材质各自独立，便于逐个燃烧变色）
const pineconeGeo = (() => {
  const parts = [];
  const core = new THREE.SphereGeometry(0.08, 10, 8);
  core.scale(0.78, 1.5, 0.78);
  parts.push(core);
  const GA = Math.PI * (3 - Math.sqrt(5));          // 黄金角 ≈ 137.5°
  const N = 46;
  const pos = new THREE.Vector3(), scl = new THREE.Vector3(0.62, 0.3, 1.05);
  const q = new THREE.Quaternion(), e = new THREE.Euler(), m = new THREE.Matrix4();
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);                          // 底 0 → 顶 1
    const a = i * GA;
    const prof = Math.sin(Math.PI * (0.12 + 0.8 * t));   // 中腹鼓、两端收
    const r = 0.042 + 0.07 * prof;
    const petal = new THREE.SphereGeometry(0.05, 6, 4);  // 压扁拉长成鳞片
    pos.set(Math.cos(a) * r, -0.115 + 0.24 * t, Math.sin(a) * r);
    e.set(0.5, Math.PI / 2 - a, 0, 'YXZ');               // 长轴对准径向、再向下外翻
    q.setFromEuler(e);
    m.compose(pos, q, scl);
    petal.applyMatrix4(m);
    parts.push(petal);
  }
  const g = mergeGeometries(parts);
  for (const p of parts) p.dispose();
  g.userData.shared = true;   // 所有松果共用，回收单个松果时不释放
  return g;
})();
const pinecones = [];
// Stage 5：松果改用 Blender 资产（pinecone.glb，原点 = 几何中心）。模板实例化一次，
// 每次投掷同步克隆节点（共享几何）并克隆一份材质，逐个燃烧变色
let pineconeKit = null;
try {
  pineconeKit = await createPineconeInstance(assets);
  pineconeKit.root.traverse(o => { if (o.geometry) o.geometry.userData.shared = true; });
} catch (e) {
  console.warn('[assets] pinecone.glb unavailable, falling back to the procedural pinecone:', e.message || e);
}
function throwPinecone() {
  if (campTidied) return;
  let group, mat;
  if (pineconeKit) {
    group = pineconeKit.root.clone(true);
    mat = pineconeKit.materials.body.clone();
    group.traverse(o => { if (o.isMesh) o.material = mat; });
  } else {
    group = new THREE.Group();
    mat = new THREE.MeshStandardMaterial({
      color: 0x3f2512, roughness: 0.95, emissive: 0xff4a0a, emissiveIntensity: 0
    });
    const core = new THREE.Mesh(pineconeGeo, mat);
    core.castShadow = true;
    group.add(core);
  }
  const start = cameraSidePosition(2.5, 1.15);
  const target = new THREE.Vector3((Math.random() - 0.5) * 0.35, 0.2, (Math.random() - 0.5) * 0.35);
  const T = 0.58 + Math.random() * 0.14;
  group.position.copy(start);
  scene.add(group);
  pinecones.push({
    group, mat, state: 'fly', age: 0,
    vel: new THREE.Vector3(
      (target.x - start.x) / T,
      (target.y - start.y) / T + 4.9 * T,
      (target.z - start.z) / T
    ),
    spin: new THREE.Vector3(6 + Math.random() * 6, 4 + Math.random() * 5, 5 + Math.random() * 7)
  });
  while (pinecones.length > 9) disposeObject3D(pinecones.shift().group);
  showActivityMessage('pineconeThrown', 1.6);
}

function updatePinecones(dt) {
  for (let i = pinecones.length - 1; i >= 0; i--) {
    const p = pinecones[i];
    p.age += dt;
    if (p.state === 'fly') {
      p.vel.y -= 9.8 * dt;
      p.group.position.addScaledVector(p.vel, dt);
      p.group.rotation.x += p.spin.x * dt;
      p.group.rotation.y += p.spin.y * dt;
      p.group.rotation.z += p.spin.z * dt;
      if (p.vel.y < 0 && p.group.position.y <= 0.19) {
        p.state = 'burn';
        p.age = 0;
        p.group.position.y = 0.19;
        p.mat.emissiveIntensity = 1.1;
        burstQueue.push({ x: p.group.position.x, y: 0.3, z: p.group.position.z, n: 15 });
        fuelTarget = Math.min(6, fuelTarget + 0.22);
        fuel = Math.min(fuelTarget, fuel + 0.08);
        for (let k = 0; k < 2; k++) {
          const s = smokes.find(o => !o.alive);
          if (s) {
            spawnSmoke(s);
            s.x = p.group.position.x;
            s.y = 0.28;
            s.z = p.group.position.z;
          }
        }
        if (audio) audio.playThud();
      }
    } else {
      p.mat.color.lerp(new THREE.Color(0x100804), Math.min(1, dt * 0.8));
      p.mat.emissiveIntensity = Math.max(0, (1 - p.age / 7) * (0.55 + flick));
      p.group.scale.setScalar(Math.max(0.25, 1 - p.age / 9));
      if (p.age >= 7.5) {
        disposeObject3D(p.group);
        pinecones.splice(i, 1);
      }
    }
  }
}

// 5) 劈柴：树桩上立一段原木，斧头抡起劈下——木柴裂成两半带着木屑弹开
//    斧头复用劈柴桩道具里插着的那把（chopRig.userData.axe），位姿在三个关键帧间插值
const chopAction = { state: 'idle', time: 0 };
const CHOP_POSE = {
  idle:   { p: [0.045, 0.36, -0.03], r: [0.12, 0.4, -0.42] },   // 刃口没入桩顶（道具原位）
  raised: { p: [0.02, 0.85, -0.30],  r: [-1.6, 0.1, 0] },       // 向后抡起过肩
  impact: { p: [0.0, 0.70, -0.02],   r: [1.3, 0, 0] }           // 劈中原木顶部
};
// GLB 劈柴桩：静置位姿取契约 AxeSocket（斧刃约 2 cm 吃进桩顶、偏离中心，不与待劈原木重叠），
// 桩顶高度取 TopAnchor；抡起 / 劈中两帧随桩顶高度整体平移
const STUMP_TOP = chopRig?.userData.top ?? 0.342;
if (chopRig?.userData.axeRest) CHOP_POSE.idle = chopRig.userData.axeRest;
for (const k of ['raised', 'impact']) CHOP_POSE[k].p[1] += STUMP_TOP - 0.342;
const chopBarkMat = new THREE.MeshStandardMaterial({ color: 0x4d331a, roughness: 0.95 });
const chopCutMat = new THREE.MeshStandardMaterial({ color: 0xc8a468, roughness: 0.9 });
// 待劈原木：立在桩顶（局部 y 0.342 起，高 0.30）
const chopLog = new THREE.Group();
let chopHalfTemplate = null;   // GLB 半瓣模板：劈开时同步克隆（几何 / 材质共享，回收时不释放）
try {
  // Stage 5b：待劈原木与半瓣也来自 chopping.glb（沿用 v1 程序模型的原点 / 轴向约定）
  const [lg, hf] = await Promise.all([createChopLogInstance(assets), createChopHalfInstance(assets)]);
  chopLog.add(lg.root);
  chopHalfTemplate = hf.root;
  chopHalfTemplate.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.userData.shared = true;
    o.material.userData.shared = true;
  });
} catch (e) {
  console.warn('[assets] chop log / half unavailable, falling back to procedural pieces:', e.message || e);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.058, 0.30, 12), chopBarkMat);
  body.position.y = 0.15;
  body.castShadow = true;
  const cap = new THREE.Mesh(new THREE.CircleGeometry(0.052, 12), chopCutMat);
  cap.rotation.x = -Math.PI / 2;
  cap.position.y = 0.302;
  chopLog.add(body, cap);
}
chopLog.visible = false;
// 共享几何（标记 shared，回收碎块时不释放）：半瓣柴 = 半圆柱壳 + 浅色劈面
const chopHalfGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.30, 10, 1, false, 0, Math.PI);
const chopFaceGeo = new THREE.PlaneGeometry(0.11, 0.30);
const chopChipGeo = new THREE.BoxGeometry(0.028, 0.014, 0.02);
for (const g of [chopHalfGeo, chopFaceGeo, chopChipGeo]) g.userData.shared = true;
const chopDebris = [];

function makeChopHalf() {
  if (chopHalfTemplate) return chopHalfTemplate.clone(true);
  const g = new THREE.Group();
  const shell = new THREE.Mesh(chopHalfGeo, chopBarkMat);
  shell.castShadow = true;
  const face = new THREE.Mesh(chopFaceGeo, chopCutMat);
  face.material = chopCutMat;
  face.position.z = 0.001;
  face.rotation.y = Math.PI;          // 平面朝向壳体开口一侧
  g.add(shell, face);
  return g;
}

function startChopping() {
  if (campTidied || !chopRig || chopAction.state !== 'idle') return;
  chopAction.state = 'place';
  chopAction.time = 0;
  if (!chopLog.parent) chopRig.add(chopLog);
  chopLog.visible = true;
  chopLog.position.set(0, 0.52, 0);   // 从桩顶上方落下
}

function chopLerpPose(A, B, k) {
  const axe = chopRig.userData.axe;
  axe.position.set(
    A.p[0] + (B.p[0] - A.p[0]) * k,
    A.p[1] + (B.p[1] - A.p[1]) * k,
    A.p[2] + (B.p[2] - A.p[2]) * k
  );
  axe.rotation.set(
    A.r[0] + (B.r[0] - A.r[0]) * k,
    A.r[1] + (B.r[1] - A.r[1]) * k,
    A.r[2] + (B.r[2] - A.r[2]) * k
  );
}

function chopSplit() {
  chopLog.visible = false;
  // 两瓣半柴向两侧翻飞
  for (const s of [-1, 1]) {
    const half = makeChopHalf();
    half.position.set(s * 0.05, 0.5, 0);
    half.rotation.y = s > 0 ? Math.PI / 2 : -Math.PI / 2;   // 劈面相对而开
    chopRig.add(half);
    chopDebris.push({
      mesh: half, kind: 'half', state: 'fly', age: 0, restY: 0.058,
      vel: new THREE.Vector3(s * (0.55 + Math.random() * 0.35), 1.1 + Math.random() * 0.5, (Math.random() - 0.5) * 0.5),
      spinZ: s * (5 + Math.random() * 4), spinY: (Math.random() - 0.5) * 3
    });
  }
  // 木屑
  for (let i = 0; i < 5; i++) {
    const chip = new THREE.Mesh(chopChipGeo, chopCutMat);
    chip.position.set(0, 0.55, 0);
    chopRig.add(chip);
    chopDebris.push({
      mesh: chip, kind: 'chip', state: 'fly', age: 0, restY: 0.012,
      vel: new THREE.Vector3((Math.random() - 0.5) * 1.8, 1.2 + Math.random() * 0.9, (Math.random() - 0.5) * 1.8),
      spinZ: (Math.random() - 0.5) * 16, spinY: (Math.random() - 0.5) * 10
    });
  }
  if (audio) audio.playChop();
  showActivityMessage('chopDone', 2.2);
}

function updateChop(dt, t) {
  // 碎块物理：重力 + 落地反弹一次后静置；木屑短命；半柴上限 8 块
  for (let i = chopDebris.length - 1; i >= 0; i--) {
    const d = chopDebris[i];
    d.age += dt;
    if (d.state === 'fly') {
      d.vel.y -= 9.8 * dt;
      d.mesh.position.addScaledVector(d.vel, dt);
      d.mesh.rotation.z += d.spinZ * dt;
      d.mesh.rotation.y += d.spinY * dt;
      if (d.vel.y < 0 && d.mesh.position.y <= d.restY) {
        if (d.kind === 'half' && Math.abs(d.vel.y) > 1.2) {
          d.vel.y *= -0.32; d.vel.x *= 0.6; d.vel.z *= 0.6; d.spinZ *= 0.5;   // 弹一下
          d.mesh.position.y = d.restY;
        } else {
          d.state = 'rest';
          d.mesh.position.y = d.restY;
          if (d.kind === 'half') d.mesh.rotation.z = (d.mesh.rotation.z > 0 ? 1 : -1) * Math.PI / 2;  // 躺平
        }
      }
    }
    if (d.kind === 'chip' && d.age > 1.6) {
      d.mesh.removeFromParent();
      chopDebris.splice(i, 1);
    }
  }
  const resting = chopDebris.filter(d => d.kind === 'half' && d.state === 'rest');
  while (resting.length > 8) {
    const old = resting.shift();
    disposeObject3D(old.mesh);
    chopDebris.splice(chopDebris.indexOf(old), 1);
  }

  const a = chopAction;
  if (a.state === 'idle' || !chopRig) return;
  a.time += dt;
  if (a.state === 'place') {                                   // 原木落上桩顶
    const k = Math.min(1, a.time / 0.25);
    chopLog.position.y = STUMP_TOP + (1 - k) * 0.18;
    if (k >= 1) { a.state = 'raise'; a.time = 0; }
  } else if (a.state === 'raise') {                            // 抡斧过肩
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.5), 0, 1);
    chopLerpPose(CHOP_POSE.idle, CHOP_POSE.raised, k);
    if (k >= 1) { a.state = 'swing'; a.time = 0; }
  } else if (a.state === 'swing') {                            // 加速劈下
    const k = Math.min(1, a.time / 0.13);
    chopLerpPose(CHOP_POSE.raised, CHOP_POSE.impact, k * k);
    if (k >= 1) { chopSplit(); a.state = 'hold'; a.time = 0; }
  } else if (a.state === 'hold') {                             // 斧头顿在桩上
    if (a.time >= 0.18) { a.state = 'return'; a.time = 0; }
  } else {                                                     // 收斧回原位
    const k = THREE.MathUtils.smoothstep(Math.min(1, a.time / 0.55), 0, 1);
    chopLerpPose(CHOP_POSE.impact, CHOP_POSE.idle, k);
    if (k >= 1) a.state = 'idle';
  }
}

function refreshActionButtons() {
  const roastActive = marshmallowAction.state !== 'idle';
  const kettleActive = kettleAction.state !== 'idle';
  const torchBusy = torchAction.state === 'lighting' || torchAction.state === 'returning';
  actionButtons.roast.disabled = campTidied || roastActive;
  actionButtons.kettle.disabled = campTidied || kettleActive;
  actionButtons.torch.disabled = campTidied || torchBusy;
  actionButtons.pinecone.disabled = campTidied;
  actionButtons.chop.disabled = campTidied || chopAction.state !== 'idle';
  actionButtons.tidy.disabled = false;
  actionButtons.roast.classList.toggle('active', roastActive);
  actionButtons.kettle.classList.toggle('active', kettleActive);
  actionButtons.torch.classList.toggle('active', torchAction.state === 'lit' || torchBusy);
  actionButtons.chop.classList.toggle('active', chopAction.state !== 'idle');
  actionButtons.tidy.classList.toggle('active', campTidied);
  actionButtons.roast.textContent = roastActive
    ? tr('roastProgress')(Math.round(marshmallowAction.progress * 100)) : tr('roast');
  actionButtons.kettle.textContent = kettleActive
    ? tr('kettleProgress')(Math.round(kettleAction.progress * 100)) : tr('kettle');
  actionButtons.torch.textContent = torchAction.state === 'lit' ? tr('extinguishTorch') : tr('lightTorch');
  actionButtons.pinecone.textContent = tr('throwPinecone');
  actionButtons.chop.textContent = tr('chop');
  actionButtons.tidy.textContent = tr(campTidied ? 'placeItems' : 'tidyItems');
}

function tidyCampItems() {
  if (campTidied) {
    placeCampItems();
    return;
  }
  campTidied = true;

  for (const prop of campProps) prop.visible = false;
  campLight.intensity = 0;
  if (tentGlow) tentGlow.intensity = 0;
  if (lanternGlowMat) lanternGlowMat.emissiveIntensity = 0;

  marshmallowAction.state = 'idle';
  marshmallowAction.time = 0;
  skewer.visible = false;

  kettleAction.state = 'idle';
  kettleAction.time = 0;
  kettle.visible = false;
  kettleRig.visible = false;
  kettleMat.emissiveIntensity = 0;
  for (const puff of steamPuffs) puff.material.opacity = 0;

  torchAction.state = 'unlit';
  torchAction.time = 0;
  torchAction.ign = 0;
  torch.position.copy(torchAction.stand);
  torch.rotation.set(0, 0, 0);
  torch.visible = false;
  torchLight.intensity = 0;

  while (pinecones.length) disposeObject3D(pinecones.pop().group);

  chopAction.state = 'idle';
  chopAction.time = 0;
  chopLog.visible = false;
  if (chopRig) chopLerpPose(CHOP_POSE.idle, CHOP_POSE.idle, 1);   // 斧头归位插回桩顶
  while (chopDebris.length) {
    const d = chopDebris.pop();
    if (d.kind === 'chip') d.mesh.removeFromParent();
    else disposeObject3D(d.mesh);
  }

  for (const moth of moths) moth.target = mothFireTarget;

  showActivityMessage('campTidied', 3.5);
  refreshActionButtons();
}

function placeCampItems() {
  if (!campTidied) return;
  campTidied = false;

  for (const prop of campProps) prop.visible = true;
  if (tentGlow) tentGlow.intensity = 0.9;
  if (lanternGlowMat) lanternGlowMat.emissiveIntensity = 2.4;
  torch.visible = true;
  torch.position.copy(torchAction.stand);
  torch.rotation.set(0, 0, 0);
  for (let i = 0; i < moths.length; i++) {
    moths[i].target = i < 3 ? campLight.position : mothFireTarget;
  }

  showActivityMessage('campPlaced', 3.5);
  refreshActionButtons();
}

function updateActivityUi(dt) {
  activityUiTimer += dt;
  if (activityUiTimer < 0.1) return;
  activityUiTimer = 0;
  refreshActionButtons();
  const active = [];
  if (marshmallowAction.state === 'roast') {
    active.push(tr('roastStatus')(Math.round(marshmallowAction.progress * 100)));
  }
  if (kettleAction.state === 'heating') {
    active.push(tr('kettleStatus')(Math.round(kettleAction.progress * 100)));
  }
  if (torchAction.state === 'lighting' || torchAction.state === 'returning') {
    active.push(tr('torchLighting'));
  }
  if (chopAction.state !== 'idle') {
    active.push(tr('chopping'));
  }
  if (active.length) {
    activityStatus.textContent = active.join(' · ');
  } else if (activityMessageKey && performance.now() < activityMessageUntil) {
    activityStatus.textContent = tr(activityMessageKey);
  } else {
    activityStatus.textContent = '';
  }
}

function updateCampActivities(dt, t) {
  updateMarshmallow(dt, t);
  updateKettle(dt, t);
  updateTorch(dt, t);
  updatePinecones(dt);
  updateChop(dt, t);
  updateActivityUi(dt);
}

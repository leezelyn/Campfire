function updateLake(t) {
  const dim = 1 - 0.6 * cloudNow;                       // 云遮月 → 倒影碎光同步变暗
  for (const g of lakeGlints) {
    const s = Math.max(0, Math.sin(t * g.sp + g.ph));
    g.mesh.material.opacity = g.baseOp * s * s * dim;
    g.mesh.position.x = g.x0 + Math.sin(t * 0.3 + g.ph) * 0.5;
    g.mesh.position.z = g.z0 + Math.cos(t * 0.22 + g.ph * 1.7) * 0.6;
  }
}

/* ============================================================
   针叶树（收集引用，随风摇动 → 树影摆动）
   旧版是 5 个加噪声的圆锥叠成"圣诞树剪贴画"：层与层之间看不到树干、
   轮廓对称、颜色近乎纯黑（线性反照率 ~1%），在夜色里只剩一块黑色纸板。
   新版按真实针叶树结构建模：
   · 树干：锥形、贯穿整个树冠、带板根外张与轻微弯曲，贴实拍树皮贴图；
           下部残留枯枝桩（松树自然整枝的特征）
   · 云杉 spruce：11~14 层轮生枝，每层由 6~9 个带尖梢的枝簇组成、外缘下垂、
           长短不齐（缺枝），自下而上收窄成塔形
   · 松 pine：高干，上部由枝条托起的若干针叶团簇组成不规则树冠
   · 针叶顶点色：靠干处暗、枝梢亮、上层略亮 → 即使只有微弱天光也能看出体积
   每棵树 = Group(Tree_*) ⊃ Trunk + Foliage 两个网格，Blender 中可逐棵选取编辑
   ============================================================ */
const trees = [];          // { g, ph, sp, amp, species, s }
const barkTex = (() => {
  const loader = new THREE.TextureLoader();
  const mk = (file, srgb) => {
    const t = loader.load(`assets/textures/bark/${file}.png`);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  return { map: mk('albedo', true), bumpMap: mk('bump'), roughnessMap: mk('roughness') };
})();
const trunkMat = new THREE.MeshStandardMaterial({
  name: 'ConiferBark', map: barkTex.map, bumpMap: barkTex.bumpMap, bumpScale: 0.04,
  roughnessMap: barkTex.roughnessMap, roughness: 1, color: 0xcfc4b8
});
const needleMat = new THREE.MeshStandardMaterial({
  name: 'ConiferNeedles', vertexColors: true, roughness: 0.9, side: THREE.DoubleSide
});
const bushMat = new THREE.MeshStandardMaterial({
  name: 'Undergrowth', color: new THREE.Color().setRGB(0.026, 0.042, 0.025), roughness: 0.95
});

// 树种参数（尺寸单位：米，对应 scale = 1；实际树高 = H × s）
const TREE_SPECIES = {
  spruce: {
    H: 7.0, crownBase: 0.1, rMax: 0.23, tiers: [11, 14], lobes: [6, 9], droop: 1.0,
    inner: [0.009, 0.019, 0.013], tip: [0.034, 0.062, 0.036]
  },
  pine: {
    H: 8.0, crownBase: 0.48, branches: [10, 13],
    inner: [0.012, 0.021, 0.012], tip: [0.052, 0.074, 0.034]
  }
};

// CylinderGeometry 的 UV 接缝处顶点成对重复：computeVertexNormals 只统计各自一侧的面，
// 接缝会出现一条明暗线。这里把每行首尾两个重复顶点的法线取平均
function weldSeamNormals(geo, radial, rows) {
  const n = geo.attributes.normal;
  for (let y = 0; y <= rows; y++) {
    const a = y * (radial + 1), b = a + radial;
    const x = n.getX(a) + n.getX(b), yy = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const l = Math.hypot(x, yy, z) || 1;
    n.setXYZ(a, x / l, yy / l, z / l);
    n.setXYZ(b, x / l, yy / l, z / l);
  }
}

// 两点之间的锥形圆柱（枝条 / 枯枝桩），保留 UV 以共用树皮材质
function makeLimbGeometry(a, b, r0, r1, radial = 5) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r1, r0, len, radial, 1, true);
  g.translate(0, len / 2, 0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP_AXIS, dir.normalize()));
  g.translate(a.x, a.y, a.z);
  return g;
}

// 一层针叶：极坐标网格（K 圈 × A 段，首尾共享顶点无接缝）。
// 外轮廓由 nb 个带尖梢的枝簇构成（每簇长度随机 → 缺枝、参差），外缘下垂，中心贴树干。
// o: { cx, cy, cz, R, dh, droop, nb, phase, lobeAmp, dome, bright, sp, rng, A, K }
function addNeedleTier(buf, o) {
  const A = o.A, K = o.K;
  const base = buf.pos.length / 3;
  const lobeK = [];
  for (let i = 0; i < o.nb; i++) lobeK.push(0.72 + o.rng() * 0.38);
  const collar = Math.min(0.06 * o.R + 0.03, 0.2);
  for (let k = 0; k <= K; k++) {
    const u = k / K;
    for (let a = 0; a < A; a++) {
      const th = a / A * Math.PI * 2 + o.phase;
      const lc = (a / A) * o.nb;
      const li = Math.floor(lc) % o.nb, fr = lc - Math.floor(lc);
      const shape = 1 - Math.pow(Math.abs(2 * fr - 1), 0.8);     // 枝梢尖、枝间 V 形缺口
      const rr = o.R * lobeK[li] * (1 - o.lobeAmp + o.lobeAmp * shape);
      const r = collar + (rr - collar) * u;
      const y = o.cy + o.dh * (0.45 - 0.45 * u) + o.dome * o.dh * (1 - u * u)
              - o.droop * u * u * (0.55 + 0.45 * shape)
              + 0.12 * o.dh * u * triNoise(Math.cos(th) * 2.3, o.cy, Math.sin(th) * 2.3, o.seed);
      buf.pos.push(o.cx + Math.cos(th) * r, y, o.cz + Math.sin(th) * r);
      const w = Math.pow(u, 1.3) * (0.55 + 0.45 * shape);
      for (let c = 0; c < 3; c++) buf.col.push((o.sp.inner[c] + (o.sp.tip[c] - o.sp.inner[c]) * w) * o.bright);
    }
  }
  for (let k = 0; k < K; k++) {
    for (let a = 0; a < A; a++) {
      const i0 = base + k * A + a, i1 = base + k * A + (a + 1) % A;
      const i2 = base + (k + 1) * A + a, i3 = base + (k + 1) * A + (a + 1) % A;
      buf.idx.push(i0, i1, i2, i1, i3, i2);              // 法线朝上（DoubleSide 背面自动翻转）
    }
  }
}

// 松针团簇：变形二十面体（上半球略扁、底部收平、表面尖刺状起伏），
// 顶部与外凸处亮、底部暗——从下仰视也有体积，不会露出扁平"伞面"
function addNeedleClump(buf, o) {
  let g = new THREE.IcosahedronGeometry(1, o.detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position, base = buf.pos.length / 3;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const d = 1 + 0.22 * triNoise(x * 3.1, y * 3.1, z * 3.1, o.seed) + 0.18 * triNoise(x * 8.3, y * 8.3, z * 8.3, o.seed + 3);
    const sy = y > 0 ? o.squash : 0.42;
    buf.pos.push(o.cx + x * d * o.R, o.cy + y * sy * d * o.R, o.cz + z * d * o.R);
    const w = Math.min(1, Math.max(0, 0.45 * (0.5 + 0.5 * y) + 1.1 * (d - 0.95)));
    for (let c = 0; c < 3; c++) buf.col.push((o.sp.inner[c] + (o.sp.tip[c] - o.sp.inner[c]) * w) * o.bright);
  }
  const idx = g.index.array;
  for (let i = 0; i < idx.length; i++) buf.idx.push(base + idx[i]);
}

// 生成一棵针叶树（scale=1，树根在原点）。lod=0 近景主树 / 1 远景背景林（面数减半）
function buildConifer(species, seed, lod = 0) {
  const sp = TREE_SPECIES[species];
  const rng = mulberry32(seed * 7919 + (species === 'pine' ? 3 : 1));
  const H = sp.H * (0.92 + rng() * 0.16);
  const bendAz = rng() * Math.PI * 2, bend = 0.1 + rng() * 0.25;
  const axis = y => {                                   // 树干弯曲后的中轴偏移
    const t = Math.max(0, y) / H;
    return [bend * t * t * Math.cos(bendAz), bend * t * t * Math.sin(bendAz)];
  };
  // —— 树干 ——
  const trunkTop = species === 'pine' ? 0.93 : 0.97;
  const r0 = species === 'pine' ? 0.021 * H : 0.024 * H;
  const RAD = lod ? 8 : 12, ROWS = lod ? 8 : 18;
  let trunk = new THREE.CylinderGeometry(0.1 * r0, r0, H * trunkTop + 0.35, RAD, ROWS, true);
  trunk.translate(0, (H * trunkTop + 0.35) / 2 - 0.35, 0);   // 根部埋入地下 0.35 m，坡地上不露底
  {
    const p = trunk.attributes.position, uv = trunk.attributes.uv;
    const flareH = 0.7 + 0.05 * H;
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), z = p.getZ(i);
      const y = p.getY(i), ang = Math.atan2(z, x);
      const f = Math.max(0, 1 - (y + 0.35) / flareH);
      const flare = 1 + 1.1 * f * f * (0.6 + 0.4 * Math.cos(ang * 5 + seed));   // 板根
      const bark = 1 + 0.045 * triNoise(Math.cos(ang) * 2, y * 1.4, Math.sin(ang) * 2, seed);
      const [ox, oz] = axis(y);
      p.setXYZ(i, x * flare * bark + ox, y, z * flare * bark + oz);
      uv.setXY(i, uv.getX(i) * 2, (y + 0.35) / 1.7);      // 按实际尺寸铺树皮：周向 2 次、每 1.7 m 一次
    }
    trunk.computeVertexNormals();
    weldSeamNormals(trunk, RAD, ROWS);
  }
  const limbs = [trunk];
  const trunkAt = y => { const [ox, oz] = axis(y); return new THREE.Vector3(ox, y, oz); };
  // 枯枝桩：树冠以下残留的短枝（向外略下垂）
  const stubTop = species === 'pine' ? sp.crownBase * H : Math.max(0.6, sp.crownBase * H);
  const nStub = lod ? 0 : (species === 'pine' ? 9 : 4);
  for (let i = 0; i < nStub; i++) {
    const y = 0.9 + rng() * (stubTop - 0.9);
    const a = rng() * Math.PI * 2, len = 0.15 + rng() * 0.35;
    const p0 = trunkAt(y);
    const p1 = p0.clone().add(new THREE.Vector3(Math.cos(a) * len, -len * (0.1 + rng() * 0.3), Math.sin(a) * len));
    limbs.push(makeLimbGeometry(p0, p1, 0.02 + rng() * 0.012, 0.004));
  }
  // —— 针叶 ——
  const buf = { pos: [], col: [], idx: [] };
  if (species === 'spruce') {
    let N = sp.tiers[0] + Math.floor(rng() * (sp.tiers[1] - sp.tiers[0] + 1));
    if (lod) N = Math.round(N * 0.6);                    // 远景：层数减少、每层更厚，剪影不变
    const yb = (sp.crownBase * (0.8 + rng() * 0.5)) * H, yt = 0.93 * H;
    const spacing = (yt - yb) / (N - 1);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      const y = yb + (yt - yb) * Math.pow(t, 0.95) + (rng() - 0.5) * spacing * 0.3;
      const [ox, oz] = axis(y);
      const nb = sp.lobes[0] + Math.floor(rng() * (sp.lobes[1] - sp.lobes[0] + 1));
      addNeedleTier(buf, {
        cx: ox + (rng() - 0.5) * 0.04 * H, cy: y, cz: oz + (rng() - 0.5) * 0.04 * H,
        R: sp.rMax * H * Math.pow(1 - t, 0.92) * (0.86 + rng() * 0.28) + 0.16,
        dh: spacing * 1.55, droop: spacing * (0.5 + 1.0 * (1 - t)) * sp.droop,
        nb, phase: rng() * 6.283, lobeAmp: 0.5, dome: 0,
        bright: (0.8 + 0.35 * t) * (0.85 + rng() * 0.3), sp, rng, seed: seed + i,
        A: lod ? Math.max(12, nb * 2) : Math.max(24, nb * 5), K: lod ? 1 : 4
      });
    }
    // 顶梢：细长尖顶
    const [ox, oz] = axis(H);
    addNeedleTier(buf, {
      cx: ox, cy: 0.955 * H, cz: oz, R: 0.2, dh: 0.09 * H, droop: 0.05, nb: 5, phase: rng() * 6.283,
      lobeAmp: 0.4, dome: 0.4, bright: 1.15, sp, rng, seed: seed + 99, A: 15, K: 2
    });
  } else {
    const n = sp.branches[0] + Math.floor(rng() * (sp.branches[1] - sp.branches[0] + 1));
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1);
      const y = (sp.crownBase + (0.9 - sp.crownBase) * t + (rng() - 0.5) * 0.04) * H;
      const az = k * 2.39996 + (rng() - 0.5) * 0.8;       // 黄金角错开，树冠不偏一侧
      const reach = (0.1 + 0.2 * (1 - t)) * H * (0.75 + rng() * 0.5);
      const p0 = trunkAt(y - 0.02 * H);
      const p1 = trunkAt(y).add(new THREE.Vector3(Math.cos(az) * reach, 0.05 * H, Math.sin(az) * reach));
      limbs.push(makeLimbGeometry(p0, p1, 0.012 * H * (1 - 0.4 * t), 0.004 * H, lod ? 4 : 5));
      // 每根主枝托 3 团针叶：枝端最大、枝中段与侧上方各一团小的 → 不规则的团簇状树冠
      const clumps = lod ? 1 : 4;
      for (let q = 0; q < clumps; q++) {
        const c = q === 0 ? p1
          : q === 1 ? p0.clone().lerp(p1, 0.6).add(new THREE.Vector3(0, 0.025 * H, 0))
          : p1.clone().add(new THREE.Vector3((rng() - 0.5) * 0.13 * H, (0.02 + 0.04 * rng()) * H, (rng() - 0.5) * 0.13 * H));
        const R = (q === 0 ? (lod ? 1.35 : 1) : 0.72) * (0.068 + 0.03 * rng()) * H * (1.1 - 0.35 * t);
        addNeedleClump(buf, {
          cx: c.x, cy: c.y, cz: c.z, R, squash: 0.62 + rng() * 0.2,
          bright: (0.85 + 0.3 * t) * (0.85 + rng() * 0.3), sp, seed: seed + k * 3 + q, detail: lod ? 0 : 2
        });
      }
    }
    // 树顶一团
    const top = trunkAt(0.95 * H);
    addNeedleClump(buf, {
      cx: top.x, cy: top.y, cz: top.z, R: 0.085 * H, squash: 0.75, bright: 1.1, sp, seed: seed + 77, detail: lod ? 1 : 2
    });
  }
  const foliage = new THREE.BufferGeometry();
  foliage.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
  foliage.setAttribute('color', new THREE.Float32BufferAttribute(buf.col, 3));
  foliage.setIndex(buf.idx);
  foliage.computeVertexNormals();
  const trunkGeo = limbs.length > 1 ? mergeGeometries(limbs) : trunk;
  return { trunk: trunkGeo, foliage, H };
}

// 组装成 Group：Trunk + Foliage（树的"模板"部分，Blender 覆盖时整体替换它们）
function makeConiferGroup(species, seed, lod = 0) {
  const { trunk, foliage } = buildConifer(species, seed, lod);
  const g = new THREE.Group();
  g.name = species === 'pine' ? 'Pine' : 'Spruce';
  const tm = new THREE.Mesh(trunk, trunkMat);
  tm.name = 'Trunk';
  tm.castShadow = true; tm.receiveShadow = true;
  const fm = new THREE.Mesh(foliage, needleMat);
  fm.name = 'Foliage';
  // 针叶不投影也不受影：树在火堆 9~27 m 外，火光照度只剩 0.01~0.13 lux（远低于天光），
  // 树冠投影肉眼不可见，却要在点光阴影的 6 个立方体面里各渲染一遍（约 +60 万三角形）；
  // 双面薄片的自阴影还易出条纹（shadow acne）。树干仍投影
  fm.castShadow = false; fm.receiveShadow = false;
  g.add(tm, fm);
  return g;
}

function makeTree(x, z, s, species = 'spruce') {
  const tree = new THREE.Group();
  const seed = (Math.random() * 1e6) | 0;
  const body = makeConiferGroup(species, seed);
  body.userData.treeTemplate = species;                  // 覆盖加载时按树种整体替换
  tree.add(body);
  // 树脚矮灌木 0~2 丛（复用岩石几何压扁）
  const bushes = (Math.random() * 3) | 0;
  for (let i = 0; i < bushes; i++) {
    const bush = new THREE.Mesh(
      makeRockGeometry(0.3 * (0.7 + Math.random() * 0.6), Math.random() * 50, 0.4),
      bushMat
    );
    bush.name = 'Undergrowth';
    const ba = Math.random() * Math.PI * 2, br = 0.7 + Math.random() * 0.8;
    bush.position.set(Math.cos(ba) * br, 0.06, Math.sin(ba) * br);
    bush.scale.y = 0.62;
    bush.receiveShadow = true;
    tree.add(bush);
  }
  tree.name = `Tree_${species}_${String(trees.length).padStart(2, '0')}`;
  tree.scale.setScalar(s);
  tree.position.set(x, groundHeight(x, z), z);
  tree.rotation.y = Math.random() * Math.PI * 2;
  forestEnv.add(tree);
  trees.push({ g: tree, ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 0.5, amp: 0.008 + Math.random() * 0.014, species, s });
}
{
  const rng = mulberry32(7);
  for (let i = 0; i < 14; i++) {
    let a = rng() * Math.PI * 2;
    const r = 9 + rng() * 18;
    // 让出朝湖面/月亮的视野走廊（参考图中树木只在画面两侧）
    const d = angDiff(a, LAKE_AZ);
    if (Math.abs(d) < 0.6) a = LAKE_AZ + Math.sign(d || 1) * (0.6 + rng() * 0.25);
    const species = rng() < 0.68 ? 'spruce' : 'pine';
    makeTree(Math.cos(a) * r, Math.sin(a) * r, 0.85 + rng() * 0.85, species);
  }
}

// 中景背景林（r 28~62 m）：填补主树与远山之间的空旷地带，形成林缘层次。
// 3 个变体 × 2 树种的低面数模型，InstancedMesh 实例化（每部件一次 draw call），
// 避开湖面及其岸边；距离已超出火光阴影范围，不投影
const forestBackdrop = new THREE.Group();
forestBackdrop.name = 'ForestBackdrop';
{
  const rng = mulberry32(19);
  const lakeC = Math.cos(1.08), lakeS = Math.sin(1.08);
  const inLake = (x, z, m) => {                         // 湖面椭圆（与湖面网格同参数）+ 岸边留白 m
    const dx = x + 24, dz = z + 38;
    const lx = dx * lakeC - dz * lakeS, lz = dx * lakeS + dz * lakeC;
    return (lx / (27.2 + m)) ** 2 + (lz / (19.6 + m)) ** 2 < 1;
  };
  const variants = [];
  for (const species of ['spruce', 'pine']) {
    for (let v = 0; v < 3; v++) variants.push({ species, geo: buildConifer(species, 500 + v * 13, 1), mats: [] });
  }
  for (let tries = 0; tries < 400; tries++) {
    const a = rng() * Math.PI * 2, r = 28 + rng() * 34;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (inLake(x, z, 3)) continue;
    if (Math.abs(angDiff(a, LAKE_AZ)) < 0.42 && r < 46) continue;   // 湖面视野走廊
    if (fbm2(x * 0.06, z * 0.06, 57, 2) < -0.25) continue;          // 林窗：成片分布、有疏有密
    const v = variants[(rng() < 0.7 ? 0 : 3) + ((rng() * 3) | 0)];
    const s = 0.8 + rng() * 0.8;
    v.mats.push(new THREE.Matrix4().compose(
      new THREE.Vector3(x, groundHeight(x, z), z),
      new THREE.Quaternion().setFromAxisAngle(UP_AXIS, rng() * Math.PI * 2),
      new THREE.Vector3(s * (0.9 + rng() * 0.2), s, s * (0.9 + rng() * 0.2))
    ));
  }
  for (const v of variants) {
    if (!v.mats.length) continue;
    for (const [part, geo, mat] of [['Trunk', v.geo.trunk, trunkMat], ['Foliage', v.geo.foliage, needleMat]]) {
      const im = new THREE.InstancedMesh(geo, mat, v.mats.length);
      v.mats.forEach((m, i) => im.setMatrixAt(i, m));
      im.name = `Backdrop_${v.species}_${part}`;
      im.userData.treeTemplate = v.species;
      im.computeBoundingSphere();
      forestBackdrop.add(im);
    }
  }
}
forestEnv.add(forestBackdrop);

/* ============================================================
   海边场景：月光沙滩 + 夜海 —— 与森林场景二选一显示（beachEnv）。
   营地与篝火在原点不动，大海在湖面同一方位（默认视角的视野走廊）；
   泡沫线周期性冲上沙滩，月光在海面拉出碎光带，棕榈随风摇动
   ============================================================ */
const SEA_AZ = Math.atan2(-38, -24);                    // 与湖同方位：默认视角正对大海
const SEA_DIR = { x: Math.cos(SEA_AZ), z: Math.sin(SEA_AZ) };
const WATER_Y = -0.35;                                  // 海平面高度
const SHORE_S = 8.9;                                    // 岸线离营地的朝海距离（beachHeight 与海面的交线）
// 沙滩地形：营地平整，向海一侧缓坡入水，其余方向低矮沙丘
function beachHeight(x, z) {
  const s = x * SEA_DIR.x + z * SEA_DIR.z;              // 朝海方向的带符号距离
  const q = x * SEA_DIR.z - z * SEA_DIR.x;              // 沿岸线的横向坐标
  const ramp = THREE.MathUtils.smoothstep(Math.hypot(x, z), 4.5, 11);
  // 岸线不走直线：水线沿沙滩横向进退（大弯 + 小折），营地附近不受影响
  const wob = (1.2 * triNoise(q * 0.045, 0, 3.3, 9.1) + 0.5 * triNoise(q * 0.16, 0, 7.7, 4.6))
            * THREE.MathUtils.smoothstep(s, 3, 7);
  const shore = THREE.MathUtils.smoothstep(s, 5.5 + wob, 15 + wob);
  const dune = (0.22 * triNoise(x * 0.06, 0, z * 0.06, 21.7)
              + 0.08 * triNoise(x * 0.15, 1, z * 0.15, 4.2)) * ramp;
  return dune * (1 - shore) - 1.1 * shore;
}
const oceanGlints = [];   // 海面碎光（月光倒影带）
let coastHills = null;    // 海岸丘陵 + 礁岛（Blender 导出/覆盖用）
const shoreFoam = [];     // 冲滩泡沫线
const swellBands = [];    // 近岸涌浪亮带
{
  const rng = mulberry32(207);
  // —— 沙地：程序化沙粒贴图（比林地土色更浅、颗粒更细）——
  const S = 512;
  const col = document.createElement('canvas'); col.width = col.height = S;
  const bmp = document.createElement('canvas'); bmp.width = bmp.height = S;
  const gc = col.getContext('2d'), gb = bmp.getContext('2d');
  gc.fillStyle = '#847358'; gc.fillRect(0, 0, S, S);
  gb.fillStyle = '#7a7a7a'; gb.fillRect(0, 0, S, S);
  gc.filter = 'blur(30px)';                             // 大尺度明暗沙斑
  for (let i = 0; i < 20; i++) {
    const l = rng();
    gc.fillStyle = `rgba(${110 + l * 60 | 0},${96 + l * 52 | 0},${70 + l * 40 | 0},0.4)`;
    gc.beginPath(); gc.ellipse(rng() * S, rng() * S, 50 + rng() * 100, 36 + rng() * 70, rng() * 3, 0, 7); gc.fill();
  }
  gc.filter = 'none';
  for (let i = 0; i < 8000; i++) {                      // 细沙粒（颜色与凹凸逐点对齐）
    const x = rng() * S, y = rng() * S, l = rng(), sz = 1 + rng() * 1.6;
    gc.fillStyle = `rgba(${120 + l * 70 | 0},${104 + l * 58 | 0},${76 + l * 44 | 0},${0.25 + rng() * 0.4})`;
    gc.fillRect(x, y, sz, sz);
    const bl = (100 + l * 110) | 0;
    gb.fillStyle = `rgba(${bl},${bl},${bl},${0.2 + rng() * 0.35})`;
    gb.fillRect(x, y, sz, sz);
  }
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const mk = (cv, srgb) => {
    const t = new THREE.CanvasTexture(cv);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 14); t.anisotropy = aniso;
    return t;
  };
  // 与林地同尺寸，外缘同样下潜到海岸山体环下方（陆侧）/ 海面下方（海侧）
  const sandGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 75, 75);
  {
    const pos = sandGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = -pos.getY(i);
      pos.setZ(i, beachHeight(x, z) - terrainDip(x, z));
    }
    sandGeo.computeVertexNormals();
  }
  const sandMaps = { map: mk(col, true), bumpMap: mk(bmp, false) };
  for (const t of Object.values(sandMaps)) t.repeat.set(16, 16);   // 保持旧版纹素密度
  const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({
    name: 'BeachSand', ...sandMaps, bumpScale: 0.04,
    roughness: 0.95, metalness: 0
  }));
  sand.name = 'BeachTerrain';
  sand.rotation.x = -Math.PI / 2;
  sand.receiveShadow = true;
  beachEnv.add(sand);

  // —— 夜海：深蓝大圆盘（远处被雾融进夜色成地平线），动感全靠碎光/涌浪/泡沫 ——
  const ocean = new THREE.Mesh(
    new THREE.CircleGeometry(300, 64),
    new THREE.MeshBasicMaterial({ name: 'NightSea', color: 0x0c1a2e })
  );
  ocean.name = 'Ocean';
  ocean.rotation.x = -Math.PI / 2;
  ocean.position.y = WATER_Y;
  beachEnv.add(ocean);

  // 月光倒影碎光：沿月亮方位撒在海面，随时间明灭漂移（云厚时同步变暗）
  const glintTex = radialTexture(64, [
    [0, 'rgba(214,230,255,0.9)'], [0.4, 'rgba(180,205,255,0.35)'], [1, 'rgba(150,180,255,0)']
  ]);
  const moonAz = Math.atan2(moonDir.z, moonDir.x);
  const glintGroup = new THREE.Group();
  glintGroup.rotation.y = -moonAz;                      // 组内 +x 指向月亮方位
  glintGroup.position.y = WATER_Y + 0.03;
  beachEnv.add(glintGroup);
  const gg = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < 26; i++) {
    const mesh = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({
      map: glintTex, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    }));
    mesh.rotation.x = -Math.PI / 2;
    const r = 13 + rng() * 75;                          // 径向：岸线外 → 远海
    const x0 = r, z0 = (rng() - 0.5) * (2 + r * 0.22);  // 倒影带随距离展宽
    mesh.position.set(x0, 0, z0);
    mesh.scale.set(0.5 + rng() * 0.9, 1.2 + rng() * 2.2, 1);   // 窄条：长轴横向（垂直视线）
    glintGroup.add(mesh);
    oceanGlints.push({
      mesh, x0, z0, ph: rng() * 6.28,
      sp: 0.5 + rng() * 1.4, baseOp: 0.22 + rng() * 0.38
    });
  }

  // —— 岸线组：组内 +z 朝向大海，泡沫线 / 涌浪亮带在其中往复 ——
  const shoreGroup = new THREE.Group();
  shoreGroup.rotation.y = Math.atan2(SEA_DIR.x, SEA_DIR.z);
  beachEnv.add(shoreGroup);
  // 泡沫贴图：横向白色碎泡带，两端羽化
  const foamTex = (() => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 32;
    const g = c.getContext('2d');
    g.filter = 'blur(3px)';
    for (let i = 0; i < 24; i++) {                      // 稀疏碎泡，留出空隙
      g.fillStyle = `rgba(235,244,255,${0.2 + rng() * 0.4})`;
      g.beginPath(); g.ellipse(rng() * 256, 10 + rng() * 12, 4 + rng() * 11, 2 + rng() * 3.5, 0, 0, 7); g.fill();
    }
    g.globalCompositeOperation = 'destination-in';      // 两端 + 上下缘羽化
    const m = g.createLinearGradient(0, 0, 256, 0);
    m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.12, 'rgba(0,0,0,1)');
    m.addColorStop(0.88, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = m; g.fillRect(0, 0, 256, 32);
    const mv = g.createLinearGradient(0, 0, 0, 32);
    mv.addColorStop(0, 'rgba(0,0,0,0)'); mv.addColorStop(0.3, 'rgba(0,0,0,1)');
    mv.addColorStop(0.7, 'rgba(0,0,0,1)'); mv.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mv; g.fillRect(0, 0, 256, 32);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  // 浪线条带几何：中段向岸凸出的弧（冲滩舌）+ 沿线折曲，尺寸烘进几何、不再用缩放
  // （平面 rotation.x=-π/2 后，局部 +y 指向组内 -z 即岸的方向）
  const makeWaveStrip = (w, d, bow, seed) => {
    const geo = new THREE.PlaneGeometry(w, d, 32, 3);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const u = p.getX(i) / w;                          // -0.5 … 0.5
      p.setY(i, p.getY(i) + bow * (1 - Math.pow(u * 2, 2))         // 浪弧：中段领先、两端拖后
                + 0.55 * triNoise(u * 5.2, 0, seed, seed * 1.7));  // 沿线折曲
    }
    return geo;
  };
  // 冲滩泡沫：短段错落——每段有自己的岸距偏移与节奏，
  // 低视角下不再连成横贯画面的直线，而是断续的浪花舌
  for (let i = 0; i < 6; i++) {
    const mesh = new THREE.Mesh(
      makeWaveStrip(7 + rng() * 8, 0.9 + rng() * 0.6, 0.5 + rng() * 0.8, 11 + i * 5.3),
      new THREE.MeshBasicMaterial({ map: foamTex, transparent: true, opacity: 0, depthWrite: false })
    );
    mesh.userData.noExport = true;   // 动态泡沫（透明度逐帧变化）不导出
    mesh.rotation.x = -Math.PI / 2 + 0.08;              // 顺着沙坡微仰
    const lx = -21 + i * 8.4 + (rng() - 0.5) * 5;       // 沿岸摊开、间距不均
    mesh.position.set(lx, WATER_Y + 0.05, SHORE_S);
    shoreGroup.add(mesh);
    shoreFoam.push({ mesh, lx, ph: rng(), T: 5 + rng() * 2.5, dz: (rng() - 0.5) * 1.6 });
  }
  for (let i = 0; i < 4; i++) {                         // 近岸涌浪亮带：短段由远及近推进后隐没
    const mesh = new THREE.Mesh(
      makeWaveStrip(14 + rng() * 10, 1.8, 1.0 + rng(), 31 + i * 7.7),
      new THREE.MeshBasicMaterial({
        map: foamTex, transparent: true, opacity: 0, color: 0x9fc0e8,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set((rng() - 0.5) * 30, WATER_Y + 0.04, SHORE_S + 8);
    shoreGroup.add(mesh);
    swellBands.push({ mesh, ph: rng(), T: 11 + rng() * 4, z0: SHORE_S + 2.5 });
  }

  // —— 贝壳：岸线附近的浅色小点缀（一次 draw call）——
  {
    const shells = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1, 7, 5),
      new THREE.MeshStandardMaterial({ name: 'Shell', color: 0xcfc0a6, roughness: 0.85 }),
      36
    );
    shells.name = 'Shells';
    const dummy = new THREE.Object3D();
    for (let i = 0; i < 36; i++) {
      const lx = (rng() - 0.5) * 40, lz = 4 + rng() * 4.2;
      const wx = SEA_DIR.z * lx + SEA_DIR.x * lz;       // 岸线组局部 → 世界
      const wz = -SEA_DIR.x * lx + SEA_DIR.z * lz;
      const sc = 0.025 + rng() * 0.035;
      dummy.position.set(wx, beachHeight(wx, wz) + sc * 0.3, wz);
      dummy.rotation.set(rng() * 0.6, rng() * 6.28, rng() * 0.6);
      dummy.scale.set(sc, sc * 0.45, sc * 0.8);
      dummy.updateMatrix();
      shells.setMatrixAt(i, dummy.matrix);
    }
    shells.receiveShadow = true;
    beachEnv.add(shells);
  }

  // —— 漂流木：褪色的枯木横卧在高潮线附近 ——
  {
    const driftMat = new THREE.MeshStandardMaterial({ name: 'Driftwood', color: 0x6f6150, roughness: 1 });
    for (let i = 0; i < 2; i++) {
      const mesh = new THREE.Mesh(makeLogGeometry(0.72, 1, 1, 9.4 + i * 3.1), driftMat);
      mesh.name = `Driftwood_${i}`;
      const lx = (i ? -1 : 1) * (8 + rng() * 5), lz = 5.6 + rng() * 1.6;
      const wx = SEA_DIR.z * lx + SEA_DIR.x * lz;
      const wz = -SEA_DIR.x * lx + SEA_DIR.z * lz;
      const rad = 0.07 + rng() * 0.03;
      mesh.scale.set(rad, 1.3 + rng() * 0.8, rad);
      mesh.position.set(wx, beachHeight(wx, wz) + rad * 0.9, wz);
      mesh.rotation.z = Math.PI / 2 + (rng() - 0.5) * 0.15;   // 倒放
      mesh.rotation.y = rng() * Math.PI;
      mesh.castShadow = true; mesh.receiveShadow = true;
      beachEnv.add(mesh);
    }
  }

  // —— 近岸礁石：半浸在浪线里的深色岩块 ——
  {
    const rockMat = new THREE.MeshStandardMaterial({ name: 'ShoreRock', color: 0x39332c, roughness: 0.95, flatShading: true });
    for (let i = 0; i < 3; i++) {
      const rock = new THREE.Mesh(makeRockGeometry(1, 61 + i * 7, 0.3), rockMat);
      rock.name = `ShoreRock_${i}`;
      const lx = (rng() - 0.5) * 34, lz = SHORE_S + rng() * 3;
      const wx = SEA_DIR.z * lx + SEA_DIR.x * lz;
      const wz = -SEA_DIR.x * lx + SEA_DIR.z * lz;
      const sc = 0.35 + rng() * 0.5;
      rock.scale.set(sc * (0.8 + rng() * 0.5), sc * 0.6, sc);
      rock.position.set(wx, WATER_Y + sc * 0.12, wz);
      rock.rotation.y = rng() * Math.PI * 2;
      rock.castShadow = true; rock.receiveShadow = true;
      beachEnv.add(rock);
    }
  }

  // —— 远景：营地背后的海岸丘陵（陆侧半环）+ 海上礁岛 ——
  // 旧版是 11 个压扁球体（光滑圆顶、MeshBasic 不受光、底部悬在地面外），
  // 改为与林地远山同一套环形高度场：丘陵从沙滩后缓升，两翼顺势没入海中成岬角；
  // 礁岛为脊状噪声塑形的岩体，水线处有浅色湿岩带
  {
    const S = THREE.MathUtils.smoothstep;
    const LAND_AZ = SEA_AZ + Math.PI;
    const coastHeight = (x, z) => {
      const r = Math.hypot(x, z);
      const sd = x * SEA_DIR.x + z * SEA_DIR.z;                    // >SHORE_S 即海
      const inland = S(SHORE_S - sd, 4, 46);                       // 岸线 0 → 内陆 1
      const ridge = ridged2(x * 0.013, z * 0.013, 61, 5);
      const hill = 0.5 + 0.5 * fbm2(x * 0.03, z * 0.03, 67, 4);
      return beachHeight(x, z) - 0.28
           + inland * (3.2 * hill * S(r, 66, 88) + 30 * S(r, 72, 130) * (0.1 + 1.2 * ridge));
    };
    const coastColor = (x, y, z, ny, out) => {
      const n = fbm2(x * 0.05, z * 0.05, 71, 3);
      const sandW = 1 - S(y, 0.4, 2.2);
      const scrubW = S(ny, 0.6, 0.82) * (1 - S(y, 14 + 5 * n, 22 + 5 * n));
      let r = 0.058, g = 0.053, b = 0.048;                         // 岩
      r += (0.016 - r) * scrubW; g += (0.025 - g) * scrubW; b += (0.015 - b) * scrubW;   // 灌丛/海岸松
      r += (0.17 - r) * sandW; g += (0.13 - g) * sandW; b += (0.085 - b) * sandW;        // 沙
      const k = 0.8 + 0.35 * (0.5 + 0.5 * n);
      out[0] = r * k; out[1] = g * k; out[2] = b * k;
    };
    const mat = makeDistantMaterial('CoastTerrain');
    const coast = coastHills = new THREE.Group();
    coast.name = 'CoastHills';
    const ring = new THREE.Mesh(makeRingTerrain({
      rIn: 64, rOut: 200, radial: 60, angular: 220,
      azFrom: LAND_AZ - 2.0, azTo: LAND_AZ + 2.0,
      heightFn: coastHeight, colorFn: coastColor
    }), mat);
    ring.name = 'CoastRange';
    coast.add(ring);
    // 丘陵低坡的海岸松林剪影
    const frng = mulberry32(606);
    const pts = [];
    for (let tries = 0; tries < 5000 && pts.length < 600; tries++) {
      const az = LAND_AZ + (frng() - 0.5) * 3.4, r = 70 + frng() * 70;
      const x = Math.cos(az) * r, z = Math.sin(az) * r;
      const y = coastHeight(x, z);
      if (y < 2.5 || y > 18) continue;
      const e = 1.5;
      const ny = 1 / Math.hypot((coastHeight(x + e, z) - coastHeight(x - e, z)) / (2 * e), 1,
                                (coastHeight(x, z + e) - coastHeight(x, z - e)) / (2 * e));
      if (ny < 0.75 || fbm2(x * 0.05, z * 0.05, 93, 3) < -0.1) continue;
      pts.push([x, y, z, 4 + frng() * 4]);
    }
    const belt = new THREE.Mesh(makeSilhouetteForest(pts, 607, [0.014, 0.022, 0.013]), mat);
    belt.name = 'CoastForest';
    coast.add(belt);
    beachEnv.add(coast);

    // 礁岛：局部极坐标网格，外缘沉到水下；平移到海上
    for (let i = 0; i < 4; i++) {
      const az = SEA_AZ + (rng() - 0.5) * 1.7;
      const d = 85 + rng() * 45;
      const h = 4 + rng() * 7, R = h * (2.2 + rng() * 1.6);
      const cx = Math.cos(az) * d, cz = Math.sin(az) * d, seed = 700 + i * 11;
      const geo = makeRingTerrain({
        rIn: 0.4, rOut: R * 1.35, radial: 16, angular: 56,
        heightFn: (x, z) => {
          const rr = Math.hypot(x, z), a = Math.atan2(z, x);
          const edge = R * (1 + 0.28 * fbm2(Math.cos(a) * 1.4 + seed, Math.sin(a) * 1.4, seed, 3));
          const prof = Math.pow(Math.max(0, 1 - (rr / edge) ** 2), 1.2);
          return WATER_Y - 1.6 + (h + 1.6) * prof * (0.5 + 0.9 * ridged2(x * 0.09, z * 0.09, seed, 4));
        },
        colorFn: (x, y, z, ny, out) => {
          const wet = 1 - THREE.MathUtils.smoothstep(y, WATER_Y + 0.2, WATER_Y + 1.2);
          const scrub = THREE.MathUtils.smoothstep(ny, 0.7, 0.9) * THREE.MathUtils.smoothstep(y, 1.5, 3);
          out[0] = 0.05 + 0.05 * wet - 0.034 * scrub;
          out[1] = 0.047 + 0.045 * wet - 0.022 * scrub;
          out[2] = 0.044 + 0.04 * wet - 0.03 * scrub;
        }
      });
      geo.translate(cx, 0, cz);
      const isle = new THREE.Mesh(geo, mat);
      isle.name = `Islet_${i}`;
      coast.add(isle);
    }
  }
}

// —— 棕榈树：锥形弯曲树干（叶痕环纹）+ 羽状复叶冠，站在视野走廊两侧不挡海 ——
// 旧版叶片是一条锯齿边的弯曲窄带（像伞骨），树干等粗无收分。新版：
// · 树干：基部膨大、向上收细的弯曲锥管，树皮贴图画出一圈圈叶痕
// · 复叶：沿先扬后垂的叶轴两侧排列数十片小叶，小叶呈 V 形向下斜展、中段最长、两端渐短
// · 冠下 2~3 片枯叶下垂，冠心有叶鞘膨大部，椰果成簇
const palmBarkTex = (() => {
  // 叶痕环纹：沿 U（树干长度方向）重复的横向深色环 + 纵向细纤维
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const g = cv.getContext('2d');
  const rng = mulberry32(333);
  g.fillStyle = '#6b5640'; g.fillRect(0, 0, 128, 64);
  for (let i = 0; i < 90; i++) {
    const l = 70 + rng() * 60 | 0;
    g.fillStyle = `rgba(${l},${l * 0.82 | 0},${l * 0.62 | 0},0.35)`;
    g.fillRect(0, rng() * 64, 128, 1);
  }
  for (let x = 0; x < 128; x += 32) {                  // 每 32px 一道叶痕：暗槽 + 亮棱
    g.fillStyle = 'rgba(30,22,14,0.85)'; g.fillRect(x + 12, 0, 5, 64);
    g.fillStyle = 'rgba(150,126,96,0.55)'; g.fillRect(x + 17, 0, 3, 64);
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
const palmTrunkMat = new THREE.MeshStandardMaterial({
  name: 'PalmTrunk', map: palmBarkTex, bumpMap: palmBarkTex, bumpScale: 0.03, roughness: 1
});
const palmLeafMat = new THREE.MeshStandardMaterial({
  name: 'PalmFronds', vertexColors: true, roughness: 0.85, side: THREE.DoubleSide
});
const palmNutMat = new THREE.MeshStandardMaterial({ name: 'Coconut', color: 0x3d2c17, roughness: 0.9 });

// 沿曲线的变径管：先生成单位半径 TubeGeometry，再逐圈按 radiusFn(t) 缩放到中轴
function makeTaperedTube(curve, tubular, radial, radiusFn) {
  const g = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
  const p = g.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    curve.getPointAt(t, c);
    const k = radiusFn(t);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      v.fromBufferAttribute(p, idx).sub(c).multiplyScalar(k).add(c);
      p.setXYZ(idx, v.x, v.y, v.z);
    }
  }
  g.computeVertexNormals();
  // Tube 的周向接缝（j=0 与 j=radial）同样成对重复，平均法线消除接缝线
  const n = g.attributes.normal;
  for (let i = 0; i <= tubular; i++) {
    const a = i * (radial + 1), b = a + radial;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const l = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l);
  }
  return g;
}

// 一片羽状复叶：叶轴折线（仰角 e0 → 末端下垂 droop），两侧各 n 片 V 形下斜的小叶
function addPalmFrond(buf, o) {
  const { base, az, e0, droop, L, n, rng, colA, colB } = o;
  const fwdH = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
  const side = new THREE.Vector3(-Math.sin(az), 0, Math.cos(az));
  const pts = [], dirs = [];
  const p = base.clone();
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const ang = e0 - (e0 + droop) * Math.pow(u, 1.35);
    const d = fwdH.clone().multiplyScalar(Math.cos(ang)).setY(Math.sin(ang));
    pts.push(p.clone()); dirs.push(d);
    p.addScaledVector(d, L / n);
  }
  const push = (v, u) => {
    buf.pos.push(v.x, v.y, v.z);
    for (let c = 0; c < 3; c++) buf.col.push(colA[c] + (colB[c] - colA[c]) * u);
  };
  // 叶轴：细窄条
  for (let i = 0; i < n; i++) {
    const b = buf.pos.length / 3, w = 0.018 * L * (1 - 0.7 * i / n);
    for (const q of [pts[i], pts[i + 1]]) {
      push(q.clone().addScaledVector(side, -w), i / n);
      push(q.clone().addScaledVector(side, w), i / n);
    }
    buf.idx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3);
  }
  // 小叶
  for (let i = 1; i < n; i++) {
    const u = i / n;
    const ll = L * 0.36 * Math.pow(Math.sin(Math.PI * (0.08 + 0.92 * u)), 0.7) * (1 - 0.25 * u) * (0.85 + rng() * 0.3);
    const w = 0.045 * L * (1 - 0.45 * u);
    const beta = 0.45 + 0.5 * u + (rng() - 0.5) * 0.2;   // 下斜角：越靠叶尖越垂
    for (const sgn of [-1, 1]) {
      const dir = side.clone().multiplyScalar(sgn * Math.cos(beta))
        .addScaledVector(dirs[i], 0.45).setY(-Math.sin(beta) + dirs[i].y * 0.4).normalize();
      const b0 = pts[i], along = dirs[i].clone().multiplyScalar(w * 0.5);
      const mid = b0.clone().addScaledVector(dir, ll * 0.5).setY(b0.y + dir.y * ll * 0.5 - 0.04 * ll);
      const tip = b0.clone().addScaledVector(dir, ll).setY(b0.y + dir.y * ll - 0.14 * ll);
      const k = buf.pos.length / 3;
      push(b0.clone().sub(along), u);
      push(b0.clone().add(along), u);
      push(mid.clone().sub(along.clone().multiplyScalar(0.8)), Math.min(1, u + 0.25));
      push(mid.clone().add(along.clone().multiplyScalar(0.8)), Math.min(1, u + 0.25));
      push(tip, Math.min(1, u + 0.45));
      buf.idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3, k + 2, k + 4, k + 3);
    }
  }
}

// 棕榈模板（scale=1，树根在原点）：返回 Group(Palm) ⊃ Trunk / Fronds / Coconuts
function buildPalm(seed) {
  const rng = mulberry32(seed * 104729 + 5);
  const g = new THREE.Group();
  g.name = 'Palm';
  const h = 3.3 + rng() * 1.2;                          // 默认视角下冠顶低于月亮高度角，不遮月
  const leanA = rng() * Math.PI * 2, lean = 0.55 + rng() * 0.6;
  const lx = Math.cos(leanA) * lean, lz = Math.sin(leanA) * lean;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.3, 0),
    new THREE.Vector3(lx * 0.12, h * 0.4, lz * 0.12),
    new THREE.Vector3(lx * 0.55, h * 0.78, lz * 0.55),
    new THREE.Vector3(lx, h, lz)
  ]);
  const trunkGeo = makeTaperedTube(curve, 28, 10, t =>
    0.085 + 0.06 * Math.pow(1 - t, 3) + 0.012 * (1 - t));   // 基部膨大、向上收细
  {
    const uv = trunkGeo.attributes.uv;                      // U 沿树干：每 0.3 m 一道叶痕（贴图每重复含 4 道）
    for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * (h / 1.2));
  }
  const trunk = new THREE.Mesh(trunkGeo, palmTrunkMat);
  trunk.name = 'Trunk';
  trunk.castShadow = true;
  g.add(trunk);
  // 冠心叶鞘：顶端一团略膨大的绿褐色，遮住叶柄交汇处
  const top = new THREE.Vector3(lx, h, lz);
  const buf = { pos: [], col: [], idx: [] };
  addNeedleClump(buf, {
    cx: top.x, cy: top.y + 0.05, cz: top.z, R: 0.2, squash: 0.9, bright: 1, seed: seed + 1, detail: 1,
    sp: { inner: [0.03, 0.03, 0.015], tip: [0.05, 0.055, 0.025] }
  });
  const nLeaf = 11 + ((rng() * 4) | 0);
  for (let i = 0; i < nLeaf; i++) {
    const az = (i / nLeaf) * Math.PI * 2 + rng() * 0.4;
    const young = i % 3 === 0;                              // 新叶更挺、更短、更亮
    addPalmFrond(buf, {
      base: top, az, e0: young ? 0.75 + rng() * 0.3 : 0.2 + rng() * 0.35,
      droop: young ? 0.7 + rng() * 0.4 : 1.1 + rng() * 0.6,
      L: (young ? 1.5 : 1.9) + rng() * 0.6, n: 14, rng,
      colA: [0.028, 0.05, 0.022], colB: young ? [0.07, 0.095, 0.035] : [0.052, 0.075, 0.03]
    });
  }
  for (let i = 0; i < 2 + ((rng() * 2) | 0); i++) {       // 下垂枯叶
    addPalmFrond(buf, {
      base: top.clone().setY(h - 0.12), az: rng() * Math.PI * 2, e0: -0.9 - rng() * 0.3, droop: 0.35,
      L: 1.3 + rng() * 0.4, n: 10, rng, colA: [0.06, 0.042, 0.024], colB: [0.1, 0.075, 0.045]
    });
  }
  const fronds = new THREE.BufferGeometry();
  fronds.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
  fronds.setAttribute('color', new THREE.Float32BufferAttribute(buf.col, 3));
  fronds.setIndex(buf.idx);
  fronds.computeVertexNormals();
  const crown = new THREE.Mesh(fronds, palmLeafMat);
  crown.name = 'Fronds';
  crown.castShadow = true;
  g.add(crown);
  const nuts = [];
  for (let i = 0; i < 3 + ((rng() * 3) | 0); i++) {        // 椰果成簇挂在冠下
    const na = rng() * Math.PI * 2, nr = 0.1 + rng() * 0.08;
    const s = new THREE.SphereGeometry(0.085 * (0.85 + rng() * 0.3), 8, 6);
    s.scale(1, 1.15, 1);
    s.translate(lx + Math.cos(na) * nr, h - 0.16 - rng() * 0.1, lz + Math.sin(na) * nr);
    nuts.push(s);
  }
  const nutMesh = new THREE.Mesh(mergeGeometries(nuts), palmNutMat);
  nutMesh.name = 'Coconuts';
  nutMesh.castShadow = true;
  g.add(nutMesh);
  return g;
}
const palms = [];
function makePalm(x, z, s) {
  const g = new THREE.Group();
  const body = buildPalm((Math.random() * 1e6) | 0);
  body.userData.treeTemplate = 'palm';
  g.add(body);
  g.name = `Palm_${String(palms.length).padStart(2, '0')}`;
  g.scale.setScalar(s);
  g.position.set(x, beachHeight(x, z), z);
  beachEnv.add(g);
  palms.push(g);
  // 加入树摇系统：棕榈摆幅比松树略大
  trees.push({ g, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.4, amp: 0.016 + Math.random() * 0.014, species: 'palm', s });
}

// 海面动画：碎光明灭漂移、泡沫冲滩退回、涌浪亮带推进（云厚时同步变暗）
function updateOcean(t) {
  if (!beachEnv.visible) return;
  const dim = 1 - 0.6 * cloudNow;
  for (const g of oceanGlints) {
    const s = Math.max(0, Math.sin(t * g.sp + g.ph));
    g.mesh.material.opacity = g.baseOp * s * s * dim;
    g.mesh.position.x = g.x0 + Math.sin(t * 0.26 + g.ph) * 0.7;
    g.mesh.position.z = g.z0 + Math.cos(t * 0.2 + g.ph * 1.7) * 0.8;
  }
  for (const f of shoreFoam) {
    const p = (t / f.T + f.ph) % 1;
    // 前 35% 快速涌上沙滩，其余时间缓慢退回海里
    const run = p < 0.35 ? THREE.MathUtils.smoothstep(p / 0.35, 0, 1)
                         : 1 - THREE.MathUtils.smoothstep((p - 0.35) / 0.65, 0, 1);
    const lz = SHORE_S + f.dz + 1.7 - 3.1 * run;
    const wx = SEA_DIR.z * f.mesh.position.x + SEA_DIR.x * lz;
    const wz = -SEA_DIR.x * f.mesh.position.x + SEA_DIR.z * lz;
    f.mesh.position.z = lz;
    f.mesh.position.x = f.lx + Math.sin(t * 0.5 + f.ph * 6.28) * 0.6;
    f.mesh.position.y = Math.max(beachHeight(wx, wz) + 0.05, WATER_Y + 0.04);
    f.mesh.material.opacity = Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.12)), 0.7) * 0.55 * dim;
  }
  for (const b of swellBands) {
    const p = (t / b.T + b.ph) % 1;
    b.mesh.position.z = b.z0 + 20 * (1 - p);            // 由远海推向岸线
    b.mesh.material.opacity = Math.sin(Math.PI * p) * 0.09 * dim;
  }
}

// 道具阴影标记：userData.noCastShadow（单个网格）/ noCastShadowTree（整棵子树）不投影
function applyPropShadows(group) {
  const walk = (o, noCast) => {
    noCast = noCast || !!o.userData.noCastShadowTree;
    if (o.isMesh) {
      o.castShadow = !noCast && !o.userData.noCastShadow;
      o.receiveShadow = true;
    }
    for (const c of o.children) walk(c, noCast);
  };
  walk(group, false);
}
const PROP_GROUPS = {};   // 模型键 → 道具 Group（Blender 导出 / 覆盖加载按此查找）
function placeProp(group, az, r, faceIn = true, key = null) {
  if (key) { PROP_GROUPS[key] = group; group.userData.modelKey = key; }
  group.position.set(Math.cos(az) * r, 0, Math.sin(az) * r);
  if (faceIn) group.rotation.y = Math.atan2(-Math.cos(az), -Math.sin(az));   // 正面（+Z）朝火堆
  applyPropShadows(group);
  scene.add(group);
  campProps.push(group);
}

// 帐篷：脊形帐，帐布带垂坠下陷（中段帆布下沉、檐口外张）+ 拉绳地钉 + 软门帘
function makeTent() {
  const g = new THREE.Group();
  g.name = 'Tent';
  const W = 1.6, H = 1.06, D = 1.95;
  const fab = new THREE.MeshStandardMaterial({ name: 'TentFabric', color: 0x3a6651, roughness: 0.93, side: THREE.DoubleSide });
  const fabIn = new THREE.MeshStandardMaterial({ name: 'TentDoorRoll', color: 0x0c1611, roughness: 1, side: THREE.DoubleSide });
  const rope = new THREE.MeshStandardMaterial({ name: 'Rope', color: 0x9a8a63, roughness: 1 });
  const peg = new THREE.MeshStandardMaterial({ name: 'TentPeg', color: 0x241a10, roughness: 1 });
  const RIDGE_SAG = 0.075, PANEL_SAG = 0.12, EAVE_FLARE = 0.14;

  // 帐布脊线随深度的高度（两端立柱撑起、中段微沉）
  const ridgeY = v => H - RIDGE_SAG * Math.sin(Math.PI * v);
  // 单侧帐布面（side=±1）：基边在地、顶边到脊；中段帆布向下、向内垂坠
  function sidePanel(side) {
    const NU = 5, NV = 10, pos = [], idx = [];
    for (let iv = 0; iv <= NV; iv++) {
      const v = iv / NV, z = -D / 2 + v * D, sagV = Math.sin(Math.PI * v);
      const ry = ridgeY(v);
      const baseX = side * (W / 2 + EAVE_FLARE * sagV);   // 檐口中段外张
      for (let iu = 0; iu <= NU; iu++) {
        const u = iu / NU;                                 // 0 基边 → 1 脊
        let x = baseX * (1 - u);
        let y = ry * u;
        const slope = Math.sin(Math.PI * u);               // 坡面中段下陷最深
        y -= PANEL_SAG * sagV * slope;
        x -= side * 0.06 * sagV * slope;                   // 同时微向内收
        pos.push(x, y, z);
      }
    }
    for (let iv = 0; iv < NV; iv++) for (let iu = 0; iu < NU; iu++) {
      const a = iv * (NU + 1) + iu, b = a + 1, c = a + (NU + 1), d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, fab);
    m.name = side > 0 ? 'TentPanelR' : 'TentPanelL';
    return m;
  }
  g.add(sidePanel(1), sidePanel(-1));

  // 后墙：封闭三角
  const back = new THREE.Shape();
  back.moveTo(-W / 2, 0); back.lineTo(W / 2, 0); back.lineTo(0, ridgeY(0)); back.closePath();
  const backMesh = new THREE.Mesh(new THREE.ShapeGeometry(back), fab);
  backMesh.name = 'TentBackWall';
  backMesh.position.z = -D / 2; backMesh.rotation.y = Math.PI;
  g.add(backMesh);

  // 前墙：三角开门洞（梯形门），洞后置暗色内壁显出深度
  const front = new THREE.Shape();
  front.moveTo(-W / 2, 0); front.lineTo(W / 2, 0); front.lineTo(0, ridgeY(1)); front.closePath();
  const dw = W * 0.16, dh = H * 0.62;
  const hole = new THREE.Path();
  hole.moveTo(-dw, 0); hole.lineTo(dw, 0); hole.lineTo(dw * 0.55, dh); hole.lineTo(-dw * 0.55, dh); hole.closePath();
  front.holes.push(hole);
  const frontMesh = new THREE.Mesh(new THREE.ShapeGeometry(front), fab);
  frontMesh.name = 'TentFrontWall';
  frontMesh.position.z = D / 2;
  g.add(frontMesh);
  // 内壁改为暖色微光：像帐内亮着一盏小灯，从门洞透出。
  // 形状用贴合帐篷内腔三角截面的梯形——矩形的上角会从倾斜帐布里
  // 穿出来，在帐外亮出一块悬空光斑
  const innerH = ridgeY(1 - 0.28 / D) * 0.76;
  const innerShape = new THREE.Shape();
  innerShape.moveTo(-W * 0.4, 0);
  innerShape.lineTo(W * 0.4, 0);
  innerShape.lineTo(W * 0.056, innerH);
  innerShape.lineTo(-W * 0.056, innerH);
  innerShape.closePath();
  const inner = new THREE.Mesh(
    new THREE.ShapeGeometry(innerShape),
    new THREE.MeshStandardMaterial({
      name: 'TentInnerGlow',
      color: 0x30190a, emissive: 0xff9a46, emissiveIntensity: 0.55,
      roughness: 1, side: THREE.DoubleSide
    })
  );
  inner.name = 'TentInnerWall';
  inner.position.set(0, 0, D / 2 - 0.28);
  g.add(inner);
  // 帐内暖光：不投影的小点光，在门前地面漏出一小片光晕。
  // 注意：不能随道具组显隐——光源数量变化会触发全场景着色器重编译（明显卡顿），
  // 摆放后由 placeProp 调用方把它 attach 到场景根部，收纳时只把强度归零
  const innerGlow = new THREE.PointLight(0xffb26a, 0.9, 2.6, 2);
  innerGlow.name = 'TentGlow';
  innerGlow.position.set(0, 0.5, D / 2 - 0.3);
  g.add(innerGlow);
  g.userData.innerGlow = innerGlow;

  // 门帘卷起横绑在门洞上沿（露营帐"卷门"开放），两侧系带垂下
  const rollLen = dw * 1.5;
  const doorRoll = new THREE.Mesh(new THREE.CapsuleGeometry(0.034, rollLen, 6, 10), fabIn);
  doorRoll.name = 'TentDoorRoll';
  doorRoll.rotation.z = Math.PI / 2;
  doorRoll.position.set(0, dh - 0.03, D / 2 + 0.035);
  doorRoll.scale.set(1, 1, 0.8);
  g.add(doorRoll);
  for (const sx of [-rollLen * 0.42, rollLen * 0.42]) {
    const tie = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.005, 0.11, 5), rope);
    tie.position.set(sx, dh - 0.085, D / 2 + 0.045);
    g.add(tie);
  }

  // 拉绳 + 地钉：从两端脊顶斜拉到地面
  function strut(p1, p2, radius, mat) {
    const dir = new THREE.Vector3().subVectors(p2, p1), len = dir.length();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 5), mat);
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return mesh;
  }
  for (const sz of [-1, 1]) {
    const peak = new THREE.Vector3(0, ridgeY(sz > 0 ? 1 : 0) - 0.02, sz * (D / 2 - 0.02));
    const stake = new THREE.Vector3(0, 0, sz * (D / 2 + 0.55));
    g.add(strut(peak, stake, 0.006, rope));
    const pegM = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.008, 0.12, 5), peg);
    pegM.position.copy(stake).setY(0.04); pegM.rotation.x = sz * 0.3;
    g.add(pegM);
  }
  return g;
}

// 折叠椅：经典露营椅结构——两侧 X 交叉管腿 + 座侧轨 + 脚部横撑 +
// 下垂布面座/靠背（帆布中央凹陷）+ 后仰靠背立柱 + 扶手
function makeChair() {
  const g = new THREE.Group();
  g.name = 'Chair';
  const frame = new THREE.MeshStandardMaterial({ name: 'ChairFrame', color: 0x20242a, roughness: 0.6, metalness: 0.3 });
  const fab = new THREE.MeshStandardMaterial({ name: 'ChairFabric', color: 0x7a2d2d, roughness: 0.9, side: THREE.DoubleSide });
  const w = 0.46, d = 0.44, railY = 0.34;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  // 布面：四边固定在框架上、中央下垂（与帐篷帆布同思路）
  const sagPanel = (wid, hei, sag, segs = 7) => {
    const geo = new THREE.PlaneGeometry(wid, hei, segs, segs);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, -sag * Math.cos(Math.PI * x / wid) * Math.cos(Math.PI * y / hei));
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, fab);
  };
  // 两侧 X 交叉腿 + 座侧轨
  for (const sx of [-1, 1]) {
    const x = sx * w / 2;
    g.add(makeBeamBetween(V(x, railY, d / 2 - 0.02), V(x, 0.015, -d / 2), 0.015, frame, 6));
    g.add(makeBeamBetween(V(x, railY, -d / 2 + 0.02), V(x, 0.015, d / 2), 0.015, frame, 6));
    g.add(makeBeamBetween(V(x, railY, -d / 2), V(x, railY, d / 2), 0.014, frame, 6));
  }
  // 前后脚部横撑
  g.add(makeBeamBetween(V(-w / 2, 0.03, d / 2), V(w / 2, 0.03, d / 2), 0.012, frame, 6));
  g.add(makeBeamBetween(V(-w / 2, 0.03, -d / 2), V(w / 2, 0.03, -d / 2), 0.012, frame, 6));
  // 座面布
  const seat = sagPanel(w - 0.02, d - 0.03, 0.05);
  seat.rotation.x = -Math.PI / 2;
  seat.position.y = railY + 0.004;
  g.add(seat);
  // 靠背立柱（后仰）+ 背顶横杆 + 靠背布
  const backTop = 0.66, lean = 0.085;
  for (const sx of [-1, 1]) {
    g.add(makeBeamBetween(V(sx * w / 2, railY, -d / 2), V(sx * (w / 2 - 0.012), backTop, -d / 2 - lean), 0.014, frame, 6));
  }
  g.add(makeBeamBetween(V(-(w / 2 - 0.012), backTop, -d / 2 - lean), V(w / 2 - 0.012, backTop, -d / 2 - lean), 0.013, frame, 6));
  const back = sagPanel(w - 0.05, 0.24, 0.035);
  back.position.set(0, (railY + backTop) / 2 + 0.03, -d / 2 - lean * 0.55);
  back.rotation.x = -0.28;
  g.add(back);
  // 扶手：背柱中段 → 前腿顶
  for (const sx of [-1, 1]) {
    g.add(makeBeamBetween(V(sx * w / 2, 0.5, -d / 2 - lean * 0.55), V(sx * w / 2, railY + 0.1, d / 2 - 0.04), 0.013, frame, 6));
  }
  return g;
}

// 背包：参考三视图重建的高筒技术登山包。
// +Z 为正面；先以包身、翻盖和加固底建立轮廓，细节按独立部件继续雕刻。
function makeBackpack() {
  const g = new THREE.Group();
  g.name = 'backpackRoot';

  const makeFabricMaps = (base, seed, repeatX = 7, repeatY = 12) => {
    const size = 64;
    const canvases = Array.from({ length: 4 }, () => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      return c;
    });
    const images = canvases.map(c => c.getContext('2d').createImageData(size, size));
    const hash = (x, y, s) => {
      let n = Math.imul(x + s * 37, 374761393) ^ Math.imul(y + s * 19, 668265263);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
    };
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = (y * size + x) * 4;
        const n = hash(x, y, seed);
        const macro = Math.sin((x + seed * 11) * 0.12) * 0.022 + Math.cos((y - seed * 7) * 0.10) * 0.02;
        const warp = ((x + y + seed) % 6 === 0 ? 1 : 0) - ((x - y + seed + 128) % 7 === 0 ? 0.55 : 0);
        const shade = THREE.MathUtils.clamp(0.9 + macro + (n - 0.5) * 0.07 + warp * 0.025, 0.72, 1.08);
        images[0].data[i] = base[0] * shade;
        images[0].data[i + 1] = base[1] * shade;
        images[0].data[i + 2] = base[2] * shade;
        images[1].data[i] = images[1].data[i + 1] = images[1].data[i + 2] = 205 + n * 38 - warp * 8;
        images[2].data[i] = images[2].data[i + 1] = images[2].data[i + 2] = 126 + warp * 28 + (n - 0.5) * 14;
        images[3].data[i] = images[3].data[i + 1] = images[3].data[i + 2] = 238 - Math.abs(macro) * 120 - (1 - n) * 8;
        for (const image of images) image.data[i + 3] = 255;
      }
    }
    canvases.forEach((c, i) => c.getContext('2d').putImageData(images[i], 0, 0));
    const textures = canvases.map(c => {
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      return tex;
    });
    textures[0].colorSpace = THREE.SRGBColorSpace;
    return { albedo: textures[0], roughness: textures[1], bump: textures[2], ao: textures[3] };
  };

  const canvasMaps = makeFabricMaps([82, 97, 58], 7);
  const reinforcedMaps = makeFabricMaps([53, 65, 39], 19, 8, 13);
  const webbingMaps = makeFabricMaps([37, 43, 25], 31, 10, 18);
  const canvas = new THREE.MeshStandardMaterial({
    color: 0xffffff, map: canvasMaps.albedo,
    roughness: 0.9, roughnessMap: canvasMaps.roughness,
    bumpMap: canvasMaps.bump, bumpScale: 0.018,
    aoMap: canvasMaps.ao, aoMapIntensity: 0.45
  });
  const reinforced = new THREE.MeshStandardMaterial({
    color: 0xffffff, map: reinforcedMaps.albedo,
    roughness: 0.94, roughnessMap: reinforcedMaps.roughness,
    bumpMap: reinforcedMaps.bump, bumpScale: 0.013,
    aoMap: reinforcedMaps.ao, aoMapIntensity: 0.5
  });
  const webbing = new THREE.MeshStandardMaterial({
    color: 0xffffff, map: webbingMaps.albedo,
    roughness: 0.86, roughnessMap: webbingMaps.roughness,
    bumpMap: webbingMaps.bump, bumpScale: 0.008,
    aoMap: webbingMaps.ao, aoMapIntensity: 0.35
  });
  const cordMat = new THREE.MeshStandardMaterial({ color: 0x171a10, roughness: 0.82 });
  const hardware = new THREE.MeshStandardMaterial({ color: 0x161a13, roughness: 0.56, metalness: 0.03 });
  const seamMat = new THREE.MeshStandardMaterial({ color: 0x9a9d72, roughness: 0.92 });

  const addStrapBetween = (name, a, b, width, depth, material, parent) => {
    const direction = b.clone().sub(a);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(width, direction.length(), depth), material);
    strap.name = name;
    strap.position.copy(a).add(b).multiplyScalar(0.5);
    strap.quaternion.setFromUnitVectors(UP_AXIS, direction.normalize());
    parent.add(strap);
    return strap;
  };
  const addCord = (name, points, parent, radius = 0.006, material = cordMat, radialSegments = 5) => {
    const cord = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 12, radius, radialSegments, false),
      material
    );
    cord.name = name;
    parent.add(cord);
    return cord;
  };
  const addBuckle = (name, position, scale, parent, faceBack = false) => {
    const buckle = new THREE.Group();
    buckle.name = name;
    buckle.position.copy(position);
    buckle.scale.setScalar(scale);
    if (faceBack) buckle.rotation.y = Math.PI;
    const frameShape = new THREE.Shape();
    frameShape.moveTo(-0.028, -0.031);
    frameShape.lineTo(0.028, -0.031);
    frameShape.lineTo(0.028, 0.031);
    frameShape.lineTo(-0.028, 0.031);
    frameShape.closePath();
    const frameHole = new THREE.Path();
    frameHole.moveTo(-0.015, -0.019);
    frameHole.lineTo(-0.015, 0.019);
    frameHole.lineTo(0.015, 0.019);
    frameHole.lineTo(0.015, -0.019);
    frameHole.closePath();
    frameShape.holes.push(frameHole);
    const frameGeo = new THREE.ExtrudeGeometry(frameShape, {
      depth: 0.012, bevelEnabled: true, bevelSegments: 1,
      bevelSize: 0.0015, bevelThickness: 0.0015
    });
    frameGeo.translate(0, 0, -0.006);
    const frame = new THREE.Mesh(frameGeo, hardware);
    frame.name = `${name}Frame`;
    buckle.add(frame);
    const latch = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.036, 0.016), hardware);
    latch.name = `${name}Latch`;
    buckle.add(latch);
    parent.add(buckle);
    return buckle;
  };

  // 正面轮廓直接按三视图描成圆角挤出体，避免胶囊几何产生“太空舱”剪影。
  const shellShape = new THREE.Shape();
  shellShape.moveTo(-0.18, 0.025);
  shellShape.lineTo(0.18, 0.025);
  shellShape.quadraticCurveTo(0.225, 0.03, 0.235, 0.12);
  shellShape.lineTo(0.235, 0.59);
  shellShape.quadraticCurveTo(0.225, 0.675, 0.145, 0.69);
  shellShape.quadraticCurveTo(0, 0.705, -0.145, 0.69);
  shellShape.quadraticCurveTo(-0.225, 0.675, -0.235, 0.59);
  shellShape.lineTo(-0.235, 0.12);
  shellShape.quadraticCurveTo(-0.225, 0.03, -0.18, 0.025);
  const shellGeo = new THREE.ExtrudeGeometry(shellShape, {
    depth: 0.26, curveSegments: 8, bevelEnabled: true,
    bevelSegments: 3, bevelSize: 0.018, bevelThickness: 0.018
  });
  shellGeo.translate(0, 0, -0.13);
  shellGeo.computeVertexNormals();

  const shellPivot = new THREE.Group();
  shellPivot.name = 'packShell';
  const shell = new THREE.Mesh(shellGeo, canvas);
  shell.name = 'packShellMesh';
  shellPivot.add(shell);
  g.add(shellPivot);

  // 宽翻盖比包身略向前探出，形成参考图清晰的上沿。
  const lidPivot = new THREE.Group();
  lidPivot.name = 'lidPivot';
  const lidShape = new THREE.Shape();
  lidShape.moveTo(-0.245, 0.70);
  lidShape.quadraticCurveTo(0, 0.665, 0.245, 0.70);
  lidShape.quadraticCurveTo(0.265, 0.72, 0.255, 0.78);
  lidShape.quadraticCurveTo(0.24, 0.84, 0.155, 0.855);
  lidShape.quadraticCurveTo(0, 0.875, -0.155, 0.855);
  lidShape.quadraticCurveTo(-0.24, 0.84, -0.255, 0.78);
  lidShape.quadraticCurveTo(-0.265, 0.72, -0.245, 0.70);
  const lidGeo = new THREE.ExtrudeGeometry(lidShape, {
    depth: 0.31, curveSegments: 8, bevelEnabled: true,
    bevelSegments: 3, bevelSize: 0.014, bevelThickness: 0.014
  });
  lidGeo.translate(0, 0, -0.12);
  const lid = new THREE.Mesh(lidGeo, reinforced);
  lid.name = 'lidMesh';
  lid.userData.noCastShadow = true;   // 与包身有软重叠，关闭投影避免低分辨率阴影锯齿
  lidPivot.add(lid);
  g.add(lidPivot);

  // 加固底让模型落地，并与上方软质包身形成材质分区。
  const baseShape = new THREE.Shape();
  baseShape.moveTo(-0.19, 0.025);
  baseShape.lineTo(0.19, 0.025);
  baseShape.quadraticCurveTo(0.225, 0.04, 0.225, 0.11);
  baseShape.lineTo(0.225, 0.16);
  baseShape.lineTo(-0.225, 0.16);
  baseShape.lineTo(-0.225, 0.11);
  baseShape.quadraticCurveTo(-0.225, 0.04, -0.19, 0.025);
  const baseGeo = new THREE.ExtrudeGeometry(baseShape, {
    depth: 0.275, curveSegments: 6, bevelEnabled: true,
    bevelSegments: 2, bevelSize: 0.01, bevelThickness: 0.01
  });
  baseGeo.translate(0, 0, -0.1375);
  const base = new THREE.Mesh(baseGeo, reinforced);
  base.name = 'reinforcedBase';
  g.add(base);

  // 正面系统：浅工具袋、两条外侧压缩带、翻盖短带、扣具和双 X 弹力绳。
  const frontRig = new THREE.Group();
  frontRig.name = 'frontLoadSystem';
  g.add(frontRig);
  const frontPanelShape = new THREE.Shape();
  frontPanelShape.moveTo(-0.14, 0.225);
  frontPanelShape.lineTo(0.14, 0.225);
  frontPanelShape.quadraticCurveTo(0.155, 0.24, 0.15, 0.29);
  frontPanelShape.lineTo(0.13, 0.50);
  frontPanelShape.quadraticCurveTo(0, 0.535, -0.13, 0.50);
  frontPanelShape.lineTo(-0.15, 0.29);
  frontPanelShape.quadraticCurveTo(-0.155, 0.24, -0.14, 0.225);
  const frontPanelGeo = new THREE.ExtrudeGeometry(frontPanelShape, {
    depth: 0.025, curveSegments: 6, bevelEnabled: true,
    bevelSegments: 2, bevelSize: 0.006, bevelThickness: 0.006
  });
  frontPanelGeo.translate(0, 0, 0.151);
  const frontPanel = new THREE.Mesh(frontPanelGeo, reinforced);
  frontPanel.name = 'frontUtilityPanel';
  frontRig.add(frontPanel);

  for (const sx of [-0.155, 0.155]) {
    addStrapBetween(
      `frontCompressionStrap${sx < 0 ? 'L' : 'R'}`,
      new THREE.Vector3(sx, 0.205, 0.172), new THREE.Vector3(sx, 0.675, 0.172),
      0.026, 0.012, webbing, frontRig
    );
  }
  for (const sx of [-0.105, 0.105]) {
    addStrapBetween(
      `lidStrap${sx < 0 ? 'L' : 'R'}`,
      new THREE.Vector3(sx, 0.675, 0.202), new THREE.Vector3(sx, 0.555, 0.202),
      0.025, 0.012, webbing, frontRig
    );
    addBuckle(
      `frontBuckle${sx < 0 ? 'L' : 'R'}`,
      new THREE.Vector3(sx, 0.54, 0.207), 0.78, frontRig
    );
  }

  const laceRows = [0.46, 0.36, 0.255];
  for (const y of laceRows) {
    for (const sx of [-0.145, 0.145]) {
      const anchor = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.016, 0.018), hardware);
      anchor.name = `bungeeAnchor${sx < 0 ? 'L' : 'R'}${Math.round(y * 1000)}`;
      anchor.position.set(sx, y, 0.19);
      frontRig.add(anchor);
    }
  }
  const F = (x, y) => new THREE.Vector3(x, y, 0.205);
  addCord('bungeeUpperA', [F(-0.145, 0.46), F(0.145, 0.36)], frontRig);
  addCord('bungeeUpperB', [F(0.145, 0.46), F(-0.145, 0.36)], frontRig);
  addCord('bungeeLowerA', [F(-0.145, 0.36), F(0.145, 0.255)], frontRig);
  addCord('bungeeLowerB', [F(0.145, 0.36), F(-0.145, 0.255)], frontRig);

  // Raised piping and short stitch bars keep the fabric construction readable at camp scale.
  const lidSeam = addCord('lidEdgePiping', [
    new THREE.Vector3(-0.225, 0.705, 0.198),
    new THREE.Vector3(0, 0.674, 0.198),
    new THREE.Vector3(0.225, 0.705, 0.198)
  ], frontRig, 0.0035, seamMat, 5);
  lidSeam.userData.noCastShadow = true;

  const frontSeamPoints = [
    new THREE.Vector3(-0.135, 0.232, 0.185),
    new THREE.Vector3(0.135, 0.232, 0.185),
    new THREE.Vector3(0.148, 0.29, 0.185),
    new THREE.Vector3(0.128, 0.495, 0.185),
    new THREE.Vector3(0, 0.526, 0.185),
    new THREE.Vector3(-0.128, 0.495, 0.185),
    new THREE.Vector3(-0.148, 0.29, 0.185)
  ];
  const frontPanelSeam = new THREE.Mesh(
    new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(frontSeamPoints, true, 'centripetal'),
      40, 0.0028, 5, true
    ),
    seamMat
  );
  frontPanelSeam.name = 'frontPanelPiping';
  frontPanelSeam.userData.noCastShadow = true;
  frontRig.add(frontPanelSeam);

  const stitchGeo = new THREE.BoxGeometry(0.017, 0.003, 0.003);
  const strapStitches = new THREE.InstancedMesh(stitchGeo, seamMat, 16);
  strapStitches.name = 'compressionStrapStitches';
  strapStitches.userData.noCastShadow = true;
  const stitchMatrix = new THREE.Matrix4();
  let stitchIndex = 0;
  for (const sx of [-0.155, 0.155]) {
    for (let row = 0; row < 8; row++) {
      stitchMatrix.makeTranslation(sx, 0.235 + row * 0.057, 0.1805);
      strapStitches.setMatrixAt(stitchIndex++, stitchMatrix);
    }
  }
  frontRig.add(strapStitches);

  // 左右侧袋和横向收紧带，扩大参考图下部的功能性剪影。
  const pocketRig = new THREE.Group();
  pocketRig.name = 'sidePocketSystem';
  g.add(pocketRig);
  const sidePocketShape = new THREE.Shape();
  sidePocketShape.moveTo(-0.075, 0.075);
  sidePocketShape.lineTo(0.075, 0.075);
  sidePocketShape.quadraticCurveTo(0.092, 0.085, 0.092, 0.12);
  sidePocketShape.lineTo(0.075, 0.33);
  sidePocketShape.lineTo(-0.075, 0.33);
  sidePocketShape.lineTo(-0.092, 0.12);
  sidePocketShape.quadraticCurveTo(-0.092, 0.085, -0.075, 0.075);
  const sidePocketGeo = new THREE.ExtrudeGeometry(sidePocketShape, {
    depth: 0.06, curveSegments: 5, bevelEnabled: true,
    bevelSegments: 2, bevelSize: 0.006, bevelThickness: 0.006
  });
  sidePocketGeo.translate(0, 0, -0.03);
  for (const sx of [-1, 1]) {
    const pocket = new THREE.Mesh(sidePocketGeo, reinforced);
    pocket.name = `sidePocket${sx < 0 ? 'L' : 'R'}`;
    pocket.rotation.y = sx * Math.PI / 2;
    pocket.position.x = sx * 0.245;
    pocketRig.add(pocket);
    const sideStrap = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.028, 0.27), webbing);
    sideStrap.name = `sideCompression${sx < 0 ? 'L' : 'R'}`;
    sideStrap.position.set(sx * 0.235, 0.49, 0);
    pocketRig.add(sideStrap);
  }

  // 背负系统：背垫、弧形肩带、胸带和宽腰带均独立成组。
  const harnessRig = new THREE.Group();
  harnessRig.name = 'rearHarnessSystem';
  g.add(harnessRig);
  const backPad = new THREE.Mesh(new THREE.CapsuleGeometry(0.072, 0.38, 6, 12), reinforced);
  backPad.name = 'backPad';
  backPad.scale.set(1.58, 1, 0.27);
  backPad.position.set(0, 0.405, -0.151);
  harnessRig.add(backPad);
  for (const sx of [-1, 1]) {
    addCord(`shoulderStrap${sx < 0 ? 'L' : 'R'}`, [
      new THREE.Vector3(sx * 0.075, 0.71, -0.162),
      new THREE.Vector3(sx * 0.155, 0.54, -0.205),
      new THREE.Vector3(sx * 0.145, 0.32, -0.195),
      new THREE.Vector3(sx * 0.112, 0.205, -0.16)
    ], harnessRig, 0.024, webbing, 6);
  }
  addStrapBetween(
    'sternumStrap', new THREE.Vector3(-0.145, 0.47, -0.21), new THREE.Vector3(0.145, 0.47, -0.21),
    0.022, 0.011, webbing, harnessRig
  );
  addBuckle('sternumBuckle', new THREE.Vector3(0, 0.47, -0.219), 0.72, harnessRig, true);

  const hipRig = new THREE.Group();
  hipRig.name = 'hipBeltSystem';
  g.add(hipRig);
  for (const sx of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.SphereGeometry(0.5, 14, 8), reinforced);
    wing.name = `hipWing${sx < 0 ? 'L' : 'R'}`;
    wing.scale.set(0.165, 0.062, 0.055);
    wing.position.set(sx * 0.245, 0.14, -0.07);
    wing.rotation.z = sx * -0.18;
    hipRig.add(wing);
  }
  addStrapBetween(
    'waistStrap', new THREE.Vector3(-0.23, 0.13, -0.145), new THREE.Vector3(0.23, 0.13, -0.145),
    0.027, 0.012, webbing, hipRig
  );

// 简单可复现的随机数（树木布局固定）
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 确定性值噪声（叠加正弦）：同一输入恒得同一输出，供顶点位移共用——
// 相同位置的重复顶点位移一致，几何保持闭合
function triNoise(x, y, z, seed = 0) {
  return Math.sin(x * 1.7 + seed * 12.9 + Math.sin(z * 2.3 + seed * 0.7)) * 0.5
       + Math.sin(y * 2.9 + seed * 7.3 + Math.sin(x * 1.9 + seed * 1.3)) * 0.3
       + Math.sin(z * 3.7 + seed * 3.1 + Math.sin(y * 2.7 + seed * 2.1)) * 0.2;
}

// 2D 梯度噪声（Perlin 式，整数哈希取梯度方向）：地形/山体专用。
// triNoise 是叠加正弦，大范围会出现明显周期条纹；山脊需要无周期、各向同性的噪声
function hash2i(ix, iz, seed) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iz | 0, 668265263) ^ Math.imul(seed | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function gradNoise2(x, z, seed = 0) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const uz = fz * fz * fz * (fz * (fz * 6 - 15) + 10);
  const g = (cx, cz) => {
    const a = hash2i(cx, cz, seed) * Math.PI * 2;
    return Math.cos(a) * (x - cx) + Math.sin(a) * (z - cz);
  };
  const n0 = g(ix, iz) + (g(ix + 1, iz) - g(ix, iz)) * ux;
  const n1 = g(ix, iz + 1) + (g(ix + 1, iz + 1) - g(ix, iz + 1)) * ux;
  return (n0 + (n1 - n0) * uz) * 1.41;                 // ≈ [-1, 1]
}
// 分形布朗运动：起伏的丘陵/地表
function fbm2(x, z, seed = 0, oct = 5) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * gradNoise2(x * f, z * f, seed + i * 17);
    n += a; a *= 0.5; f *= 2.03;
  }
  return s / n;
}
// 脊状多重分形：1-|n| 取平方形成尖锐山脊，每层按上一层结果加权——
// 山脊处细节丰富、山谷平缓，比"球体加噪声"更像真实山体
function ridged2(x, z, seed = 0, oct = 5) {
  let s = 0, a = 0.5, f = 1, w = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    let v = 1 - Math.abs(gradNoise2(x * f, z * f, seed + i * 31));
    v *= v * w;
    w = Math.min(1, Math.max(0, v * 1.8));
    s += v * a; n += a; a *= 0.5; f *= 2.07;
  }
  return s / n;
}
// 两方位角之差，归一到 [-π, π]
function angDiff(a, b) { return Math.atan2(Math.sin(a - b), Math.cos(a - b)); }

// 岩石/灌木几何：细分二十面体 + 双频噪声径向位移（先焊合顶点，位移后法线平滑）
function makeRockGeometry(radius, seed, rough = 0.26) {
  let geo = new THREE.IcosahedronGeometry(radius, 2);
  geo.deleteAttribute('uv');
  geo.deleteAttribute('normal');
  geo = mergeVertices(geo);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const nx = v.x / radius, ny = v.y / radius, nz = v.z / radius;
    const d = 1 + rough * triNoise(nx * 1.4, ny * 1.4, nz * 1.4, seed)
                + rough * 0.38 * triNoise(nx * 4.2, ny * 4.2, nz * 4.2, seed + 9);
    pos.setXYZ(i, v.x * d, v.y * d, v.z * d);
  }
  geo.computeVertexNormals();
  return geo;
}

// 木柴几何：圆柱 + 周向不圆度与沿轴节疤起伏（端面顶点与侧壁同步位移，保持闭合）
function makeLogGeometry(rTop, rBot, len, seed) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, len, 10, 6);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const rad = Math.hypot(v.x, v.z);
    if (rad < 1e-5) continue;                        // 端面圆心不动
    const ang = Math.atan2(v.z, v.x);
    const d = 1 + 0.10 * triNoise(Math.cos(ang) * 1.5, v.y / len * 5, Math.sin(ang) * 1.5, seed)
                + 0.05 * Math.sin(v.y / len * 19 + seed * 2.7);
    pos.setXYZ(i, v.x * d, v.y, v.z * d);
  }
  geo.computeVertexNormals();
  return geo;
}

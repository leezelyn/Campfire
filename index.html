<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜间篝火 · Three.js</title>
<style>
  @font-face {
    font-family: "CampJapanese";
    src: url("assets/fonts/Chisuga_Shotai0.2.7.subset.woff2") format("woff2");
    font-display: swap;
  }
  @font-face {
    font-family: "CampEnglish";
    src: url("assets/fonts/PlaywriteUSTrad-Regular.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "CampJapaneseLetter";
    src: url("assets/fonts/ゆずの木楷書.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "CampChinese";
    src: url("assets/fonts/方正楷体 简体中文.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --camp-ui-font: "CampChinese", "Microsoft YaHei UI", sans-serif;
    --camp-letter-font: "CampChinese", "Microsoft YaHei UI", sans-serif;
  }
  html[lang="en"] {
    --camp-ui-font: "CampEnglish", "Segoe UI", sans-serif;
    --camp-letter-font: "CampEnglish", "Segoe UI", sans-serif;
  }
  html[lang="ja"] {
    --camp-ui-font: "CampJapanese", "Yu Gothic UI", sans-serif;
    --camp-letter-font: "CampJapaneseLetter", "Yu Mincho", serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05080f; }
  body { font-family: var(--camp-ui-font); }
  #app { width: 100%; height: 100%; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,14,26,.92), rgba(3,5,10,.98));
    color: #f3e9d8; font-family: var(--camp-ui-font);
    cursor: pointer; user-select: none;
    transition: opacity 1.2s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  /* 启动遮罩期间隐藏操作 UI（参数面板 / HUD / 加柴按钮），进入后随遮罩淡出再淡入 */
  #hud, #addLog, #activityBar, #activityStatus, #panel, #ghCorner, #sceneSwitch { transition: opacity .9s ease .35s; }
  #overlay:not(.hidden) ~ #hud,
  #overlay:not(.hidden) ~ #addLog,
  #overlay:not(.hidden) ~ #activityBar,
  #overlay:not(.hidden) ~ #activityStatus,
  #overlay:not(.hidden) ~ #panel,
  #overlay:not(.hidden) ~ #sceneSwitch,
  #overlay:not(.hidden) ~ #ghCorner { opacity: 0; pointer-events: none; transition: none; }
  #overlay h1 { font-size: 42px; font-weight: 300; letter-spacing: .35em; margin: 0 0 18px; text-indent: .35em; }
  #overlay p  { font-size: 15px; color: #b8a98f; margin: 6px 0; letter-spacing: .1em; }
  #overlay .fire-icon { font-size: 64px; margin-bottom: 24px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity:.85 } 50% { transform: scale(1.12); opacity:1 } }

  .gh-link {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    color: #b8a98f; font: 13px/1 var(--camp-ui-font); letter-spacing: .05em;
    transition: color .2s, border-color .2s, background .2s;
  }
  .gh-link svg { width: 17px; height: 17px; fill: currentColor; }
  .gh-link:hover { color: #ffc890; }
  #ovGithub { margin-top: 26px; color: #7d7260; font-size: 13px; }
  #ghCorner {
    position: fixed; right: 16px; bottom: 14px; z-index: 5;
    padding: 6px 11px; border-radius: 999px; color: rgba(220,205,180,.7);
    background: rgba(8,12,22,.55); border: 1px solid rgba(255,160,70,.16);
    backdrop-filter: blur(5px); text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  #ghCorner:hover { color: #ffc890; border-color: rgba(255,160,70,.4); background: rgba(30,18,8,.7); }

  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 5;
    color: rgba(235,220,195,.75); font: 12px/1.7 var(--camp-ui-font);
    text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; letter-spacing: .04em;
    white-space: pre-line;
  }

  #panel {
    position: fixed; top: 14px; right: 14px; z-index: 6; width: 244px;
    background: rgba(8,12,22,.84); border: 1px solid rgba(255,160,70,.18);
    border-radius: 10px; backdrop-filter: blur(6px);
    font: 12px/1.4 var(--camp-ui-font); color: #e8dcc8;
    user-select: none;
  }
  #panelHead {
    padding: 10px 14px; cursor: pointer; letter-spacing: .12em;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panelHead:hover { color: #ffc890; }
  #panelBody { padding: 0 14px 12px; max-height: calc(100vh - 110px); overflow-y: auto; }
  #panel.collapsed #panelBody { display: none; }
  #panelBody::-webkit-scrollbar { width: 6px; }
  #panelBody::-webkit-scrollbar-thumb { background: rgba(255,160,70,.25); border-radius: 3px; }
  .pgroup {
    margin: 12px 0 4px; color: #ffa24d; font-size: 11px; letter-spacing: .25em;
    border-bottom: 1px solid rgba(255,160,70,.15); padding-bottom: 4px;
  }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; margin: 8px 0; }
  .pname { color: #cfc2ab; }
  .pval  { color: #ffb46a; font-variant-numeric: tabular-nums; }
  .prow input[type=range] {
    grid-column: 1 / -1; width: 100%; height: 16px; margin: 0;
    accent-color: #ff8a3c; cursor: pointer;
  }
  /* Blender 导出：模型下拉 + 导出按钮 */
  .bl-row { display: flex; gap: 6px; margin: 8px 0 4px; }
  .bl-row select, .bl-row button {
    font: 12px var(--camp-ui-font); color: #e8dcc8; border-radius: 6px;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,160,70,.3); padding: 4px 6px;
  }
  .bl-row select { flex: 1; min-width: 0; }
  .bl-row button { cursor: pointer; color: #ffc890; white-space: nowrap; }
  .bl-row button:hover:not(:disabled) { background: rgba(255,140,50,.18); }
  .bl-row button:disabled { opacity: .5; cursor: default; }
  .bl-note { font-size: 11px; color: #a89a84; line-height: 1.5; min-height: 1.5em; }

  #addLog {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 6; padding: 11px 28px; border-radius: 999px;
    background: rgba(30,18,8,.85); color: #ffc890;
    border: 1px solid rgba(255,160,70,.4);
    font: 15px/1 var(--camp-ui-font); letter-spacing: .15em;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: background .15s, box-shadow .15s, opacity .15s;
  }
  #addLog:hover { background: rgba(60,32,12,.9); box-shadow: 0 0 18px rgba(255,140,40,.35); }
  #addLog:active { transform: translateX(-50%) scale(.94); }
  #addLog:disabled { opacity: .45; cursor: default; box-shadow: none; }

  #activityBar {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
    z-index: 6; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: 96vw;
    padding: 7px; border-radius: 14px;
    background: rgba(8,12,22,.72); border: 1px solid rgba(255,160,70,.16);
    backdrop-filter: blur(8px);
  }
  #activityBar button {
    min-width: 106px; padding: 9px 13px; border-radius: 9px; white-space: nowrap;
    background: rgba(30,18,8,.78); color: #e7d5bc;
    border: 1px solid rgba(255,160,70,.28);
    font: 13px/1 var(--camp-ui-font);
    cursor: pointer; transition: color .15s, background .15s, box-shadow .15s, opacity .15s;
  }
  #activityBar button:hover {
    color: #ffc890; background: rgba(60,32,12,.9);
    box-shadow: 0 0 14px rgba(255,140,40,.22);
  }
  #activityBar button:disabled { opacity: .55; cursor: default; box-shadow: none; }
  #activityBar button.active {
    color: #ffd7a4; border-color: rgba(255,176,82,.68);
    background: rgba(76,35,10,.92);
  }
  #activityStatus {
    position: fixed; left: 50%; bottom: 126px; transform: translateX(-50%);
    z-index: 6; min-height: 18px; max-width: 720px;
    color: #ffd19a; font: 12px/1.4 var(--camp-ui-font);
    text-align: center; text-shadow: 0 1px 4px #000;
    pointer-events: none; letter-spacing: .04em;
  }

  #langSwitch {
    position: fixed; top: 14px; left: 16px; z-index: 11;   /* 高于启动遮罩，进入前也能切换语言 */
    display: flex; gap: 6px;
  }
  #langSwitch button,
  #sceneSwitch button {
    padding: 6px 11px; border-radius: 999px;
    background: rgba(8,12,22,.84); color: #cfc2ab;
    border: 1px solid rgba(255,160,70,.25);
    font: 12px/1 var(--camp-ui-font); letter-spacing: .05em;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: color .15s, background .15s, border-color .15s;
  }
  #langSwitch button:hover,
  #sceneSwitch button:hover { color: #ffc890; }
  #langSwitch button.active,
  #sceneSwitch button.active {
    background: rgba(60,32,12,.9); color: #ffb46a;
    border-color: rgba(255,160,70,.6);
  }

  /* 场景切换（森林 / 海边）：语言切换下方，进入前隐藏 */
  #sceneSwitch {
    position: fixed; top: 52px; left: 16px; z-index: 5;
    display: flex; gap: 6px;
  }

  /* 🎂 生日祝福卡（逐字浮现） */
  #bdayCard {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -45%) scale(.92);
    z-index: 14; width: min(86vw, 620px); min-height: 390px;
    padding: 38px 52px 42px; box-sizing: border-box;
    background: linear-gradient(160deg, rgba(46,32,18,.96), rgba(20,15,10,.98));
    border: 1px solid rgba(235,184,92,.45); border-radius: 22px;
    box-shadow: 0 12px 50px rgba(140,84,22,.24), inset 0 0 42px rgba(235,174,72,.07);
    color: #f5ead7; font-family: var(--camp-ui-font);
    opacity: 0; pointer-events: none; transition: opacity .9s ease, transform .9s ease;
  }
  #bdayCard.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #bdayCard.accepted {
    transform: translate(-50%, -50%) scale(1.025);
    border-color: rgba(246,205,126,.78);
    box-shadow: 0 12px 58px rgba(170,108,30,.3), inset 0 0 48px rgba(246,196,100,.12);
  }
  #bdayCardHead { font-size: 48px; line-height: 1; text-align: center; margin-bottom: 22px; }
  #bdayCardBody {
    white-space: pre-wrap; line-height: 2; font-size: 32px; letter-spacing: .06em;
    min-height: 8em; text-align: center; font-family: var(--camp-letter-font);
  }
  #bdayCardBody::after { content: '▌'; opacity: .55; animation: bdayCaret 1s step-end infinite; }
  #bdayCard.complete #bdayCardBody::after { display: none; }
  #bdayCardActions {
    display: flex; justify-content: center; gap: 16px; margin-top: 28px;
  }
  #bdayCardActions button {
    min-width: 174px; min-height: 52px; padding: 12px 22px; border-radius: 999px;
    border: 1px solid rgba(235,190,110,.32); cursor: pointer;
    font: 18px/1.25 var(--camp-ui-font);
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  #bdayCardActions button:hover { transform: translateY(-1px); }
  #bdayAccept {
    color: #2a1b0b; background: linear-gradient(90deg, rgba(223,164,65,.94), rgba(242,195,105,.96));
    box-shadow: 0 4px 18px rgba(205,137,36,.18);
  }
  #bdayRepeat { color: #e8d7bc; background: rgba(255,255,255,.05); }
  @media (max-width: 680px) {
    #bdayCard {
      width: min(92vw, 540px); min-height: 340px;
      padding: 30px 24px 32px;
    }
    #bdayCardHead { font-size: 42px; margin-bottom: 18px; }
    #bdayCardBody { font-size: clamp(18px, 4.6vw, 21px); line-height: 1.85; min-height: 7.5em; }
    #bdayCardActions { gap: 10px; margin-top: 22px; }
    #bdayCardActions button {
      min-width: 0; flex: 1; min-height: 48px; padding: 10px 12px;
      font-size: clamp(14px, 3.6vw, 17px);
    }
  }
  #bdayRepeat:hover { border-color: rgba(242,202,130,.55); background: rgba(255,255,255,.09); }
  @keyframes bdayCaret { 50% { opacity: 0; } }

  /* 隐蔽的四位彩蛋入口 + 页面内编辑器 */
  #bdayUnlock {
    width: max-content; margin: 16px auto 0; opacity: .82;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    transition: opacity .25s ease;
  }
  #bdayUnlock:focus-within { opacity: 1; }
  #bdayUnlockHint {
    display: block; color: rgba(225,232,244,.74);
    text-align: right; font: 14px/1.2 var(--camp-ui-font);
    letter-spacing: .08em; white-space: nowrap;
  }
  #bdayUnlockInput {
    width: 120px; height: 44px; display: block; box-sizing: border-box; margin: 0; padding: 7px 11px;
    border: 1px solid rgba(210,220,240,.2); border-radius: 6px;
    outline: 0; background: rgba(10,15,25,.25); color: rgba(232,237,247,.82);
    text-align: center; font: 18px/1.2 ui-monospace, "Cascadia Mono", monospace;
    letter-spacing: .25em; caret-color: rgba(225,232,245,.6);
  }
  #bdayUnlockInput:focus { border-color: rgba(225,190,125,.48); background: rgba(18,20,24,.42); }
  #bdayUnlockInput::placeholder { color: rgba(220,228,242,.52); }

  /* 流线动感：四位口令入口的流光边框 + 掠光 + 脉动外发光 */
  @property --unlockFlow { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .unlock-field {
    position: relative; display: inline-flex; padding: 2px; border-radius: 9px;
    isolation: isolate; animation: unlockGlow 3.4s ease-in-out infinite;
  }
  .unlock-field::before {            /* 绕着边框流动的光带 */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px;
    background: conic-gradient(from var(--unlockFlow),
      rgba(255,209,138,0) 0deg, rgba(255,209,138,0) 60deg,
      rgba(255,226,172,.95) 120deg, rgba(255,176,92,.6) 168deg,
      rgba(255,209,138,0) 220deg, rgba(255,209,138,0) 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude; animation: unlockFlowSpin 3.4s linear infinite;
    pointer-events: none; z-index: 2;
  }
  .unlock-field::after {             /* 横向掠过的一道流线 */
    content: ""; position: absolute; inset: 2px; border-radius: 7px;
    background: linear-gradient(105deg, transparent 38%, rgba(255,238,205,.55) 50%, transparent 62%);
    background-size: 220% 100%; background-repeat: no-repeat;
    mix-blend-mode: screen; pointer-events: none; z-index: 3;
    animation: unlockSweep 3.4s ease-in-out infinite;
  }
  @keyframes unlockFlowSpin { to { --unlockFlow: 360deg; } }
  @keyframes unlockSweep {
    0% { background-position: 165% 0; opacity: 0; }
    16% { opacity: 1; }
    52% { background-position: -65% 0; opacity: 0; }
    100% { background-position: -65% 0; opacity: 0; }
  }
  @keyframes unlockGlow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255,190,110,.25)); }
    50% { filter: drop-shadow(0 0 9px rgba(255,198,122,.55)); }
  }
  #bdayUnlock:focus-within .unlock-field { animation: none; filter: drop-shadow(0 0 11px rgba(255,202,130,.6)); }
  #bdayUnlock:focus-within .unlock-field::before { animation-duration: 1.9s; }
  #bdayUnlock:focus-within .unlock-field::after { animation-duration: 1.9s; }
  @media (prefers-reduced-motion: reduce) {
    .unlock-field, .unlock-field::before, .unlock-field::after { animation: none; }
  }
  #bdayUnlock.wrong { animation: unlockWrong .28s ease; }
  @keyframes unlockWrong {
    25%, 75% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
  }
  #bdayGear {
    position: fixed; right: 14px; bottom: 16px; z-index: 13; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid rgba(235,184,92,.42); background: rgba(42,29,15,.84);
    color: #fff; font-size: 19px; cursor: pointer; backdrop-filter: blur(6px);
  }
  #bdayGear:hover { background: rgba(78,50,20,.94); }
  #bdayEditor {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(6,4,10,.55);
  }
  #bdayEditor.open { display: flex; }
  #bdayEditor .be-card {
    width: min(90vw, 380px); max-height: 86vh; overflow-y: auto; box-sizing: border-box;
    background: linear-gradient(160deg, rgba(44,31,18,.97), rgba(20,15,10,.98));
    border: 1px solid rgba(235,184,92,.42); border-radius: 16px; padding: 20px 22px;
    color: #f5ead7; font: 14px/1.5 var(--camp-ui-font);
    box-shadow: 0 14px 60px rgba(140,84,22,.28);
  }
  #bdayEditor h3 { margin: 0 0 12px; font-weight: 600; text-align: center; }
  #bdayEditor label { display: block; margin: 12px 0 0; font-size: 12px; color: #e8cfaa; }
  #bdayEditor input, #bdayEditor select, #bdayEditor textarea {
    width: 100%; box-sizing: border-box; margin-top: 5px; padding: 8px 10px;
    background: rgba(0,0,0,.3); border: 1px solid rgba(235,184,92,.3); border-radius: 8px;
    color: #fff; font: 14px var(--camp-ui-font); resize: vertical;
  }
  #bdayEditor .be-row { display: flex; gap: 10px; margin-top: 16px; }
  #bdayEditor .be-row button { flex: 1; padding: 10px; border-radius: 999px; cursor: pointer; border: none; font: 600 14px var(--camp-ui-font); }
  #beApply { background: linear-gradient(90deg,#dca141,#efc46f); color: #281a09; }
  #beClose { background: rgba(255,255,255,.1); color: #ead8bc; }
  #bdayEditor .be-tip { font-size: 11px; color: #bda27c; margin: 12px 0 0; line-height: 1.6; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <div class="fire-icon">🔥</div>
  <h1 id="ovTitle">夜 间 篝 火</h1>
  <p id="ovEnter">点击任意处进入（开启声音）</p>
  <p id="ovHint">拖动旋转 · 滚轮缩放 —— 远离篝火，声音按 1/r 衰减</p>
  <form id="bdayUnlock" autocomplete="off">
    <label id="bdayUnlockHint" for="bdayUnlockInput">月日 · MMDD</label>
    <span class="unlock-field">
      <input id="bdayUnlockInput" type="password" inputmode="numeric" maxlength="4"
        pattern="[0-9]{4}" placeholder="····">
    </span>
  </form>
  <a id="ovGithub" class="gh-link" href="https://github.com/leezelyn" target="_blank" rel="noopener" onclick="event.stopPropagation()">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>github.com/leezelyn
  </a>
</div>
<div id="langSwitch">
  <button data-lang="zh" class="active">中</button>
  <button data-lang="en">EN</button>
  <button data-lang="ja">日</button>
</div>
<div id="sceneSwitch">
  <button data-scene="forest" class="active">🌲 森林</button>
  <button data-scene="beach">🏖 海边</button>
</div>
<div id="hud"></div>
<div id="bdayCard">
  <div id="bdayCardHead">🎁</div>
  <div id="bdayCardBody"></div>
  <div id="bdayCardActions">
    <button id="bdayAccept" type="button">✓ 收下祝福</button>
    <button id="bdayRepeat" type="button">↻ 再读一遍</button>
  </div>
</div>
<button id="bdayGear" title="生日惊喜设置" hidden>🎂</button>
<div id="bdayEditor"><div class="be-card">
  <h3>🎂 生日惊喜 · 设置</h3>
  <label>名字（萤火虫拼字）<input id="beName" type="text" maxlength="16"></label>
  <label>祝福语（名字上方一行）<input id="beGreet" type="text" maxlength="24"></label>
  <label>祝福卡（每行一句）<textarea id="beCard" rows="4"></textarea></label>
  <label>主题<select id="beTheme">
    <option value="rainbow">🌈 彩虹流光</option>
    <option value="0xff5fa2">🌸 暖粉</option>
    <option value="0x8a6bff">💜 蓝紫</option>
    <option value="0xffd34d">🌟 暖金</option>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import {

  createChopLogInstance, createChopHalfInstance
} from './src/assets/AssetManager.js';

/* ============================================================
   基础场景
   ============================================================ */
// 夜空配色：天顶 / 地平线（= 雾色）。地平线比天顶略亮，远山剪影才读得出来
const SKY = {
  forest: { zenith: 0x03060d, horizon: 0x0f1828 },

};
const UP_AXIS = new THREE.Vector3(0, 1, 0);   // 提前声明：makeChair→makeBeamBetween 在营地道具阶段就会用到
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY.forest.zenith);
scene.fog = new THREE.FogExp2(SKY.forest.horizon, 0.012);

// 场景分组：森林 / 海边二选一显示；篝火、营地道具、天空（星月云）两景共用
const forestEnv = new THREE.Group();
const beachEnv = new THREE.Group();
forestEnv.name = 'ForestEnv';
beachEnv.name = 'BeachEnv';
beachEnv.visible = false;
scene.add(forestEnv, beachEnv);
let sceneMode = 'forest';   // 'forest' | 'beach'，由 applyScene 切换

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(3.6, 2.0, 5.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// 3D 资产管线（src/assets）：Blender 制作的正式模型在场景构建开始时就发起下载，
// 与后面的程序化建模并行；用到时再 await（见帐篷摆放处）
const assets = new AssetManager({ renderer });
assets.preload(['tent', 'backpack', 'chair', 'lantern', 'kettle', 'kettle-stand', 'torch', 'pinecone', 'log-1', 'log-2', 'log-3',
  'stump', 'axe', 'chop-log', 'chop-half', 'woodpile', 'mug']);
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

/* ============================================================
   可调参数（右上角滑块面板，运行时实时生效）
   ============================================================ */
const P = {
  fireScale:   0.24,    // 火势：火焰大小、火光强度、轰鸣音量
  buoyancy:    1.0,    // 热浮升力 (m/s²)
  sparkRate:   22,     // 火星生成率 (个/秒)
  smokeRate:   0,      // 烟雾生成率 (个/秒)
  wind:        0.22,   // 风速 (m/s)
  shadowFlick: 0.5,    // 影子闪动:火光投影的快速抖动幅度
  masterVol:   0.9,    // 总音量
  crackleRate: 6,      // 噼啪平均频率 (次/秒)
  rolloff:     1.0,    // 声音距离衰减系数（1 = 物理真实的 1/r）
  airAbsorb:   1.0,    // 空气高频吸收强度
  moonInt:     0.12,   // 月光强度（月牙较弱）
  fog:         0.012,  // 雾浓度
  exposure:    1.1,    // 画面曝光
  rain:        0.0,    // 细雨强度 0..1（雨中火更弱、更多水汽与嘶声、雾更浓）
  cloud:       0.25,   // 云量 0..1：云层厚度与遮月程度
  moonPhase:   138     // 月相角度（度）：0≈满月，90≈上弦，138 标准蛾眉月，180≈新月
};

/* ============================================================
   环境：地面、星空、月亮、树木、石头
   ============================================================ */
// 地面：多尺度程序化砂土 + 凹凸贴图——火光斜照下有微浮雕与碎石，不再像平面贴图
function makeGroundTextures() {
  const S = 512;
  const col = document.createElement('canvas'); col.width = col.height = S;
  const bmp = document.createElement('canvas'); bmp.width = bmp.height = S;
  const gc = col.getContext('2d'), gb = bmp.getContext('2d');
  const rng = mulberry32(99);
  // 底色略提亮：原 #241a10 线性反照率仅 ~1.5%，比煤还黑，月光/天光下远处地面整片死黑
  gc.fillStyle = '#35281a'; gc.fillRect(0, 0, S, S);
  gb.fillStyle = '#7a7a7a'; gb.fillRect(0, 0, S, S);                 // 中灰 = 凹凸基准（平）
  // 大尺度土斑（柔和明暗块）——打破平铺感
  gc.filter = 'blur(26px)';
  for (let i = 0; i < 24; i++) {
    const l = rng();
    gc.fillStyle = `rgba(${28 + l * 44 | 0},${20 + l * 32 | 0},${12 + l * 22 | 0},0.5)`;
    gc.beginPath(); gc.ellipse(rng() * S, rng() * S, 40 + rng() * 90, 30 + rng() * 70, rng() * 3, 0, 7); gc.fill();
  }
  gc.filter = 'none';
  // 中/细尺度颗粒（颜色与凹凸逐点对齐）
  for (let i = 0; i < 6000; i++) {
    const x = rng() * S, y = rng() * S, l = rng(), s = 1 + rng() * 2.4;
    gc.fillStyle = `rgba(${36 + l * 62 | 0},${26 + l * 46 | 0},${16 + l * 30 | 0},${0.32 + rng() * 0.46})`;
    gc.fillRect(x, y, s, s);
    const bl = (95 + l * 120) | 0;
    gb.fillStyle = `rgba(${bl},${bl},${bl},${0.22 + rng() * 0.4})`;
    gb.fillRect(x, y, s, s);
  }
  // 散落小石子：色面带接地暗影 + 受光亮缘，凹凸上为凸起
  for (let i = 0; i < 150; i++) {
    const x = rng() * S, y = rng() * S, r = 2 + rng() * rng() * 7;
    gc.fillStyle = 'rgba(0,0,0,0.32)';
    gc.beginPath(); gc.ellipse(x + r * 0.35, y + r * 0.45, r * 1.05, r * 0.8, 0, 0, 7); gc.fill();
    gc.fillStyle = `rgba(${66 + rng() * 44 | 0},${56 + rng() * 36 | 0},${44 + rng() * 30 | 0},0.85)`;
    gc.beginPath(); gc.arc(x, y, r, 0, 7); gc.fill();
    gc.fillStyle = `rgba(${120 + rng() * 60 | 0},${110 + rng() * 50 | 0},${96 + rng() * 40 | 0},0.4)`;
    gc.beginPath(); gc.arc(x - r * 0.25, y - r * 0.28, r * 0.6, 0, 7); gc.fill();
    gb.fillStyle = 'rgba(205,205,205,0.9)';
    gb.beginPath(); gb.arc(x, y, r, 0, 7); gb.fill();
  }
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const mk = (cv, srgb) => {
    const t = new THREE.CanvasTexture(cv);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); t.anisotropy = aniso;
    return t;
  };
  return { map: mk(col, true), bumpMap: mk(bmp, false) };
}
// 地形起伏：营地（r<4.5）与湖区保持平整；近处细小起伏，远处（r>22）渐起连绵林地缓坡，
// 一直抬升到山脚。原先两层叠加正弦在大范围上呈明显周期条纹，改用梯度噪声 fBm。
// 树木与散布物按同一函数落地，不悬浮不下陷
function groundHeight(x, z) {
  const r = Math.hypot(x, z);
  const ramp = THREE.MathUtils.smoothstep(r, 4.5, 11);
  const lakeFlat = THREE.MathUtils.smoothstep(Math.hypot(x + 24, z + 38), 29, 36);
  const near = 0.32 * fbm2(x * 0.06, z * 0.06, 3, 4) + 0.08 * gradNoise2(x * 0.24, z * 0.24, 8);
  const far = THREE.MathUtils.smoothstep(r, 22, 62) * (0.6 + 1.1 * fbm2(x * 0.018, z * 0.018, 12, 3));
  return (near + far) * ramp * lakeFlat;
}
// 地面网格外缘（r>70）下潜到山体环下方：两者在 r≈71 处交接，
// 不再出现"方形地面到头、露出背景色"的断崖缝
const TERRAIN_SIZE = 150, TERRAIN_DIP_R0 = 70, TERRAIN_DIP_R1 = 80;
function terrainDip(x, z) {
  return 5 * THREE.MathUtils.smoothstep(Math.hypot(x, z), TERRAIN_DIP_R0, TERRAIN_DIP_R1);
}
const groundTex = makeGroundTextures();
groundTex.map.repeat.set(14, 14); groundTex.bumpMap.repeat.set(14, 14);   // 与旧版保持同样的纹素密度（≈10.7 m/重复）
const groundGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 75, 75);
{
  // 平面绕 X 轴旋转 -90° 后：局部 (x, y) → 世界 (x, -y)，局部 z 即世界高度
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = -pos.getY(i);
    pos.setZ(i, groundHeight(x, z) - terrainDip(x, z));
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({
    name: 'ForestSoil',
    map: groundTex.map, bumpMap: groundTex.bumpMap, bumpScale: 0.05,
    roughness: 0.97, metalness: 0.0
  })
);
ground.name = 'Terrain';
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
forestEnv.add(ground);

// 火堆周围的营地土细节层：一张不平铺的贴图叠在地面上，
// 打破近景的 12×12 平铺重复感；边缘羽化融入、中央让位炭床
{
  const S = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const rng = mulberry32(140);
  g.fillStyle = 'rgba(28,20,12,0.9)';
  g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, 7); g.fill();
  g.filter = 'blur(20px)';                                   // 大块踩踏明暗
  for (let i = 0; i < 22; i++) {
    const l = rng();
    g.fillStyle = `rgba(${30 + l * 40 | 0},${22 + l * 28 | 0},${13 + l * 18 | 0},0.55)`;
    g.beginPath(); g.ellipse(rng() * S, rng() * S, 36 + rng() * 80, 26 + rng() * 60, rng() * 3, 0, 7); g.fill();
  }
  g.filter = 'blur(5px)';                                    // 环火来回走动的踩踏弧痕
  for (let i = 0; i < 9; i++) {
    const rr = 92 + rng() * 130, a0 = rng() * 6.28;
    g.strokeStyle = `rgba(16,11,6,${0.18 + rng() * 0.2})`;
    g.lineWidth = 7 + rng() * 12;
    g.beginPath(); g.arc(S / 2, S / 2, rr, a0, a0 + 0.7 + rng() * 1.6); g.stroke();
  }
  g.filter = 'none';
  for (let i = 0; i < 3600; i++) {                           // 细颗粒碎屑
    const l = rng();
    g.fillStyle = `rgba(${34 + l * 58 | 0},${25 + l * 42 | 0},${15 + l * 28 | 0},${0.25 + rng() * 0.4})`;
    g.fillRect(rng() * S, rng() * S, 1 + rng() * 2.2, 1 + rng() * 2.2);
  }
  g.globalCompositeOperation = 'destination-in';             // 边缘羽化蒙版
  const m = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  m.addColorStop(0, 'rgba(0,0,0,0.9)');
  m.addColorStop(0.55, 'rgba(0,0,0,0.9)');
  m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  // 贴花外缘（r=5.2）已进入地形起伏区：顶点逐个贴合 groundHeight，
  // 避免平面贴花边缘一半埋进土里、一半悬空（原先固定 y=0.012 的平圆会与缓坡相交闪烁）
  const patchGeo = new THREE.CircleGeometry(5.2, 48);
  {
    const p = patchGeo.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, groundHeight(p.getX(i), -p.getY(i)) + 0.012);
    patchGeo.computeVertexNormals();
  }
  const patch = new THREE.Mesh(
    patchGeo,
    new THREE.MeshStandardMaterial({ name: 'CampSoilDecal', map: tex, transparent: true, roughness: 1, depthWrite: false })
  );
  patch.name = 'CampGroundPatch';
  patch.rotation.x = -Math.PI / 2;
  patch.receiveShadow = true;
  forestEnv.add(patch);
}

// 近景散布：碎石与枯枝（各一个 InstancedMesh，各一次 draw call），
// 填补火堆到树线之间的"空地"，火光斜照下有细碎投影
{
  const rng = mulberry32(133);
  const dummy = new THREE.Object3D();
  const q = new THREE.Quaternion(), qy = new THREE.Quaternion();
  const Z_AXIS = new THREE.Vector3(0, 0, 1), Y_AXIS = new THREE.Vector3(0, 1, 0);

  const pebbles = new THREE.InstancedMesh(
    makeRockGeometry(1, 4.2, 0.34),
    new THREE.MeshStandardMaterial({ name: 'Pebble', color: 0x4d4336, roughness: 0.96, flatShading: true }),
    64
  );
  pebbles.name = 'Pebbles';
  for (let i = 0; i < 64; i++) {
    const a = rng() * Math.PI * 2, r = 1.45 + 7.2 * Math.sqrt(rng());
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const s = 0.022 + rng() * 0.042;
    dummy.position.set(x, groundHeight(x, z) + s * 0.45, z);
    dummy.rotation.set(rng() * 3, rng() * 3, rng() * 3);
    dummy.scale.set(s * (0.8 + rng() * 0.5), s * 0.7, s);
    dummy.updateMatrix();
    pebbles.setMatrixAt(i, dummy.matrix);
  }
  pebbles.receiveShadow = true;
  forestEnv.add(pebbles);

  const twigs = new THREE.InstancedMesh(
    makeLogGeometry(0.7, 1, 1, 6.1),
    new THREE.MeshStandardMaterial({ name: 'Twig', color: 0x2e2013, roughness: 1 }),
    30
  );
  twigs.name = 'Twigs';
  dummy.rotation.set(0, 0, 0);
  for (let i = 0; i < 30; i++) {
    const a = rng() * Math.PI * 2, r = 1.6 + 6.8 * Math.sqrt(rng());
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const rad = 0.008 + rng() * 0.008, len = 0.16 + rng() * 0.3;
    dummy.position.set(x, groundHeight(x, z) + rad, z);
    q.setFromAxisAngle(Z_AXIS, Math.PI / 2 + (rng() - 0.5) * 0.24);   // 倒放
    qy.setFromAxisAngle(Y_AXIS, rng() * Math.PI * 2);                  // 再随机朝向
    dummy.quaternion.copy(qy.multiply(q));
    dummy.scale.set(rad, len, rad);
    dummy.updateMatrix();
    twigs.setMatrixAt(i, dummy.matrix);
  }
  twigs.castShadow = true;
  twigs.receiveShadow = true;
  forestEnv.add(twigs);
  dummy.quaternion.identity();
}

// 星空：大气闪烁（scintillation）——低空星光穿过更厚的大气，闪烁越明显；
// 每颗星有独立的相位/速度/振幅
let starMat;
{
  const N = 1800;
  const pos = new Float32Array(N * 3);
  const phase = new Float32Array(N);
  const speed = new Float32Array(N);
  const amp = new Float32Array(N);
  const size = new Float32Array(N);
  const dpr = Math.min(devicePixelRatio, 2);
  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.95);            // 偏向天顶的半球分布
    const r = 380;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi) + 5;
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const elev = Math.cos(phi);                              // 1=天顶 0=地平线
    phase[i] = Math.random() * Math.PI * 2;
    speed[i] = 1.5 + Math.random() * 4;
    amp[i]   = 0.12 + 0.33 * (1 - elev);                     // 低空闪烁更强
    size[i]  = (1.0 + Math.random() * 1.9) * dpr;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
  g.setAttribute('aAmp',   new THREE.BufferAttribute(amp, 1));
  g.setAttribute('aSize',  new THREE.BufferAttribute(size, 1));
  starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: /* glsl */`
      attribute float aPhase;
      attribute float aSpeed;
      attribute float aAmp;
      attribute float aSize;
      varying float vTw;
      uniform float uTime;
      void main() {
        vTw = 1.0 - aAmp * (0.5 + 0.5 * sin(uTime * aSpeed + aPhase));
        gl_PointSize = aSize;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying float vTw;
      void main() {
        float dd = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.08, dd) * vTw * 0.9;
        if (a < 0.01) discard;
        gl_FragColor = vec4(vec3(0.80, 0.85, 1.0) * vTw, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true,
    depthWrite: false
  });
  scene.add(new THREE.Points(g, starMat));
}

// 通用：径向渐变贴图（月晕、炭床余光）
function radialTexture(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) grad.addColorStop(o, col);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// 月亮（参考图：默认视角左上方，带月晕和云）+ 微弱月光
const moonDir = new THREE.Vector3(-0.86, 0.22, -0.46).normalize();
let moonLight, moonMat, moonHalo, moonSide, moonTLit;   // 由天气系统在 step 里驱动月相/遮月
let hemiLight, skyDome;                                  // 夜空天光 / 渐变天穹
const clouds = [];                                       // 漂移云层（含基准位与速度）
{
  const moonPos = moonDir.clone().multiplyScalar(330);
  const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), moonDir).normalize();

  // 程序化月面贴图：基底噪声 + 月海暗斑 + 带亮缘的陨石坑
  const moonTex = (() => {
    const S = 512;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    const rng = mulberry32(77);
    g.fillStyle = '#c9c9c4';
    g.fillRect(0, 0, S, S);
    for (let i = 0; i < 9000; i++) {
      const l = (175 + rng() * 70) | 0;
      g.fillStyle = `rgba(${l},${l},${l - 4},${0.10 + rng() * 0.12})`;
      g.fillRect(rng() * S, rng() * S, 1 + rng() * 2.5, 1 + rng() * 2.5);
    }
    g.filter = 'blur(16px)';                       // 月海
    for (let i = 0; i < 7; i++) {
      g.fillStyle = `rgba(118,120,124,${0.35 + rng() * 0.25})`;
      g.beginPath();
      g.ellipse(rng() * S, rng() * S, 36 + rng() * 70, 26 + rng() * 50, rng() * 3, 0, 7);
      g.fill();
    }
    for (let i = 0; i < 70; i++) {                 // 陨石坑：暗底 + 偏移亮缘
      const x = rng() * S, y = rng() * S, r = 2.5 + rng() * rng() * 15;
      g.filter = `blur(${Math.max(0.5, r * 0.12)}px)`;
      g.fillStyle = `rgba(95,95,96,${0.32 + rng() * 0.22})`;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      g.strokeStyle = `rgba(235,235,228,${0.30 + rng() * 0.25})`;
      g.lineWidth = Math.max(1, r * 0.22);
      g.beginPath(); g.arc(x - r * 0.12, y - r * 0.12, r, -2.7, 0.5); g.stroke();
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  // 3D 月球：真实球体几何 + 按太阳方向的朗伯明暗（凸月相、明暗界线、暗面地照）
  // 用相位角精确构造太阳方向：S = (月→地)·cosα + 切向·sinα
  // α=138° → 受光面 (1+cosα)/2 ≈ 13%，标准蛾眉月，弯口朝画面左下
  const PHASE = THREE.MathUtils.degToRad(138);
  const tLit = new THREE.Vector3()
    .addScaledVector(side, -0.94)        // 受光缘朝画面右侧
    .setY(0.34)                          // 略偏上 → 月牙双角指向左下
    .normalize();
  tLit.addScaledVector(moonDir, -tLit.dot(moonDir)).normalize();   // 正交化到视线垂面
  const sunDirW = moonDir.clone().multiplyScalar(-Math.cos(PHASE))
    .addScaledVector(tLit, Math.sin(PHASE))
    .normalize();
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(11, 48, 48),
    new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: moonTex },
        uSunDir: { value: sunDirW },
        uDim: { value: 1 },                      // 云层遮月时整体压暗
        uAir: { value: new THREE.Color() }       // 月亮方向的天空底色（step 中与天穹同步）
      },
      vertexShader: /* glsl */`
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vNormal = normalize(mat3(modelMatrix) * normal);
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: /* glsl */`
        varying vec3 vNormal;
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform vec3 uSunDir;
        uniform float uDim;
        uniform vec3 uAir;
        void main() {
          float d = clamp(dot(normalize(vNormal), uSunDir), 0.0, 1.0);
          // 0.018 ≈ 地照："新月抱旧月"的暗面微光。原值 0.06 让暗面比夜空亮 7 倍，
          // 月牙看起来像一块被照亮的灰色石球；地照应只是隐约可辨
          float l = 0.018 + 2.1 * d;
          vec3 col = texture2D(uMap, vUv).rgb * l * uDim;
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          // 大气散射光位于观察者与月面之间：叠加月亮方向的天空色，
          // 暗面至多与周围夜空一样暗，不会在月晕里抠出一个黑洞
          gl_FragColor.rgb += uAir;
          #include <colorspace_fragment>
        }`
    })
  );
  moon.position.copy(moonPos);
  moon.rotation.y = 1.6;
  scene.add(moon);
  moonMat = moon.material; moonSide = side.clone(); moonTLit = tLit.clone();

  // 月晕
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTexture(128, [
      [0, 'rgba(190,210,255,0.35)'], [0.25, 'rgba(150,175,230,0.14)'], [1, 'rgba(120,150,210,0)']
    ]),
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending
  }));
  halo.position.copy(moonPos);
  halo.scale.setScalar(78);
  scene.add(halo);
  moonHalo = halo;

  // 月旁的云（柔和椭圆叠加的画布贴图）
  const cloudTex = (() => {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.filter = 'blur(13px)';
    const rng = mulberry32(31);
    for (let i = 0; i < 10; i++) {
      g.fillStyle = `rgba(255,255,255,${0.10 + rng() * 0.14})`;
      g.beginPath();
      g.ellipse(48 + rng() * 160, 42 + rng() * 44, 18 + rng() * 34, 9 + rng() * 13, 0, 0, 7);
      g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  const rng = mulberry32(63);
  for (let i = 0; i < 7; i++) {
    const baseOp = 0.35 + rng() * 0.3;
    const cl = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cloudTex, color: 0x8ea3c8, transparent: true,
      opacity: baseOp, depthWrite: false, fog: false
    }));
    const sideOff = (rng() - 0.5) * 360;                       // 沿天空横向铺开（含画面外，供漂移轮回）
    const base = moonPos.clone().add(new THREE.Vector3(0, (rng() - 0.55) * 60, 0));
    cl.position.copy(base).addScaledVector(side, sideOff);
    cl.scale.set(120 + rng() * 90, 34 + rng() * 22, 1);
    scene.add(cl);
    // 缓慢横向漂移：风越大云走得越快；off 在 ±240 间轮回
    clouds.push({ sprite: cl, base, off: sideOff, baseOp, speed: 2 + rng() * 5 });
  }

  moonLight = new THREE.DirectionalLight(0x91a8d0, 0.12);   // 月牙的环境月光更弱
  moonLight.name = 'MoonLight';
  moonLight.position.copy(moonDir).multiplyScalar(50);
  scene.add(moonLight);

  // 夜空天光（半球光）：原值 0x202c44 × 0.22 换算到线性空间后照度只有 ~0.005，
  // 等于没有——火光照不到的地面、树、山全部死黑（"黑面"）。改为物理量级合理的
  // 冷蓝天光，强度随月光滑块与云量在 step() 中联动
  hemiLight = new THREE.HemisphereLight(0x8ea4d2, 0x2a2218, 0.36);
  hemiLight.name = 'SkyLight';
  scene.add(hemiLight);

  // 天空穹顶：天顶深、地平线略亮的渐变 + 月亮方位的微弱辉光。
  // 地平线色 = 雾色：远处地面/远山被雾融进地平线，不再与纯色背景之间出现硬边；
  // 深色山体剪影也因此能从稍亮的地平线上读出来
  skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(460, 32, 16),
    new THREE.ShaderMaterial({
      uniforms: {
        uZenith: { value: new THREE.Color(SKY.forest.zenith) },
        uHorizon: { value: new THREE.Color(SKY.forest.horizon) },
        uGlow: { value: new THREE.Color(0x1a2a48) },
        uMoonDir: { value: moonDir },
        uGlowK: { value: 1 }
      },
      vertexShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: /* glsl */`
        varying vec3 vDir;
        uniform vec3 uZenith, uHorizon, uGlow, uMoonDir;
        uniform float uGlowK;
        void main() {
          vec3 d = normalize(vDir);
          float h = clamp(d.y, 0.0, 1.0);
          vec3 col = mix(uHorizon, uZenith, pow(h, 0.42));
          float m = max(dot(d, uMoonDir), 0.0);
          col += uGlow * (0.35 * pow(m, 6.0) + 0.5 * pow(m, 40.0)) * uGlowK;
          gl_FragColor = vec4(col, 1.0);
          #include <colorspace_fragment>
        }`,
      side: THREE.BackSide, depthWrite: false, fog: false
    })
  );
  skyDome.name = 'SkyDome';
  skyDome.userData.noExport = true;
  skyDome.renderOrder = -10;
  scene.add(skyDome);
}

// 设置月相：由相位角重算太阳方向 S = (月→地)·(-cosα) + 切向·sinα
function setMoonPhase(deg) {
  if (!moonMat) return;
  const ph = THREE.MathUtils.degToRad(deg);
  moonMat.uniforms.uSunDir.value.copy(moonDir).multiplyScalar(-Math.cos(ph))
    .addScaledVector(moonTLit, Math.sin(ph)).normalize();
}

/* ============================================================
   远山：环形山体高度场（旧版是 20 个噪声球体——近乎垂直的"墙"、
   只占半圈地平线、底部悬在地面之外、MeshBasic 不受光，是明显的低质量建模）
   新版：一整圈极坐标网格，内缘贴在地面网格下方无缝衔接，向外抬升为
   脊状多重分形山脉；月亮/湖面方向压低成缓岭留出赏月视野，其余方向高峻带雪顶。
   受月光/天光照明，顶点色区分林带、岩石、积雪，低坡散布针叶林剪影
   ============================================================ */
const MOON_AZ = Math.atan2(moonDir.z, moonDir.x);
const LAKE_AZ = Math.atan2(-38, -24);                   // 默认视角正对湖面的方位

// 通用环形地形网格：极坐标 (r, az) 栅格，径向由密到疏；heightFn / colorFn 决定形状与着色。
// 顶点在接缝处共享（闭合环），法线平滑无缝
function makeRingTerrain({ rIn, rOut, radial, angular, azFrom = -Math.PI, azTo = Math.PI, heightFn, colorFn }) {
  const closed = Math.abs(azTo - azFrom - Math.PI * 2) < 1e-6;
  const cols = closed ? angular : angular + 1;
  const pos = new Float32Array((radial + 1) * cols * 3);
  const uv = new Float32Array((radial + 1) * cols * 2);
  for (let j = 0, k = 0; j <= radial; j++) {
    const r = rIn + (rOut - rIn) * Math.pow(j / radial, 1.35);
    for (let i = 0; i < cols; i++, k++) {
      const az = azFrom + (azTo - azFrom) * i / angular;
      const x = Math.cos(az) * r, z = Math.sin(az) * r;
      pos[k * 3] = x; pos[k * 3 + 1] = heightFn(x, z); pos[k * 3 + 2] = z;
      uv[k * 2] = x / 24; uv[k * 2 + 1] = z / 24;         // 平面投影 UV（Blender 中可直接铺材质）
    }
  }
  const idx = [];
  for (let j = 0; j < radial; j++) {
    for (let i = 0; i < angular; i++) {
      const i1 = closed ? (i + 1) % cols : i + 1;
      const a = j * cols + i, b = j * cols + i1, c = (j + 1) * cols + i, d = (j + 1) * cols + i1;
      idx.push(a, b, c, b, d, c);                        // 法线朝上
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const col = new Float32Array(pos.length);
  const nrm = geo.attributes.normal.array, c = [0, 0, 0];
  for (let k = 0; k < pos.length; k += 3) {
    colorFn(pos[k], pos[k + 1], pos[k + 2], nrm[k + 1], c);
    col[k] = c[0]; col[k + 1] = c[1]; col[k + 2] = c[2];
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

// 远景材质：顶点色 + 随海拔变稀的雾（仍受雾滑块/雨量控制）。
// 统一 FogExp2 在 100 m 外已把山体吞成背景色；按高度把雾密度降到 ~45%，
// 高处山脊保留层次，山脚仍与近处林地一样融入夜雾
function makeDistantMaterial(name) {
  return applyDistantFog(new THREE.MeshStandardMaterial({ name, vertexColors: true, roughness: 0.96, metalness: 0 }));
}
function applyDistantFog(mat) {
  mat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <fog_pars_vertex>', '#include <fog_pars_vertex>\nvarying float vWorldY;')
      .replace('#include <fog_vertex>', '#include <fog_vertex>\nvWorldY = (modelMatrix * vec4(transformed, 1.0)).y;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <fog_pars_fragment>', '#include <fog_pars_fragment>\nvarying float vWorldY;')
      .replace('#include <fog_fragment>', /* glsl */`
        #ifdef USE_FOG
          float fogD = fogDensity * mix(1.0, 0.45, smoothstep(2.0, 26.0, vWorldY));
          float fogF = 1.0 - exp(-fogD * fogD * vFogDepth * vFogDepth);
          gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, fogF);
        #endif`);
  };
  mat.customProgramCacheKey = () => 'distant-fog';
  return mat;
}

// 远景针叶林剪影：两层小锥体合并成一个网格（一次 draw call），沿山脚/低坡散布，
// 让山脊线呈现参差的林冠轮廓。positions: [[x, y, z, h], ...]
function makeSilhouetteForest(positions, seed, palette) {
  const rng = mulberry32(seed);
  const parts = [];
  const cone = (rad, h, y0) => {
    const g = new THREE.ConeGeometry(rad, h, 6, 1, true);
    g.translate(0, y0 + h / 2, 0);
    return g;
  };
  for (const [x, y, z, h] of positions) {
    const w = h * (0.26 + rng() * 0.1);
    const g = mergeGeometries([cone(w, h * 0.72, 0), cone(w * 0.66, h * 0.55, h * 0.45)]);
    g.rotateY(rng() * Math.PI);
    g.translate(x, y - 0.4, z);
    const n = g.attributes.position.count, col = new Float32Array(n * 3);
    const k = 0.75 + rng() * 0.5;
    const p = g.attributes.position;
    for (let i = 0; i < n; i++) {
      const up = (p.getY(i) - y) / h;                    // 树冠上部略亮（受天光）
      col[i * 3] = palette[0] * k * (0.8 + 0.4 * up);
      col[i * 3 + 1] = palette[1] * k * (0.8 + 0.4 * up);
      col[i * 3 + 2] = palette[2] * k * (0.8 + 0.4 * up);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.deleteAttribute('uv');
    parts.push(g);
  }
  return mergeGeometries(parts);
}

const MTN_COLORS = {
  soil:   [0.024, 0.019, 0.013],
  forest: [0.012, 0.021, 0.014],
  rock:   [0.070, 0.068, 0.066],
  snow:   [0.46, 0.50, 0.56]
};
function mountainHeight(x, z) {
  const S = THREE.MathUtils.smoothstep;
  const r = Math.hypot(x, z), az = Math.atan2(z, x);
  // 方位包络：月亮方向（略偏湖面一侧）为低缓远岭，离开这一走廊迅速抬升为主峰群
  const open = 1 - S(Math.abs(angDiff(az, MOON_AZ + 0.12)), 0.2, 1.0);
  const amp = THREE.MathUtils.lerp(58, 16, open)
            * (0.78 + 0.4 * fbm2(Math.cos(az) * 1.6 + 7, Math.sin(az) * 1.6 - 3, 41, 3));
  // 山脚起点：湖面方向后退，给湖面远岸（r≈72）留出平地
  const r0 = 71 + 11 * (1 - S(Math.abs(angDiff(az, LAKE_AZ)), 0.15, 0.75));
  const rise = S(r, r0 + 6, r0 + 70) * (1 - 0.3 * S(r, 175, 215));
  const ridge = ridged2(x * 0.0105, z * 0.0105, 5, 6);
  const foot = (2.5 + 5 * (0.5 + 0.5 * fbm2(x * 0.028, z * 0.028, 23, 4))) * S(r, r0, r0 + 22);
  return groundHeight(x, z) - 0.28 + foot + amp * rise * (0.12 + 1.35 * ridge);
}
function mountainColor(x, y, z, ny, out) {
  const S = THREE.MathUtils.smoothstep;
  const n = fbm2(x * 0.045, z * 0.045, 77, 3);
  const C = MTN_COLORS;
  const rk = 0.7 + 0.55 * (0.5 + 0.5 * n);
  let r = C.rock[0] * rk, g = C.rock[1] * rk, b = C.rock[2] * rk;
  const treeline = 19 + 7 * n;
  const fw = (1 - S(y, treeline - 6, treeline + 3)) * S(ny, 0.52, 0.78);
  r += (C.forest[0] - r) * fw; g += (C.forest[1] - g) * fw; b += (C.forest[2] - b) * fw;
  const sw = S(y + 8 * n, 33, 40) * S(ny, 0.42, 0.7);  // 雪只积在高处的缓坡上，陡崖露岩
  r += (C.snow[0] - r) * sw; g += (C.snow[1] - g) * sw; b += (C.snow[2] - b) * sw;
  const lw = 1 - S(y, 0.6, 3.5);                       // 山脚最低处与林地土色衔接
  r += (C.soil[0] - r) * lw; g += (C.soil[1] - g) * lw; b += (C.soil[2] - b) * lw;
  out[0] = r; out[1] = g; out[2] = b;
}
const mountains = new THREE.Group();
mountains.name = 'Mountains';
{
  const mat = makeDistantMaterial('MountainTerrain');
  const ring = new THREE.Mesh(makeRingTerrain({
    rIn: 64, rOut: 215, radial: 72, angular: 360,
    heightFn: mountainHeight, colorFn: mountainColor
  }), mat);
  ring.name = 'MountainRange';
  mountains.add(ring);

  // 山脚与低坡的林冠剪影：只长在林线以下、坡度不陡处
  const rng = mulberry32(404);
  const pts = [];
  for (let tries = 0; tries < 9000 && pts.length < 1500; tries++) {
    const az = rng() * Math.PI * 2 - Math.PI;
    const r = 70 + Math.pow(rng(), 1.6) * 85;
    const x = Math.cos(az) * r, z = Math.sin(az) * r;
    const y = mountainHeight(x, z);
    if (y < 0.8) continue;                              // 湖岸平地不种
    const e = 1.5;
    const sx = (mountainHeight(x + e, z) - mountainHeight(x - e, z)) / (2 * e);
    const sz = (mountainHeight(x, z + e) - mountainHeight(x, z - e)) / (2 * e);
    const ny = 1 / Math.hypot(sx, 1, sz);
    const n = fbm2(x * 0.045, z * 0.045, 77, 3);
    if (y > 17 + 7 * n || ny < 0.72) continue;
    if (fbm2(x * 0.05, z * 0.05, 91, 3) < -0.15) continue;   // 林间空地，成片而不均匀
    pts.push([x, y, z, 5 + rng() * 5]);
  }
  const belt = new THREE.Mesh(makeSilhouetteForest(pts, 405, MTN_COLORS.forest), mat);
  belt.name = 'MountainForest';
  mountains.add(belt);
}
forestEnv.add(mountains);

// 月光下的湖面（带倒影光带和碎波）
const lakeGlints = [];
{
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.filter = 'blur(16px)';
  g.fillStyle = '#1a3052';
  g.beginPath(); g.ellipse(128, 128, 112, 96, 0, 0, 7); g.fill();
  g.filter = 'blur(7px)';
  g.fillStyle = 'rgba(180,205,255,0.45)';
  g.beginPath(); g.ellipse(128, 138, 11, 86, 0, 0, 7); g.fill();
  g.filter = 'blur(1.5px)';
  const rng = mulberry32(12);
  for (let i = 0; i < 26; i++) {
    g.fillStyle = `rgba(190,215,255,${0.25 + rng() * 0.35})`;
    g.fillRect(118 + (rng() - 0.5) * 44, 60 + rng() * 160, 6 + rng() * 16, 1.6);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const lakeGroup = new THREE.Group();
  lakeGroup.name = 'Lake';
  lakeGroup.position.set(-24, 0.02, -38);
  lakeGroup.rotation.y = 1.08;            // 倒影光带朝向月亮方位
  const lake = new THREE.Mesh(
    new THREE.CircleGeometry(17, 48),
    new THREE.MeshBasicMaterial({ name: 'LakeSurface', map: tex, transparent: true, depthWrite: false })
  );
  lake.name = 'LakeSurface';
  lake.rotation.x = -Math.PI / 2;
  lake.scale.set(1.6, 1.15, 1);
  lakeGroup.add(lake);
  // 动态碎波：月光倒影带上漂移、明灭的细长闪光片（叠加混合），
  // 静态贴图湖面由此"活"起来；云厚时随月光一起变暗
  {
    const glintTex = radialTexture(64, [
      [0, 'rgba(214,230,255,0.9)'], [0.4, 'rgba(180,205,255,0.35)'], [1, 'rgba(150,180,255,0)']
    ]);
    const gg = new THREE.PlaneGeometry(1, 1);
    const grng = mulberry32(52);
    for (let i = 0; i < 16; i++) {
      const mesh = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({
        map: glintTex, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false
      }));
      mesh.rotation.x = -Math.PI / 2;
      const x0 = (grng() - 0.5) * 3.2, z0 = (grng() - 0.5) * 18;
      mesh.position.set(x0, 0.03, z0);
      mesh.scale.set(0.8 + grng() * 1.3, 0.12 + grng() * 0.12, 1);
      lakeGroup.add(mesh);
      lakeGlints.push({
        mesh, x0, z0, ph: grng() * 6.28,
        sp: 0.5 + grng() * 1.6, baseOp: 0.3 + grng() * 0.4
